[package]
name = "verkstead-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "verkstead_cli"
path = "src/lib.rs"

[[bin]]
name = "verkstead"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
verkstead-schema.workspace = true
# `verkstead serve` is the server: the CLI links the library and runs it, rather
# than shipping a second binary beside this one (ADR-0004).
verkstead-server = { path = "../server" }
clap.workspace = true
serde-saphyr.workspace = true
# The runtime `serve` starts, and — on Windows only — the one an ask over a
# named pipe gives its reads and writes a deadline on. The other verbs are
# blocking calls, so a runtime is started by the verb that needs one rather than
# wrapped around `main`, and the pipe's is a current-thread runtime that drives
# its I/O on the thread already blocking on it. See `src/pipe.rs`.
tokio.workspace = true
# Where the server's `tracing` goes is the starting binary's call rather than
# the library's, so the subscriber lives here — see `serve`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# **Pinned to a minor rather than a major**, which takes a tilde rather than the
# default. The named-pipe transport in `src/pipe.rs` is written against
# `ureq::unversioned::transport`, whose own documentation says it does not follow
# semver yet and that breaking changes to it land in *minor* versions. `"3"` and
# `"3.3"` are both caret requirements and both stop only at 4, so either would
# take one of those on an ordinary `cargo update`; `"~3.3"` stops at 3.4, which
# is the patches and no more.
ureq = "~3.3"

# What a Windows session asks through: the named pipe the server listens on
# beside its socket, opened here by `src/pipe.rs`. `tokio` gains the pipe itself
# and the deadline every read and write is given; `windows-sys` is the one
# constant that says an instance is momentarily taken rather than absent, and it
# is the same binding the server crate uses.
[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["io-util", "net", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
# The tests run the real server in-process, so the round trip they check is the
# one the agent gets.
axum = "0.8"
# For the one test that drives a running server the way the workbench does — the
# viewer's namespace speaks JSON where the agents' half speaks YAML.
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["net", "time"] }
# Asking the Router a question without a socket under it, which is what the
# Windows sandbox test needs: the server it stands up listens on a named pipe
# and nothing else, and the human answering a Set is a request that has to reach
# the same router the session is held by. The same version the server crate's
# own tests ask one with.
tower = { version = "0.5", features = ["util"] }
