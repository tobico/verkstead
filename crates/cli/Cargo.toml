[package]
name = "verkstead-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "verkstead_cli"
path = "src/lib.rs"

[[bin]]
name = "verkstead"
path = "src/main.rs"

# The tray app is a verb of this binary rather than a second one, and the
# feature is what a build says it wants the tray half of (ADR-0012, amended).
#
# **On by default**, because the invariant the sandbox stands on is that the
# image a session is handed is the image the server is running: a Verkstead that
# serves has to be one that also asks, and every build that says nothing gets
# both halves. Off is what the headless artifacts say — the static musl CLI and
# the nix daemon package — and turning it off is also what polices the GUI
# dependencies: GTK is not linked into a build with the feature off, so a use of
# it from outside this feature fails that leg loudly rather than arriving in the
# headless binary by accident.
[features]
default = ["desktop"]
desktop = ["dep:verkstead-desktop", "dep:tracing"]

[dependencies]
anyhow.workspace = true
verkstead-schema.workspace = true
# The tray app, run in-process out of this binary rather than out of a second
# one — see the `desktop` feature above, which is what carries it.
verkstead-desktop = { path = "../desktop", optional = true }
# `verkstead serve` is the server: the CLI links the library and runs it, rather
# than shipping a second binary beside this one (ADR-0004).
verkstead-server = { path = "../server" }
clap.workspace = true
serde-saphyr.workspace = true
# The runtime `serve` starts, and — on Windows only — the one an ask over a
# named pipe gives its reads and writes a deadline on. The other verbs are
# blocking calls, so a runtime is started by the verb that needs one rather than
# wrapped around `main`, and the pipe's is a current-thread runtime that drives
# its I/O on the thread already blocking on it. See `src/pipe.rs`.
tokio.workspace = true
# The one event this binary emits itself: a `desktop` that stopped, said in the
# log file the tray app keeps because there is no terminal to say it in. The
# other verbs write to a terminal and want none of it.
tracing = { version = "0.1", optional = true }
# Where the server's `tracing` goes is the starting binary's call rather than
# the library's, so the subscriber lives here — see `serve`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# **Pinned to a minor rather than a major.** The named-pipe transport in
# `src/pipe.rs` is written against `ureq::unversioned::transport`, whose own
# documentation says it does not follow semver yet and that breaking changes to
# it land in *minor* versions. `3` would take one of those on an ordinary
# `cargo update`; `3.3` takes the patches and no more.
ureq = "3.3"

# What a Windows session asks through: the named pipe the server listens on
# beside its socket, opened here by `src/pipe.rs`. `tokio` gains the pipe itself
# and the deadline every read and write is given; `windows-sys` is the one
# constant that says an instance is momentarily taken rather than absent, and it
# is the same binding the server and desktop crates use.
[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["io-util", "net", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
# The tests run the real server in-process, so the round trip they check is the
# one the agent gets.
axum = "0.8"
# For the one test that drives a running server the way the workbench does — the
# viewer's namespace speaks JSON where the agents' half speaks YAML.
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["net", "time"] }
