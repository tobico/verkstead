[package]
name = "verkstead-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
# The rendering behind the viewer's namespace, and the types it answers with.
verkstead-render.workspace = true
verkstead-schema.workspace = true
verkstead-store.workspace = true
# The virtual terminal the Screen is: what a session's Capture leaves on a
# terminal, held as a grid and handed back as the escape sequences that would
# paint it (ADR 0007). asciinema's, which is the one written to be fed a
# recording rather than to draw a window — it parses and holds state, and has no
# renderer, no input handling and no platform half at all.
avt = "0.18"
# `ws` for the Screen a live session is watched over: the first bidirectional
# transport here, and the one place the viewer is sent something rather than
# fetching it (ADR 0007). Everything else stays on SSE and a refetch.
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
clap.workspace = true
# The random half of a Conversation's prefilled branch name.
getrandom.workspace = true
# The request `web-push-native` builds is an `http::Request`, and this is the
# crate that type comes from — shared with reqwest and axum, so it is the same
# request all the way out.
http = "1"
# Signing the VAPID header, which the store's keypair half of the dependency
# does not need: `ecdsa` is what turns the stored private key into a signature.
p256 = { workspace = true, features = ["ecdsa"] }
# Sending the push, and asking GitHub whether a newer Verkstead has been
# released — between them the whole of what Verkstead says to the public
# internet. Default
# features are off to keep OpenSSL out of the build: rustls, with the roots it
# bundles, is all that reaching an https endpoint takes. `json` is what reads
# GitHub's answer, and costs nothing beyond the serde_json already here.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# The viewer built into the binary — see `src/viewer.rs`. `mime-guess` is what
# names each file's content type on the way out; `interpolate-folder-path` is what
# lets the folder be written relative to this manifest rather than to whatever
# directory cargo was run from. `debug-embed` is deliberately *off*: in a debug
# build the files are then read off disk per request, so a `pnpm build` is visible
# to a running `cargo run -p verkstead-cli -- serve` without a recompile.
rust-embed = { version = "8", features = [
    "interpolate-folder-path",
    "mime-guess",
] }
# The engine behind the ignore rules in `settings`: a human's pattern for the
# comments Wrapping is never to address, compiled against whatever a bot writes
# on a pull request. This one rather than the `fancy-regex` syntect already
# pulls in, because its answer is linear in the length of what it is matched
# against whatever the pattern is — the patterns here are typed on a phone and
# the text is a stranger's comment, so a backtracking engine would be a way to
# hang the poll from either end.
regex = "1"
# Comparing the latest release's tag against the version this was built as.
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# A directory to clone a gist into on the way to publishing a share, cleaned up
# by dropping it — see `publishing`. A dependency rather than a dev-dependency
# now, which is where it was when only the tests made directories.
tempfile.workspace = true
time.workspace = true
# `process` and `io-util` are the session half: a grilling session is a child
# process whose output is read as it arrives, and neither the spawning nor the
# reading can block the runtime the server is answering requests on.
tokio = { workspace = true, features = [
    "io-util",
    # Not a socket here: `net` is what carries `AsyncFd`, which is how the
    # terminal is read without a thread parked on it.
    "net",
    "process",
    "signal",
    "sync",
    "time",
] }
# The Nudge stream is a broadcast channel turned into a `Stream` for axum's SSE
# response, which is the `sync` feature and nothing else here uses.
tokio-stream = { version = "0.1", features = ["sync"] }
# The events only; where they go is the starting binary's call, so the
# subscriber is the CLI's dependency rather than this crate's — see
# `crates/cli/src/serve.rs`.
tracing = "0.1"
# The aes128gcm encryption a push body has to be in. Default features off
# leaves out its VAPID half, which pulls a whole JWT stack in for what is one
# ES256 signature over two claims — p256 is already here to make it. 0.4 rather
# than 0.5 for the same reason: 0.5's hashing is a generation ahead of the one
# p256 uses, and would put two of every crypto crate in the tree.
web-push-native = { version = "0.4", default-features = false }

# The Unix half of the server: everything the session machinery does that is a
# syscall rather than a record.
#
# A table of its own rather than a plain dependency because rustix is the whole
# of what will not build on Windows — the pseudo-terminal a session runs on, the
# process group a fetch past its deadline is killed by, and the two exec-time
# calls the macOS keeper makes. Each of those has a Windows arm of its own or is
# gated where it is called; this is the crate under all four, and a Windows
# build carries none of it.
[target.'cfg(unix)'.dependencies]
# The passwd database, which is what says which shell a Conversation's terminal
# comes up in — see `src/terminals/shell.rs`. rustix below has no answer for it
# and could not: an account is what the name service says it is rather than what
# a syscall returns, so `getpwuid_r` is the call and libc is where it lives. The
# one thing this crate takes libc for, and it is already in the tree under
# rustix.
libc = "0.2"
# The pseudo-terminal a session runs on: opening the pair, sizing it, and giving
# the sandbox a controlling terminal — see `src/terminal/pty.rs`. Everything it
# needs is already in the tree under the crates that touch a file descriptor, so
# the features are the whole of what this adds: `fs` is the one open of the end
# the session gets, and `process` the `setsid` and `TIOCSCTTY` that make it that
# session's own terminal — and the group a stalled fetch is killed by.
rustix = { version = "1", features = ["fs", "process", "pty", "termios"] }

# And the Windows half of the same thing: the console a session runs on, the
# process started on it and the Job that holds everything that process starts —
# see `src/terminal/conpty.rs`. Spoken to through the same `windows-sys` the
# desktop crate is built on, so the tree carries one binding of Win32 rather
# than two.
[target.'cfg(windows)'.dependencies]
# One feature per header, which is how the tables above are cut up.
# `Win32_System_Console` is the pseudoconsole itself, `Win32_System_Pipes` and
# `Win32_Storage_FileSystem` the two pipes it is spoken to through — and the
# volume a path is on, which is what says whether the Profile's account can be
# hard-linked into a session's profile — `Win32_System_Threading` the
# `CreateProcessW` and its attribute list, and `Win32_System_JobObjects` what a
# session's whole process tree is held by. `Win32_System_IO` and
# `Win32_System_Ioctl` are the one control code Verkstead sends: the reparse
# point that makes a directory junction, which is how the account is joined in.
# `Win32_Security` is in it because every call that takes a security descriptor
# is declared behind it — each of these passes none.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
# Reading and writing the socket below, which is a `Stream` and a `Sink` and
# nothing else — the two traits are this crate's and are not in the standard
# library.
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
serde-saphyr.workspace = true
# Writing a row the store's own calls will not write: the tests about a state
# word this Verkstead cannot parse have to put one there by hand.
sqlx.workspace = true
# `test-util` for the runtime's own clock: a keep-alive is a quarter-minute
# apart, and no test should spend that waiting for one.
tokio = { workspace = true, features = ["test-util"] }
# Dialling the Screen's socket the way a browser does. It is the one endpoint a
# `oneshot` over the Router cannot ask about: an upgrade is a connection rather
# than a request. The same version axum's own `ws` half is built on, so the test
# and the server are speaking one protocol rather than two.
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
# The server's own log, in front of whoever is reading a failed test. What
# refuses a session — a sandbox that would not build, a console that would not
# open, a program that was not found — is written to `tracing` and answered to
# its caller as a bare refusal, so a suite with no subscriber is a suite whose
# every such failure reads *it printed nothing*. `env-filter` so that what is
# printed is this crate's own account rather than sqlx's every statement.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
