[package]
name = "verkstead-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
# The rendering behind the viewer's namespace, and the types it answers with.
verkstead-render.workspace = true
verkstead-schema.workspace = true
verkstead-store.workspace = true
# The virtual terminal the Screen is: what a session's Capture leaves on a
# terminal, held as a grid and handed back as the escape sequences that would
# paint it (ADR 0007). asciinema's, which is the one written to be fed a
# recording rather than to draw a window — it parses and holds state, and has no
# renderer, no input handling and no platform half at all.
avt = "0.18"
# `ws` for the Screen a live session is watched over: the first bidirectional
# transport here, and the one place the viewer is sent something rather than
# fetching it (ADR 0007). Everything else stays on SSE and a refetch.
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
clap.workspace = true
# The random half of a Conversation's prefilled branch name.
getrandom.workspace = true
# What this machine calls itself, which two things name it out of: the install
# run's status line, which says whose screen the password dialog is on — the
# reader may be on a phone on the tailnet, so *this machine* would name nothing
# — and what a device is shown under in a cluster (ADR 0020). One reading for
# both, in `src/platform.rs`. A crate rather than a syscall because the call is
# a different one on each platform and the answer is one string — `set` is off,
# nothing here renames anything.
hostname = { version = "0.4", default-features = false }
# This machine's own interfaces, which is the LAN half of the addresses a device
# advertises (ADR 0020) — see `src/device/reading.rs`. A crate for the reason
# `hostname` above is one: enumerating them is `getifaddrs` on a Unix and
# `GetAdaptersAddresses` on Windows, and this is those two behind one call. No
# socket is opened and nothing is probed — what it reads is what the kernel
# already knows. It brings nothing new into the build: `libc` and `windows-sys`
# are the two crates under it and the tree already carries both.
#
# Default features, which is that set: `link-local` is off, and what it would
# add is exactly what this must not advertise — an address no peer off this
# machine's own link could ever reach.
if-addrs = "0.15"
# How two Verksteads on one LAN find each other: mDNS, advertised and browsed
# from inside this process (ADR 0020, *Discovery*) — see `src/discovery.rs`. A
# crate rather than a dependency on the machine, which is the whole decision: no
# avahi to install on Linux, no Bonjour to find on Windows, and one behaviour on
# all three platforms rather than three ways of shelling out to somebody else's
# daemon.
#
# Default features, which is two. `async` is what lets the withdrawal be waited
# on from the runtime rather than by parking a thread on a channel; `logging`
# puts the daemon's own account of a multicast it could not speak where the rest
# of the server's log goes, a discovery that silently does not work being the
# only kind of failure this feature has.
#
# What it adds to the tree is one crate — `socket-pktinfo`, which is how a
# reply goes back out of the interface the query arrived on — and a second
# `flume`, its channel being a major ahead of the one `sqlx` holds.
# Everything else under it is already here: `if-addrs`, `socket2`, `mio`, `log`
# and `fastrand`. No cryptography and no C.
mdns-sd = "0.21"
# The watcher behind the `files` Nudge: the Worktrees a Code pane is drawn over,
# followed while it is attached (ADR 0019) — see `src/watchers.rs`. Each
# platform's own mechanism rather than a poll, which is the whole reason for a
# crate here: inotify on Linux, FSEvents on macOS, `ReadDirectoryChangesW` on
# Windows, and one API over the three. Default features, which is that set —
# the optional ones are channel implementations this has no use for, the events
# being bridged onto tokio's own.
notify = "8"
# The request `web-push-native` builds is an `http::Request`, and this is the
# crate that type comes from — shared with reqwest and axum, so it is the same
# request all the way out.
http = "1"
# Signing the VAPID header, which the store's keypair half of the dependency
# does not need: `ecdsa` is what turns the stored private key into a signature.
p256 = { workspace = true, features = ["ecdsa"] }
# Sending the push, asking GitHub whether a newer Verkstead has been
# released, and dialling the devices this one is linked to — the first two
# being the whole of what Verkstead says to the public
# internet. Default
# features are off to keep OpenSSL out of the build: rustls, with the roots it
# bundles, is all that reaching an https endpoint takes. `json` is what reads
# GitHub's answer, and costs nothing beyond the serde_json already here.
#
# And `stream` is the relay (ADR 0020) — see `src/relaying.rs`. A call put to a
# member is the browser's own request carried through, and an attachment is
# thirty-two megabytes of it, so the hop reads the body as a stream and writes
# the answer back as one rather than holding either. It adds `tokio-util`, and
# makes `futures-util` — here already under `tokio-stream` — reqwest's too. The
# one other name it puts in the lock file, `wasm-streams`, is reqwest's browser
# target and is built for nothing Verkstead is.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
# The viewer built into the binary — see `src/viewer.rs`. `mime-guess` is what
# names each file's content type on the way out; `interpolate-folder-path` is what
# lets the folder be written relative to this manifest rather than to whatever
# directory cargo was run from. `debug-embed` is deliberately *off*: in a debug
# build the files are then read off disk per request, so a `pnpm build` is visible
# to a running `cargo run -p verkstead-cli -- serve` without a recompile.
rust-embed = { version = "8", features = [
    "interpolate-folder-path",
    "mime-guess",
] }
# The device's own self-signed certificate, made at the first start beside the
# Workbench Key and read back at every one after it (ADR 0020) — see
# `src/device.rs`. Making one is new to this tree: `rustls` was here only as
# reqwest's way of reaching an https endpoint, and nothing generated a
# certificate at all.
#
# Default features off and each named back, so that the signing behind it is
# `ring` — already in the tree under reqwest's rustls — rather than the
# `aws_lc_rs` the defaults would also enable, which brings a C toolchain into
# the build for what ring is doing already. `crypto` is the key pair being
# generated here rather than handed in, and `pem` is the spelling the file on
# disk is kept in.
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
] }
# The engine behind the ignore rules in `settings`: a human's pattern for the
# comments Wrapping is never to address, compiled against whatever a bot writes
# on a pull request. This one rather than the `fancy-regex` syntect already
# pulls in, because its answer is linear in the length of what it is matched
# against whatever the pattern is — the patterns here are typed on a phone and
# the text is a stranger's comment, so a backtracking engine would be a way to
# hang the poll from either end.
regex = "1"
# The TLS the peer listener speaks (ADR 0020) — see `src/peer.rs`. A
# server-side stack is new to this tree: rustls was here only as reqwest's way
# of *reaching* an https endpoint, and nothing in the workspace ever presented
# a certificate or asked a caller for one.
#
# Default features off and each named back, because the defaults would bring
# `aws-lc-rs` and its C toolchain into the build for what `ring` — already here
# under reqwest — is doing already. `std` and `logging` are what the rest of
# the tree has; `tls12` is the one version below the one every device in a
# cluster of this build negotiates, kept so that this port is not the reason
# something older cannot reach it.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
# Reading the device's certificate back off the disk: the PEM its file holds,
# parsed into the DER the fingerprint is a hash of — and the private key beside
# it, parsed for no other reason than that half a pair is not an identity and a
# start is the moment to find that out. Already in the tree under reqwest's
# rustls, so it adds nothing to a build, and the types are the ones a TLS
# configuration takes: the identity is read into what will present it rather
# than into something that has to be converted first.
rustls-pki-types = "1"
# Comparing the latest release's tag against the version this was built as.
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
# The version a file read by the Code pane carries, which is a hash of its bytes
# and is what a write names itself as being over (ADR 0019) — see `src/files.rs`.
# A content hash rather than a modification time: two writes inside one clock
# tick are the collision this exists to catch, and a hash of the bytes cannot
# miss one. Already in the tree under p256, so what this line adds to a build is
# nothing.
sha2 = "0.10"
sqlx.workspace = true
# A directory to clone a gist into on the way to publishing a share, cleaned up
# by dropping it — see `publishing`. A dependency rather than a dev-dependency
# now, which is where it was when only the tests made directories.
tempfile.workspace = true
time.workspace = true
# Reading the provider keys out of a Codex account's `config.toml`, and writing
# the one a session's root is given — see `sandbox/root.rs`. The release already
# in the lockfile, which a build dependency brought in.
toml = "0.8"
# `process` and `io-util` are the session half: a grilling session is a child
# process whose output is read as it arrives, and neither the spawning nor the
# reading can block the runtime the server is answering requests on.
tokio = { workspace = true, features = [
    "io-util",
    # Not a socket here: `net` is what carries `AsyncFd`, which is how the
    # terminal is read without a thread parked on it.
    "net",
    "process",
    "signal",
    "sync",
    "time",
] }
# And the handshake itself, run over a tokio socket: what turns an accepted
# connection into one this server can read and write — see `src/peer.rs`. The
# same feature set as `rustls` above and for the same reason, so that one
# cryptographic library is in the build rather than two.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
# The Nudge stream is a broadcast channel turned into a `Stream` for axum's SSE
# response, which is the `sync` feature and nothing else here uses.
tokio-stream = { version = "0.1", features = ["sync"] }
# The events only; where they go is the starting binary's call, so the
# subscriber is the CLI's dependency rather than this crate's — see
# `crates/cli/src/serve.rs`.
tracing = "0.1"
# The aes128gcm encryption a push body has to be in. Default features off
# leaves out its VAPID half, which pulls a whole JWT stack in for what is one
# ES256 signature over two claims — p256 is already here to make it. 0.4 rather
# than 0.5 for the same reason: 0.5's hashing is a generation ahead of the one
# p256 uses, and would put two of every crypto crate in the tree.
web-push-native = { version = "0.4", default-features = false }
# Reading the expiry back out of the certificate this device presents, which is
# what says whether a re-issue is due (ADR 0020) — see `src/device.rs`. rcgen
# wrote that date and cannot be asked for it afterwards: what a later start
# finds on disk is a PEM file rather than the parameters it was made from, so
# the renewal reads the certificate the way any other tool would.
#
# The device suite reads it the same way and for a reason of its own — a test
# that took the validity back out of rcgen's own parameters would be a test of
# nothing — which is what this was here for before the server itself had to
# ask.
x509-parser = "0.18"

# The Unix half of the server: everything the session machinery does that is a
# syscall rather than a record.
#
# A table of its own rather than a plain dependency because rustix is the whole
# of what will not build on Windows — the pseudo-terminal a session runs on, the
# process group a fetch past its deadline is killed by, and the two exec-time
# calls the macOS keeper makes. Each of those has a Windows arm of its own or is
# gated where it is called; this is the crate under all four, and a Windows
# build carries none of it.
[target.'cfg(unix)'.dependencies]
# The passwd database, which is what says which shell a Conversation's terminal
# comes up in — see `src/terminals/shell.rs`. rustix below has no answer for it
# and could not: an account is what the name service says it is rather than what
# a syscall returns, so `getpwuid_r` is the call and libc is where it lives. The
# one thing this crate takes libc for, and it is already in the tree under
# rustix.
libc = "0.2"
# The pseudo-terminal a session runs on: opening the pair, sizing it, and giving
# the sandbox a controlling terminal — see `src/terminal/pty.rs`. Everything it
# needs is already in the tree under the crates that touch a file descriptor, so
# the features are the whole of what this adds: `fs` is the one open of the end
# the session gets, and `process` the `setsid` and `TIOCSCTTY` that make it that
# session's own terminal — and the group a stalled fetch is killed by.
rustix = { version = "1", features = ["fs", "process", "pty", "termios"] }

# And the Windows half of the same thing: the console a session runs on, the
# process started on it and the Job that holds everything that process starts —
# see `src/terminal/conpty.rs` — and the named pipe the server listens on beside
# its socket, which is what a session in a container will ask through — see
# `src/pipe.rs`. Spoken to through the same `windows-sys` the desktop crate is
# built on, so the tree carries one binding of Win32 rather than two.
[target.'cfg(windows)'.dependencies]
# One feature per header, which is how the tables above are cut up.
# `Win32_System_Console` is the pseudoconsole itself, `Win32_System_Pipes` and
# `Win32_Storage_FileSystem` the two pipes it is spoken to through — and the
# volume a path is on, which is what says whether the Profile's account can be
# hard-linked into a session's profile — `Win32_System_Threading` the
# `CreateProcessW` and its attribute list, and the process token the pipe's
# descriptor is written from, and `Win32_System_JobObjects` what a session's
# whole process tree is held by. `Win32_System_IO` and `Win32_System_Ioctl` are
# the one control code Verkstead sends: the reparse point that makes a directory
# junction, which is how the account is joined in. `Win32_Security` is the
# descriptor the server's pipe is created with — that account and nothing wider
# — and the token its identity is read out of; `Win32_Security_Authorization` is
# how both are written and read back, which is SDDL, the spelling of a
# descriptor a person can read. `Win32_NetworkManagement_NetManagement` is the
# local account a Windows session runs as, created and deleted — which is that
# platform's whole boundary: see `src/sandbox/account/machine.rs`, and
# `examples/session-account-probe.rs` before it. The three that go with that
# account are `Win32_Security_Authentication_Identity`, which is how a logon
# type is denied to it, `Win32_System_Registry`, which is how it is kept off
# the sign-in screen, and `Win32_UI_Shell`, which is the one call that deletes a
# profile directory *and* the machine's record of where it was.

# `Win32_System_StationsAndDesktops` is the window station and the desktop a
# process is on, which a boundary built on a restricted token has to write an
# entry on the way it writes one on a directory — see
# `examples/restricted-token-probe.rs`, which is the second mechanism being
# asked about after the first turned out not to host the agent at all.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",

  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
# Reading and writing the socket below, which is a `Stream` and a `Sink` and
# nothing else — the two traits are this crate's and are not in the standard
# library.
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
serde-saphyr.workspace = true
# Writing a row the store's own calls will not write: the tests about a state
# word this Verkstead cannot parse have to put one there by hand.
sqlx.workspace = true
# `test-util` for the runtime's own clock: a keep-alive is a quarter-minute
# apart, and no test should spend that waiting for one.
tokio = { workspace = true, features = ["test-util"] }
# Dialling the Screen's socket the way a browser does. It is the one endpoint a
# `oneshot` over the Router cannot ask about: an upgrade is a connection rather
# than a request. The same version axum's own `ws` half is built on, so the test
# and the server are speaking one protocol rather than two.
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
# The server's own log, in front of whoever is reading a failed test. What
# refuses a session — a sandbox that would not build, a console that would not
# open, a program that was not found — is written to `tracing` and answered to
# its caller as a bare refusal, so a suite with no subscriber is a suite whose
# every such failure reads *it printed nothing*. `env-filter` so that what is
# printed is this crate's own account rather than sqlx's every statement.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
