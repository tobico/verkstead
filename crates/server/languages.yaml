# The languages Verkstead ships knowing about, and the grammar every descriptor
# is written in — an installer's own as much as these. What is here is embedded
# in the binary; what an installer writes goes under `languages:` in
# `config.yaml` and merges into the entry of the same name, key by key, so
# changing one variable keeps every later fix to the rest.
#
# A descriptor is **data**: a label for the settings page, the manifests that
# detect the language in a Repo, the variables a session is given, and the
# capabilities it names. It cannot say a command to run. Anything that is
# behaviour — the Compile Server an sccache needs — is built into the server and
# switched on by name here.
#
# Two more keys belong to the same entry and are not written here, because what
# they say is a machine's rather than a release's:
#
#   enabled    whether sessions get this language at all. Absent is **on**, so
#              a language nobody has said anything about is one that works.
#
#   size       how big its store may grow, which is what `{size}` below stands
#              for. Absent is 30G.
#
# Those two are the only keys the settings page ever writes, so an entry an
# installer wrote keeps everything else in it when somebody saves that page.
# `rust_build_cache` in `config.yaml` is still read as Rust's two, and this map
# wins where both say something.
#
# A variable set to `null` is taken **out**: that is how an override drops one
# of the variables below without having to write the rest of them out again.
#
# Placeholders stand for the things only the server knows:
#
#   {cache}    the Build Cache: `--build-cache-dir`, or this machine's own cache
#              directory where nobody has said. Where a store goes that nothing
#              has to share a filesystem with.
#
#   {stores}   a directory beside the Worktrees, for a store that does. pnpm,
#              deno, bun and uv hardlink packages out of their store into the
#              project rather than copying them, and fall back to copying the
#              lot where the two are on different filesystems — and the Build
#              Cache is free to be a disk of its own, which is what the packaged
#              unit's separate `CacheDirectory` and `StateDirectory` are.
#
#              **And on Linux they copy anyway**, which is a fact about the
#              sandbox rather than about this placeholder: a Worktree and this
#              directory are two bind mounts, and `link(2)` answers `EXDEV`
#              across two mounts however many filesystems are underneath them.
#              So what a store here buys today is one download for the machine,
#              the same as `{cache}` — the space a hardlink saves waits on one
#              mount holding both, which is whoever changes what a session may
#              reach. See `tests/package_stores.rs`, where both halves of that
#              are proved.
#
#   {size}     how big this language's store may grow: this entry's own `size`
#              key, which the settings page writes, and 30G where nobody has.
#
#   {sccache}  the sccache this server found, at the path a session reaches it
#              by. Only inside the `sccache` capability below, which is what
#              says there is one at all.
#
# A placeholder's directory is made, and granted writable to a session, only
# where a loaded descriptor names it. Three of Node's stores below name
# `{stores}`, so every session with Node switched on is opened onto it; an
# installation with every language that names it switched off is opened onto
# none.
#
# **Write `/` between the placeholder and what is under it, on every platform.**
# A descriptor is one file read on three, so the grammar has one separator: what
# a Windows session is handed is the path its own tools compose, `\` and all.

languages:
  rust:
    # What the settings page calls it.
    label: Rust

    # What says a Repo builds this language, looked for at the root of a
    # checkout. **For the setup card's warning and nothing else**: the variables
    # below are every session's whatever the Repo holds, because a manifest is
    # often not at the root and a variable nothing reads costs nothing.
    detect:
      - Cargo.toml

    # The registry index, the `.crate` files downloaded into it and the sources
    # unpacked from them. This is the half of the cache that works with no
    # sccache anywhere, and what stops two Conversations downloading one crate
    # twice.
    env:
      CARGO_HOME: "{cache}/cargo"

    # And the capabilities this descriptor switches on. `sccache` is the Compile
    # Server: one sccache server for the machine, in a sandbox of its own,
    # started wherever a language naming this is enabled and there is an sccache
    # to run. A capability's variables are set only where the server can offer
    # it, so a machine with no sccache installed gets the downloads above and
    # none of these.
    capabilities:
      sccache:
        env:
          RUSTC_WRAPPER: "{sccache}"
          SCCACHE_DIR: "{cache}/sccache"
          SCCACHE_CACHE_SIZE: "{size}"

  go:
    # The second language Verkstead ships knowing about, and the first of the
    # package stores (ADR-0021). Nothing in the server changed to add it: it is
    # this entry, the proofs beside it, and `go` in the dev shell and in CI.
    label: Go

    # The module file, at the root of a checkout, for the setup card's warning
    # and nothing else — the variables below are every session's, exactly as
    # Rust's are.
    detect:
      - go.mod

    # Go keeps the two halves this stage cares about in two directories, and
    # names one variable for each — `go help environment`, checked against
    # go1.26 as this entry was written:
    #
    #   GOMODCACHE  "the directory where the go command will store downloaded
    #               modules". The downloads, which is what stops two
    #               Conversations fetching one module twice.
    #   GOCACHE     "the directory where the go command will store cached
    #               information for reuse in future builds". Compiled output,
    #               which for Go is nothing but a directory — there is no
    #               Compile Server to run and no capability to name.
    #
    # Both under `{cache}` rather than `{stores}`: `go build` compiles out of
    # the module cache where the module already is, so nothing is linked into
    # the Worktree and the two are free to be different filesystems. Both are
    # documented as safe for several `go` commands at once, which is the other
    # half of what a shared store has to be — see
    # <https://go.dev/ref/mod#module-cache>.
    #
    # And neither holds anything that is a session's own: a login is `~/.netrc`
    # and `GOPATH/bin` is a third directory, so what is shared here is
    # downloads and compiled objects and nothing else.
    env:
      GOMODCACHE: "{cache}/go/mod"
      GOCACHE: "{cache}/go/build"

  node:
    # The JavaScript ecosystem, and the second of the package stores. One entry
    # for every tool that installs from the npm registry rather than one each —
    # npm, pnpm, both yarns, deno and bun: switching Node off switches the lot
    # off, which is what one box on the settings page for an ecosystem means
    # (ADR-0021). deno and bun are not runtimes with entries of their own for
    # the same reason Berry is not: what they share is the npm registry's
    # packages, and a box per tool would be five boxes saying one thing.
    label: Node

    # The manifest every one of them reads, at the root of a checkout — for the
    # setup card's warning and nothing else, exactly as Rust's and Go's are.
    detect:
      - package.json

    # Six tools and seven variables between them, and **not one name shared**.
    # Each was read out of the tool that reads it as this entry was written —
    # `<tool> config get`, `bun pm cache`, `deno info`, against the releases the
    # dev shell and the CI job pin — rather than taken from a variable that
    # looks like it ought to work:
    #
    #   NPM_CONFIG_CACHE          npm's `cache`, which holds the packages it has
    #                             downloaded (`_cacache`) and what `--offline`
    #                             installs out of. npm's own `npm_config_`
    #                             prefix in its documented upper-case spelling,
    #                             which is one of the two forms npm reads.
    #
    #   PNPM_CONFIG_STORE_DIR     pnpm's `store-dir`: the content-addressable
    #                             store, **not** `PNPM_HOME`, which is where
    #                             pnpm puts global binaries and holds no
    #                             packages at all. `PNPM_CONFIG_` is pnpm's own
    #                             prefix — pnpm 11 reads neither `store-dir`
    #                             out of an `.npmrc` nor `npm_config_store_dir`
    #                             out of the environment.
    #
    #   PNPM_CONFIG_CACHE_DIR     and pnpm's `cache-dir`, which is the registry
    #                             metadata beside that store. Both halves, for
    #                             the reason Go gets both of its: an offline
    #                             install that has the packages and not the
    #                             metadata fails, `ERR_PNPM_NO_OFFLINE_META`.
    #
    #   YARN_CACHE_FOLDER         Yarn Classic's `cache-folder`. Classic is
    #                             yarn 1.x, still what `yarn` is on most
    #                             machines, and this is the only one of its
    #                             settings that moves the download.
    #
    #   YARN_GLOBAL_FOLDER        Yarn Berry's `globalFolder`, which is yarn 2
    #                             and up, and where Berry's cache is *by
    #                             default*. **Berry does not read
    #                             `YARN_CACHE_FOLDER` there**:
    #                             `enableGlobalCache` is on by default in Yarn
    #                             4, and Berry then disregards `cacheFolder`
    #                             and keeps the cache in `globalFolder/cache`.
    #                             So the two yarns are two variables naming two
    #                             directories, which is also what keeps
    #                             Classic's `v6` layout out of Berry's zips.
    #
    #                             A Repo that writes `enableGlobalCache: false`
    #                             sends Berry back to `cacheFolder`, which is
    #                             the directory above — shared, and shared with
    #                             Classic. That Repo does not get the
    #                             project-local cache it would have had without
    #                             Verkstead, which is the one thing a session
    #                             takes away from it. `YARN_ENABLE_GLOBAL_CACHE`
    #                             would settle it either way and is deliberately
    #                             not set: moving a store is this descriptor's
    #                             business and overriding a Repo's policy switch
    #                             is not.
    #
    #   DENO_DIR                  deno's cache, which `deno --help` lists under
    #                             exactly that description — "set the cache
    #                             directory" — and `deno info` takes apart into
    #                             the remote modules, the npm packages, the
    #                             emitted ones and the language server's
    #                             registries. **And the origin storage**, which
    #                             is the one thing under any of these seven
    #                             directories that is not a download; see below.
    #                             deno has one variable for the lot rather than
    #                             a store and a metadata directory the way pnpm
    #                             does.
    #
    #   BUN_INSTALL_CACHE_DIR     bun's cache, which `bun pm cache` prints.
    #                             **Not `BUN_INSTALL`**, which is bun's install
    #                             root: its `bin` is where a global install puts
    #                             a program, and its `install/cache` is only the
    #                             default this variable moves — a session given
    #                             the root instead would be sharing a `bin` on
    #                             its `PATH` between Conversations. Nor
    #                             `BUN_INSTALL_GLOBAL_DIR`, which is the global
    #                             packages themselves and holds nothing a
    #                             project installs out of.
    #
    # **Three of the seven are under `{stores}`** — pnpm's store, deno's cache
    # and bun's — because each of those three tools hardlinks a package out of
    # its store into the project rather than copying it, and a link does not
    # cross a filesystem. pnpm was the first built-in to name that placeholder.
    #
    # **deno was expected to be one of the others and is not**, which is a
    # measurement rather than a reading: after `deno install`, the `index.js`
    # under `node_modules/.deno/` and the one under `DENO_DIR/npm/` are the same
    # inode. So deno is where pnpm and bun are, for the reason they are.
    #
    # **And on Linux all three copy anyway**, which this stage found rather than
    # assumed. A Worktree and this directory are two separate **bind mounts** in
    # a session's sandbox, and `link(2)` answers `EXDEV` across two mounts even
    # where both are the same filesystem — so the fall-back these tools document
    # for two filesystems is what a session gets whatever disk these are on. The
    # store still works: a copy out of it fetches nothing, which is the whole of
    # what the install proofs assert. What is gone is the disk space a hardlink
    # would have saved. Closing it means one mount holding both the Worktree and
    # the store, which is the sandbox's business rather than a descriptor's — so
    # it is written down here, proved in `tests/package_stores.rs`, and left to
    # whoever changes what a session may reach. `{stores}` stays because it is
    # still the right side of that line, and because it is where the fix would
    # land.
    #
    # **And only pnpm says so.** pnpm prints that packages were copied from the
    # store; deno and bun fall back without a word and exit zero, so the link
    # count on a file in the project is the whole of the evidence for those two.
    #
    # The other three copy out of their store, or in Berry's case read the zip
    # where it lies, so none of this costs them anything.
    #
    # Every one of these is safe for two installs at once — npm's `_cacache`,
    # pnpm's store and deno's npm cache are content-addressed or keyed by
    # version, and both yarns write a download to a temporary name and rename it
    # into place — which is the other half of what a shared store has to be, and
    # what two Sandboxes installing at the same time is there to say.
    #
    # And none of them holds a secret of a session's own. A registry login is
    # `.npmrc`'s `_authToken` or Berry's `npmAuthToken`, both in a file nothing
    # here moves, and deno's is `DENO_AUTH_TOKENS`, which is an environment
    # variable rather than anything on disk. What npm keeps under its cache
    # besides the packages is `_logs`, which is its own account of a failed
    # install rather than a secret; Berry's `globalFolder` holds the cache, the
    # metadata and an empty hardlink index and nothing else; and bun's cache
    # holds tarballs and manifests, its global binaries being under `BUN_INSTALL`
    # instead.
    #
    # **`DENO_DIR` is the one that holds more than downloads.** `deno info`
    # names it *origin storage*: `localStorage` for a `--location`, and the
    # database `Deno.openKv()` opens where it was given no path. That is a
    # program's own state rather than a session's secret, and sharing it is the
    # same bargain as sharing a store — two Conversations running one Repo's
    # program see one `localStorage`. `DENO_KV_DEFAULT_PATH` would move half of
    # it and is deliberately not set, for the reason `YARN_ENABLE_GLOBAL_CACHE`
    # is not: a descriptor moves stores, and deciding where a Repo's program
    # keeps its data is not that. The adoption doc is where a stranger reads it.
    #
    # **A Repo's own config does not win over these**, and it is worth knowing
    # which way round that is: the four tools with a config key for it put the
    # command line above the environment and the environment above their rc
    # files, so a session's variable beats an `.npmrc`, a `pnpm-workspace.yaml`
    # or a `.yarnrc`, and a Repo that must have its own store passes `--cache`,
    # `--store-dir` or `--cache-folder` where it installs. Nothing a descriptor
    # can do changes that: the grammar sets variables, and there is no rung
    # below the environment to set one on. Both halves are asserted in
    # `tests/package_stores.rs`, because a silent loss is the worse of the two.
    # bun reads its cache out of `bunfig.toml`'s `install.cache.dir` and puts
    # the environment above that too; deno documents no config key for
    # `DENO_DIR` at all, so there is nothing for a Repo to lose.
    env:
      NPM_CONFIG_CACHE: "{cache}/npm"
      PNPM_CONFIG_STORE_DIR: "{stores}/pnpm"
      PNPM_CONFIG_CACHE_DIR: "{cache}/pnpm/metadata"
      YARN_CACHE_FOLDER: "{cache}/yarn/cache"
      YARN_GLOBAL_FOLDER: "{cache}/yarn/global"
      DENO_DIR: "{stores}/deno"
      BUN_INSTALL_CACHE_DIR: "{stores}/bun"
