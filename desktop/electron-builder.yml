# What a packed Verkstead is, on every platform it is packed for.
#
# One configuration for the three artifacts a Release ships (ADR-0020) — an
# x86_64 AppImage, a universal dmg and an NSIS installer — with all three of them filled
# in. Everything above the `linux:`, `mac:` and `win:` sections is every
# platform's.
#
# **What runs it is `pnpm run pack`** — see `scripts/pack.mjs`, which is where
# the CLI this app carries comes from and what the staged paths below are
# written by. electron-builder on its own would pack an app with no sidecar in
# it.
#
# Unsigned, as the Rust artifacts were: there is no Developer ID and no
# authenticode certificate. Why Windows stays that way, and what would reopen
# it, is ADR-0020's *Amended: the Windows build stays unsigned*.

appId: net.tobico.Verkstead
productName: Verkstead

# **The pack fetches its own Electron, by the version `package.json` pins.**
# `node_modules` holds none: that package's install script — the one that
# downloads a couple of hundred megabytes of runtime — is denied in
# `pnpm-workspace.yaml`, because `pnpm start` runs the dev shell's Electron and
# CI only lints, typechecks and tests. So electron-builder reads the version out
# of `node_modules/electron/package.json` and downloads that build itself,
# cached under `~/.cache/electron` between runs. Which is the one thing it must
# not take from the dev shell: that Electron is a different patch version from
# the one pinned here, and an artifact built against it would be an app nobody
# had agreed to ship. There is no `electronVersion` here for the same reason —
# said twice, the two drift.

# **Nothing is published from here and nothing updates itself.** A Release is
# assembled by `.github/workflows/release.yml`, which uploads the files its legs
# built and their checksums beside them; electron-builder's own publishing would
# be a second thing talking to GitHub about the same tag. Said as `null` rather
# than left unsaid, because unsaid means *guess* — it reads the repository out of
# `.git/config`, writes the update metadata an auto-updater we do not ship would
# read, and fails the build outright where there is nothing to guess from.
publish: null

# Nothing to rebuild and nothing native: this app has no dependencies at all,
# its devDependencies are not packed, and the pack is not the place to discover
# that a package manager can be run from inside it.
npmRebuild: false

directories:
  # Under the directory cargo already writes to, so that one `.gitignore` line
  # covers both of them and `cargo clean` takes them away — which is where the
  # Rust AppImage kept its AppDir too. `out/` is electron-builder's own output,
  # `staged/` beside it is what `scripts/pack.mjs` writes for the paths below to
  # read.
  output: ../target/electron/out
  buildResources: build

# The compiled main process, its preload and the manifest Electron reads its
# name and its `main` out of — and nothing else. `src/`, `tests/` and this file
# are the sources of that output rather than part of the app.
files:
  - dist/**/*
  - package.json

extraResources:
  # **The CLI, in a directory of its own.** Not beside the launcher: the root of
  # the install holds a launcher named for the product, Windows resolves `PATH`
  # without regard to case, and a `verkstead` there would answer a lookup with
  # the window instead of the guide (ADR-0020). Stage 07 puts this directory on
  # Windows' `PATH` and could not put the launcher's there, so one layout serves
  # all three platforms — and it is the layout `src/cli.ts` already looks in.
  #
  # Staged rather than named outright, because which binary it is is the
  # developer's or the release leg's to say: `scripts/pack.mjs` is what puts it
  # there — and on a Mac what joins the two Apple builds into the one universal
  # file this is.
  - from: ../target/electron/staged/cli
    to: cli

  # And the tray's artwork, which `src/artwork.ts` reads from the root of the
  # resources. The 192px one of the generated set, for the reason that file
  # gives — a panel scales what it is given, and an icon scaled up is the one
  # that looks wrong.
  - from: ../assets/icons/icon-192.png
    to: icon-192.png

  # And the menu bar's, which is the picture a Mac gets instead: AppKit lays a
  # status item out at the size of the image it is handed rather than scaling it
  # to the bar, so this pair is the drawing's silhouette at the 22 points the bar
  # lays out and at twice that for a Retina one — see `src/artwork.ts`, and
  # `tools/generate-packaging.sh`, which writes them. Packed on every platform,
  # for the reason the CLI's directory is one layout everywhere: two files of a
  # few hundred bytes are cheaper than a configuration that differs by platform.
  #
  # The `@2x` is named here and nowhere else: the app hands Electron the
  # one-times path and the platform finds this beside it. Which is why both are
  # read back off the mounted bundle by the dmg leg in `.github/workflows/
  # release.yml`: a file the app never names is one whose absence shows on a
  # Retina Mac and nowhere a runner can look, and a missing template is a `Tray`
  # holding an empty image over a log line still saying the icon went up.
  - from: ../packaging/menubarTemplate.png
    to: menubarTemplate.png
  - from: ../packaging/menubarTemplate@2x.png
    to: menubarTemplate@2x.png

linux:
  # **The launcher must not be called `verkstead`**, for the reason the CLI has a
  # directory of its own: the two are one word apart on a platform that does not
  # read case. Said rather than defaulted — electron-builder would name it after
  # the package, which is a third spelling again.
  executableName: Verkstead

  # The committed launcher artwork, which `scripts/pack.mjs` stages as the flat
  # `<size>x<size>.png` set electron-builder reads a directory as. Every size
  # `tools/generate-packaging.sh` writes, so a panel, a menu and an AppImage's
  # own `.DirIcon` are all drawn from the same pixels as the Rust app's were.
  icon: ../target/electron/staged/icons

  # The desktop entry is electron-builder's to write — it has an `Exec` of its
  # own that no configuration replaces, naming the launcher inside the image — so
  # these are the fields it is told to put in one. `Name` is the product name
  # above, and `Type`, `Terminal` and `Icon` electron-builder fills in itself.
  category: Development
  description: The workbench, in the system tray
  desktop:
    entry:
      Keywords: agent;coding;sessions;workbench;

  # And the entry is named for the app id, which is what `desktopName` in
  # `package.json` says and what this makes the file name: one string for the
  # tray, the startup registration and the entry, as
  # `tools/generate-packaging.sh` has it, because a desktop told two would have
  # two Verksteads. It is also the app id Electron itself reports as the
  # window's, so a session associates the window with this entry rather than
  # drawing it as some other application.
  syncDesktopName: true

  target:
    - target: AppImage
      # x86_64 only, as ADR-0012 had it and ADR-0020 keeps: an arm64 Linux user
      # has the bare CLI.
      arch:
        - x64

appImage:
  # Written down rather than defaulted: `publish` names this file, the adoption
  # documents spell it, and the install line a human copies matches it —
  # electron-builder's own pattern would put the version in the middle of all
  # three.
  artifactName: Verkstead-x86_64.AppImage

# **The static AppImage runtime.** With nothing said here, electron-builder
# builds against `appimage-12.0.1`, whose runtime wants libfuse2 — which Ubuntu
# 24.04, Debian 13 and current Fedora do not install, so the file would refuse to
# mount on a current desktop with *"Cannot mount AppImage, please check your FUSE
# setup"*. This runtime links its own squashfuse, so what it asks of a machine is
# a `/dev/fuse` to open and a `fusermount3` to open it with — the helper any
# FUSE mount goes through, and nothing a distribution has to be told to install
# a library for. It compresses with zstd rather than xz, and it does not put
# `--no-sandbox` on the desktop entry the way the legacy path does.
toolsets:
  appimage: "1.0.3"

mac:
  # **The committed icns, staged rather than pointed at**, the way the launcher
  # icons are: `tools/generate-packaging.sh` writes it from the same artwork
  # those come from, and staging keeps that script the only thing in the
  # repository that writes artwork — see `scripts/pack.mjs`.
  #
  # electron-builder copies it into the bundle and writes the
  # `CFBundleIconFile` naming it, which is worth saying twice: v0.1.2 shipped a
  # perfectly good icns under a key naming no file at all and drew the generic
  # application icon on every Mac that downloaded it. The Finder icon is the one
  # thing about a bundle that nothing running the app can tell you about, so it
  # is read back off what was packed.
  icon: ../target/electron/staged/icon.icns

  # `Development` above, in Apple's own vocabulary: `LSApplicationCategoryType`,
  # which is what a Mac groups the app under.
  category: public.app-category.developer-tools

  # **Signed with a Developer ID when the pack is given one, and ad-hoc when it
  # is not** (ADR-0027, *The release*): Squirrel.Mac, which electron-updater
  # drives, refuses an ad-hoc signed update, and notarization wants a
  # Developer ID and the hardened runtime both. So no `identity` is written
  # here: electron-builder takes the certificate from `CSC_LINK` and
  # `CSC_KEY_PASSWORD`, imports it into a keychain of its own for the length of
  # the pack, and signs with the Developer ID Application identity it finds
  # there.
  #
  # **And the ad-hoc half is `scripts/pack.mjs`'s**, because it is the absence
  # of those two variables that decides it and a configuration file cannot read
  # one. Given no `CSC_LINK`, the script says `identity: "-"` and
  # `hardenedRuntime: false` on electron-builder's command line, which is
  # exactly the bundle every release before this one shipped — a developer's
  # checkout, a pull request and a fork all pack it. Never unsigned: an Apple
  # silicon Mac refuses to execute a Mach-O carrying no signature at all, which
  # `identity: null` would be. And never ad-hoc *with* the runtime: library
  # validation would weigh frameworks with no Team ID against an app with none,
  # and that is the bundle electron-builder's own schema warns may not launch.
  #
  # The sidecar in `Contents/Resources/cli` is signed with the rest, by the same
  # identity and under the same runtime: @electron/osx-sign signs every Mach-O
  # it finds in the bundle, and the release leg reads both signatures back.
  hardenedRuntime: true

  # **The entitlements Electron wants under that runtime**, written down rather
  # than left to the template electron-builder falls back on, so that a bump of
  # it cannot change what the app is allowed without a diff here. They are that
  # template's three as of electron-builder 26.15: V8's JIT, the unsigned
  # executable memory it maps besides, and library validation off — the last
  # being what lets the Electron framework, signed before it reached this
  # bundle, load into it. The same file for the app and for everything inside
  # it, which is what the template is used as too.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

  # **No `LSUIElement`, said as a line about what is not here.** That key is what
  # made the Rust bundle a menu-bar app with no Dock tile, and ADR-0020 retires
  # it: this is a regular Dock app, closing the window hides it and the Dock is
  # the way back. electron-builder writes no such key, so there is nothing to
  # turn off — and the dmg leg in `.github/workflows/release.yml` reads the packed
  # `Info.plist` back for its absence, that absence being the whole of what the
  # Dock behaviour rests on.
  #
  # `LSMinimumSystemVersion` is left unsaid for the opposite reason: it is
  # Electron's own floor, out of the runtime electron-builder fetched, rather
  # than a number written here. What is written down is the promise
  # made to a downloader, and that same leg reads the key off
  # the packed bundle and refuses anything above it — so the promise and the
  # floor are one number, and moving Electron moves both.

  target:
    - target: dmg
      # **One file for both Macs**, as the Rust bundle was: electron-builder
      # builds the x64 app and the arm64 app and hands the two to
      # @electron/universal, which `lipo`s the Mach-O files that differ and
      # refuses anything else that does. The sidecar is universal by
      # construction — `scripts/pack.mjs` joins both CLI builds before either
      # app is built — so it is byte-identical in the two halves and there is
      # nothing for an `x64ArchFiles` pattern to excuse.
      arch:
        - universal

dmg:
  # Written down rather than defaulted, for the reason the AppImage's is:
  # `release.yml` uploads this name, `README.md` spells it, and
  # electron-builder's own pattern would put the version in the middle of both.
  artifactName: Verkstead-universal.dmg

win:
  # **The committed `.ico`, staged rather than pointed at**, the way the `.icns`
  # and the launcher icons are — `tools/generate-packaging.sh` writes it from the
  # same artwork, and `scripts/pack.mjs` is what puts it where this reads it.
  #
  # Wanted twice over: electron-builder edits it into `Verkstead.exe` as the
  # launcher's own resource, and the installer's **Installed apps** row and
  # Start-menu entry are drawn from that launcher.
  icon: ../target/electron/staged/icon.ico

  # No `executableName` here, unlike the Linux section: what a Windows launcher
  # is called is the product name already — `Verkstead.exe` — and that is the
  # file the Start-menu entry and Launch on Startup's Run value both name.

  target:
    - target: nsis
      # x86_64 only, as the AppImage is (ADR-0012, kept by ADR-0020): Windows on
      # arm64 runs an x86_64 exe under the emulation it has for exactly this.
      arch:
        - x64

# **An NSIS installer, because that is what electron-updater updates**
# (ADR-0027): its Windows update runs the new installer over the old install,
# and an install made any other way is not one it can run over.
nsis:
  # Written down rather than defaulted, for the reason the AppImage's and the
  # dmg's are: `release.yml` checks this name, `README.md` spells it, and
  # electron-builder's own pattern would put the version in the middle of both.
  artifactName: Verkstead-x86_64.exe

  # **The three things no key here says** — the install directory, which would
  # otherwise be named for the package, the CLI's directory on this user's
  # `PATH`, and the removal of the msi earlier Releases installed. See the
  # script, which says what it does and why each is not a key.
  include: build/installer.nsh

  # **The Start-menu entry is what this download promises, and nothing else.**
  # electron-builder creates a desktop shortcut as well unless told not to;
  # `createStartMenuShortcut` is left unsaid because it already defaults on.
  # The entry carries `appId` as its AppUserModelID, which is the id a toast is
  # shown under and the one `src/main.ts` sets.
  createDesktopShortcut: false

  # **The row in Installed apps says `Verkstead`**, rather than
  # electron-builder's `Verkstead 0.2.2`: the version has a column of its
  # own there, and the release leg finds the row by this name.
  uninstallDisplayName: "${productName}"

  # And four things left unsaid on purpose, because the defaults are the
  # decisions (ADR-0020, kept by ADR-0027):
  #
  # - `perMachine` is off, so the installer installs into the profile and asks
  #   for no administrator. The app is unsigned (ADR-0020, *Amended: the
  #   Windows build stays unsigned*), and an installer asking for administrator
  #   would be an unsigned program asking for the machine.
  # - `oneClick` is on, so there is no wizard: a progress banner, and the
  #   install.
  # - `runAfterFinish` is on: the installer starts the app when it finishes.
  #   Never for a silent install — `/S`, which is how the release
  #   leg installs it — unless that install also says `--force-run`.
  # - `deleteAppDataOnUninstall` is off, and has to stay off: what it deletes
  #   is `%APPDATA%\Verkstead`, which is the Data Directory — every Repo,
  #   Conversation and setting — and an uninstall is not a request to lose
  #   those.
