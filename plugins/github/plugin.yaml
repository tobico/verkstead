# GitHub, as a Forge plugin: the hosts it answers for, what it calls a pull
# request, how git in the sandbox signs in, the tool a session is lent and what
# it can do. The grammar of a `forge` entry is `docs/plugins.md`'s *Forge*.
#
# Every operation is the component's, built from the crate beside this file:
# it speaks REST and GraphQL to the one outbound host below, as the Author's
# token the host sets in `GH_TOKEN` for the one call it was set for.
uuid: b357e557-3716-4ea6-a3a8-d904c92c5eac
name: GitHub
author:
  name: Tobias Cohen
  email: tobi@tobico.net
version: 0.1.0
interface: 1
description: Pull requests, checks, reviews, gists and repositories on github.com.
component: github.wasm
# The hosts a self-hosted GitHub answers on, beside github.com: a Repo whose
# remote names one is on this Forge, exactly as one on github.com is. Read at
# the moment a Repo's Forge is asked, so a host added reaches the next
# Conversation without a restart.
settings:
  - key: hosts
    label: Other hosts
    kind: list
    description: A GitHub Enterprise host, like github.example.com, one per line.
capabilities:
  - outbound: api.github.com
  - secrets: GH_TOKEN
provides:
  - category: forge
    hosts: [github.com]
    noun: pull request
    credential:
      username: x-access-token
      hosts: [github.com]
    tool:
      name: gh
      token: GH_TOKEN
    capabilities: [checks, review, publish, stacks, create]
    # `repo` for pull requests, checks, comments and creating a repository;
    # `gist` for publishing a Share.
    scopes: [repo, gist]
