[package]
name = "verkstead-activity-backlog-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Embedded as `backlog-runner.wasm`, which is what the `activity` block in
# `../plugin.yaml` names: see `crates/server/build.rs`.
[lib]
name = "backlog_runner"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
