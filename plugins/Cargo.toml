# The wasm components of the Plugins Verkstead ships, built for `wasm32-wasip2`
# and embedded in the server — see `crates/server/build.rs`, and
# `docs/development.md`'s *Built-in plugins*. A workspace of its own rather than
# members of the one above: nothing here is built for the host, and a
# `cargo build --workspace` there should not try.
[workspace]
resolver = "3"
members = ["activities/backlog-runner", "activities/follow-up-rounds", "codex", "fixture"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

# Small and quick to instantiate: these bytes are inside every binary, and
# compiled by Cranelift at every start.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
