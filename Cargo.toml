[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/desktop",
    "crates/render",
    "crates/schema",
    "crates/server",
    "crates/store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Default features off drops the TypeScript emitter, which is a test's business
# and nothing a binary should carry — see the `typescript` feature there.
verkstead-render = { path = "crates/render", default-features = false }
verkstead-schema = { path = "crates/schema" }
verkstead-store = { path = "crates/store" }
# The Preface is agent-supplied markdown, so what pulldown-cmark renders is
# untrusted HTML and ammonia is not optional dressing.
ammonia = "4"
anyhow = "1"
# The VAPID keypair and a subscription's keys are base64url without padding
# throughout — that is the one encoding `PushManager.subscribe` and the Web Push
# protocol both speak.
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
# The one thing in Verkstead that is picked rather than derived: the random
# branch name a Conversation is prefilled with. The operating system's own
# generator and nothing around it — there is no distribution to sample and no
# sequence to reproduce, so a whole random-number crate would be a generator, a
# seeding strategy and a trait hierarchy for one call.
getrandom = "0.4"
# Generating the VAPID keypair, which is a P-256 one because Web Push says so.
# Default features off drops the ECDSA half: nothing here signs anything — the
# key is generated, encoded, and stored.
p256 = { version = "0.13", default-features = false, features = [
    "arithmetic",
    "std",
] }
# Default features off drops the getopts-based example binary: this is a
# library dependency of the server half only.
pulldown-cmark = { version = "0.13", default-features = false, features = [
    "html",
] }
# Comparing the tag of the latest release against the version this binary was
# built as — the whole of the Update Notice's arithmetic. Default features
# only: nothing serialises a version, they are parsed and compared.
semver = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
# `raw_value` for the one payload that travels through Verkstead without
# being read: an OpenCode session's store keeps each record as JSON text, and
# that text reaches the Transcript byte for byte rather than parsed and written
# out again — same document, other key order, and verbatim is the whole of what
# ADR 0006 promises.
serde_json = { version = "1", features = ["raw_value"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
# The Diff is highlighted server-side. Default features off swaps oniguruma for
# the pure-Rust regex engine — no C dependency in the build — and drops the
# themes: the token classes are styled by the site's own stylesheet, so a
# bundled colour scheme would only be dead weight. The bundled syntaxes go the
# same way, in favour of `two-face`'s wider set below; what stays is the loader
# that reads it.
syntect = { version = "5", default-features = false, features = [
    "dump-load",
    "html",
    "parsing",
    "regex-fancy",
] }
tempfile = "3"
# Every stamp the store writes is SQLite's own, so `parsing` is what reads one
# back. `formatting` is for the one stamp that comes from somewhere else: when
# the secrets file was last written, which is the filesystem's answer and has to
# be worded as RFC 3339 like all the rest.
time = { version = "0.3", default-features = false, features = [
    "formatting",
    "parsing",
    "std",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The one source of truth for the wire shape: the viewer's TypeScript types are
# generated from the Rust ones rather than written twice. It emits them from
# tests, so it is only ever compiled for a `cargo test` — see the `typescript`
# feature in `crates/render`.
ts-rs = "12"
# The syntaxes syntect bundles are Sublime Text's defaults, which is a set that
# stopped growing before TypeScript, TOML and Nix existed as far as it is
# concerned — a Diff of any of them came out unhighlighted. This is the set `bat`
# ships, the same defaults with those in it. `syntect-fancy` holds it to the
# pure-Rust regex engine our syntect line already chose.
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }
