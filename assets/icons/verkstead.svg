<?xml version="1.0" encoding="UTF-8"?>
<!-- The one icon source. Every PNG in this directory is rasterized from it by
     `tools/generate-icons.sh`, and it is served as the favicon itself.

     An anvil, for the workshop the name means. One closed silhouette rather
     than a hammer-and-anvil pair, because at favicon size two shapes become one
     blob: the horn, the flat face and the splayed base are what still read at
     16px, and nothing else has that outline.

     Full-bleed: Android masks launcher icons to whatever shape the launcher
     likes, so the background covers the whole canvas and the glyph stays within
     the central 80% safe zone. Cold iron behind, hot iron on it — the same
     ember the viewer takes its accent from. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#21201e" />
  <!-- Drawn around its own centre and then moved onto the canvas's, because the
       horn hangs off one side and the shape's middle is not the path's. -->
  <g transform="translate(256 256) scale(1.14) translate(-241 -290)">
    <path
      fill="#f08a3c"
      d="M 66 212
         C 116 192 162 182 214 180
         L 412 180
         L 412 242
         L 318 242
         C 314 294 320 318 332 332
         L 368 332
         L 390 398
         L 122 398
         L 144 332
         L 180 332
         C 192 318 198 294 194 242
         L 150 242
         C 116 240 88 228 66 212
         Z"
    />
  </g>
</svg>
