<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verkstead</title>
    <!-- The manifest, the icons and the service worker are static files at the
         site root, kept verbatim in the repo's `assets/` — see vite's
         `publicDir`. A worker only controls the paths beneath the one it was
         served from, so none of them may move under the bundle's directory. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The colour the browser chrome takes, so the window reads as a frame
         around the app rather than as a second colour beside it. Kept in step
         with `theme_color` in the web manifest. -->
    <meta name="theme-color" content="#21201e" />
    <!-- The artwork is a raster, so the favicon is a PNG cut to the size a tab
         draws rather than one the browser has to shrink itself. See
         `tools/generate-icons.sh`. -->
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
    <!-- iOS reads neither the manifest's icons nor a favicon this small, so it
         gets its own link, to a PNG of the size it wants — and the one cut with
         a field under it, because iOS composites a transparent icon onto
         black. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
