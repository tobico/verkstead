# A release is this workflow, run by hand against a version number, and
# nothing a human does around it. It tests, bumps the workspace version and
# lands that on `main`, builds the viewer and then every artifact from the
# commit it just made, runs each of them, tags that commit, publishes the
# Release, and records what it published in `nix/release.json`. There is no
# step before it and no step after it: `docs/releasing.md` is a description of
# this file rather than a procedure to follow.
#
# What a release ships: one bare binary per platform the project ships, and
# beside them the desktop app as the file each desktop is installed from — the
# Linux one as an AppImage, the macOS one as a dmg, the Windows one as an NSIS
# installer — each with the viewer inside it, published as a GitHub Release under the
# tag this run created. Every leg builds its artifact and then runs it — the
# Windows one by installing it first — so a target that will not build, or
# that builds something that will not run, fails the run rather than reaching a
# Release.
#
# A last job then records the bare binaries in `nix/release.json` and commits
# it to `main`, which is the whole interface to the binary flake.
#
# The order is what makes a failed run cheap. Everything that could say no —
# the checks, the version, the tag — says it before anything is written, and
# the two writes that a run cannot take back are a tag and a Release, both of
# which happen after all eight artifacts exist and have been run. What a
# failure in between leaves behind is a `main` whose version number has moved
# ahead of its last release, which is where it was going anyway: re-running
# with the same version finds the bump already made and carries on.
#
# Pinned throughout, as `ci.yml` is: actions to released versions, runners to
# images rather than `-latest`, and Rust to the patch version the flake's
# nixpkgs carries.
name: Release

# By hand and by hand only. Nothing here is triggered by a push: a tag used to
# start this workflow, and now this workflow makes the tag, so listening for
# one would be listening for itself.
#
# The version is typed without its `v`, the way `Cargo.toml` and the flake both
# spell one, because that is the number a person has in mind. Everything that
# wants the other spelling derives it — see `TAG` below.
#
# The note is the one thing a release says in words of its own. It is put above
# the generated notes, and is for what somebody installing over the last
# Release has to do by hand: `docs/releasing.md` says when one is needed. Left
# empty, the notes are the generated ones alone.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, without a leading v (0.1.2, or 0.1.0-rc.1)
        required: true
        type: string
      note:
        description: A line put above the generated notes, for what an upgrader has to do by hand (empty for none)
        required: false
        default: ''
        type: string

# Read at the top, so that the jobs which compile the dependency tree and run
# other people's actions hold a token that can do nothing to the repository.
# The three jobs that write — the version bump, the tag and Release, and the
# manifest commit — widen this for themselves.
permissions:
  contents: read

# The version and the tag, spelled once each. Every job that names one reads it
# from here, so the tag the Release carries, the tag the manifest's urls point
# into, and the tag on the commit are the same string by construction rather
# than by three expressions agreeing.
#
# Also the one place the input is interpolated. Everything below reads these
# through the environment and never `${{ inputs.version }}` inside a script: an
# expression is substituted into the shell's source text before the shell sees
# it, and a variable is not.
env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  # The checks, before anything is written. `ci.yml` is called rather than
  # copied, and rather than asked after the fact whether it happened to be
  # green on whatever `main` had reached — a release is started at a moment
  # nobody chose for its CI history, so the run that ships is the run that
  # tests. It is the first job because it is the one that can say no for free:
  # a red check here stops a release that has bumped nothing, tagged nothing
  # and published nothing.
  #
  # What it tests is `main` as it stands, which is the tree that is about to
  # ship give or take the version number `prepare` writes into it. Testing the
  # bumped tree instead would mean committing the bump first, and a red check
  # would then have left that commit on `main` — which is the one thing this
  # ordering is for.
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  # The version, written down and landed. `v0.1.1` shipped a binary reporting
  # `0.1.0`, because the tag said one number and `Cargo.toml` said another and
  # nothing in this workflow had a word to say about it: a fresh install
  # offered to update itself to the version it already was. The fix was a gate
  # that compared the two and failed; this job is the fix the gate was standing
  # in for, which is that the workflow sets the number rather than checking
  # somebody else did.
  #
  # Everything that builds sits behind it through `viewer`, and takes the
  # commit this job made as the tree it builds — see the `ref` on each
  # checkout. What ships is therefore the commit `main` has, rather than a
  # tree that resembles it.
  prepare:
    name: Prepare
    needs: tests
    runs-on: ubuntu-24.04
    # The first of the three jobs that write: the bump is a commit on `main`,
    # the exception to the review process that `docs/agents/git-workflow.md`
    # records alongside the manifest's.
    permissions:
      contents: write
    outputs:
      # The commit every build leg checks out and `publish` tags. Named here
      # rather than left to be `main`, because `main` is a moving branch and
      # eight legs reading it separately could read two different commits.
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      # `main`, not the ref the run was started against. `workflow_dispatch`
      # offers every branch and tag in the same list, and a release built from
      # anything but `main` would publish a Release whose manifest commit lands
      # on a `main` that does not contain the code.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      # Typed by a human at the moment they press the button, which is the one
      # input this workflow has and so the one thing about a run that can be a
      # typo. Semver's own shape, and no leading `v`: the `v` belongs to the
      # tag, this workflow adds it, and a version typed with one would reach
      # `Cargo.toml` as `v0.1.2` and every url as `vv0.1.2`.
      - name: The version is one a release can carry
        run: |
          if ! printf '%s' "$VERSION" |
            grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::'$VERSION' is not a version. Give three numbers, optionally a hyphen and a pre-release, and no leading v: 0.1.2, or 0.1.0-rc.1."
            exit 1
          fi
          echo "Releasing $TAG."

      # A tag is the one thing in a release that cannot be done twice, and it
      # is worth hearing about now rather than after eight legs have built.
      # Asked of `origin` rather than of the checkout, which fetched no tags.
      #
      # A re-run of a release whose `publish` already tagged is caught here and
      # told to pick a new number: the Release under that tag either exists, in
      # which case there is nothing to re-run, or it does not, in which case
      # the tag is wreckage to be deleted by hand before trying again.
      - name: Nothing carries this tag yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG already exists. Release a new version, or delete the tag if the run that made it published nothing."
            exit 1
          fi
          echo "$TAG is free."

      # The workspace version, which every crate here takes, edited in the one
      # place it is written. A hyphen is semver's own spelling of a
      # pre-release, and it stops at the tag: a pre-release rehearses the
      # release of its number, so what it builds says that number, and
      # `v0.1.0-rc.1` and `v0.1.0-rc.2` are both a manifest reading `0.1.0`.
      # That is the same rule from both ends: the tag keeps the pre-release,
      # the compiled binary and the installers do not.
      #
      # awk rather than sed because `version = ` appears in `[workspace.
      # package]` and could appear in any table below it; the section is
      # tracked so that only the workspace's own line is touched.
      #
      # `cargo update --workspace` then writes the same number into
      # `Cargo.lock`, which carries a version per workspace crate and would
      # otherwise fail every `--locked` build in the legs below. `--workspace`
      # is what keeps it to those crates: no dependency moves in a release.
      # The runner's own cargo does both — nothing is compiled here, so there
      # is no toolchain to pin to the flake's.
      - name: Bump the workspace version
        run: |
          crate="${VERSION%%-*}"
          awk -v v="$crate" '
            /^\[/ { section = $0 }
            section == "[workspace.package]" && /^version = / {
              print "version = \"" v "\""; next
            }
            { print }
          ' Cargo.toml > Cargo.toml.bumped
          mv Cargo.toml.bumped Cargo.toml
          cargo update --workspace
          git --no-pager diff -- Cargo.toml

      # The edit read back through cargo rather than through the file, which is
      # what makes this more than a repeat of the step above: an awk that
      # matched the wrong line would have agreed with itself, and cargo is what
      # the build legs will actually ask. `verkstead-cli` because the
      # disagreement this catches is the human-visible one — `verkstead
      # --version` is that crate's binary talking.
      - name: Cargo reads the version this release carries
        run: |
          want="${VERSION%%-*}"
          got=$(cargo pkgid -p verkstead-cli | sed 's/.*@//')
          if [ "$want" != "$got" ]; then
            echo "::error::The bump wanted $want, and cargo reads $got."
            exit 1
          fi
          echo "Cargo.toml reads $got."

      # **And the same number into `desktop/package.json`**, which is where
      # electron-builder reads the version the installer carries:
      # `Verkstead-x86_64.exe` is packed from that file's `version`, and nothing
      # else in the repository bumps it — `prepare` is the only thing in this
      # workflow that writes a version anywhere, and the step above writes the
      # workspace's. Left alone, every Release's installer would say `0.1.0`,
      # and so would **Installed apps**, for ever.
      #
      # The crate's number rather than the tag's, which is the same rule the step
      # above takes and for the same reason: what **Installed apps** then says is
      # what `verkstead --version` says.
      #
      # Through Node rather than `sed`, because this is JSON and the file is
      # written by hand: `JSON.stringify` at two spaces is byte for byte what is
      # already there, so the only change in the diff is the number. The
      # runner's own Node — nothing is built here, so there is no toolchain to
      # pin to the flake's — and the answer read back out of the file
      # afterwards, which is what the step above does with `cargo pkgid`.
      - name: Bump the desktop app's version
        run: |
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const file = "desktop/package.json";
            const app = JSON.parse(readFileSync(file, "utf8"));
            app.version = process.env.VERSION.split("-")[0];
            writeFileSync(file, `${JSON.stringify(app, null, 2)}\n`);
          '
          git --no-pager diff -- desktop/package.json

          want="${VERSION%%-*}"
          got=$(node -p 'require("./desktop/package.json").version')
          if [ "$want" != "$got" ]; then
            echo "::error::The bump wanted $want, and desktop/package.json reads $got."
            exit 1
          fi
          echo "desktop/package.json reads $got."

      # Straight onto `main`, with no pull request — the first of this
      # workflow's two exceptions to the review process, recorded in
      # `docs/agents/git-workflow.md` beside the manifest's. Unlike the
      # manifest, this commit touches files the checks read, which is why the
      # checks ran first: what lands here is a version number on a tree that
      # was green a job ago.
      #
      # The author is the bot, as the manifest's is. Nobody wrote this commit.
      #
      # Nothing re-triggers: a push made with the workflow's own `GITHUB_TOKEN`
      # starts no workflow run, so this neither re-enters CI nor starts a
      # second release.
      #
      # A version already landed is not an error. A run that failed in a build
      # leg and is being run again finds `main` already reading its number,
      # commits nothing, and hands the same commit down — which is what makes
      # the retry the same release rather than a new one.
      - name: Land the bump on main
        id: bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock desktop/package.json
          if git diff --cached --quiet; then
            echo "main already reads $VERSION; nothing to commit."
          else
            git commit -m "chore: version $VERSION"
            git push origin HEAD:main
          fi
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Everything below is built from $sha."

  # The viewer, built once. `rust-embed` reads `web/dist` at compile time, so
  # every build leg needs it on disk before cargo runs — but what vite writes
  # does not vary by platform, so building it in each leg would cost four times
  # over and let the four legs disagree about what they embedded.
  viewer:
    name: Viewer
    needs: prepare
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The commit `prepare` made, rather than whatever `main` has reached
          # by the time this runs. Every leg names the same sha, so the eight
          # artifacts a Release carries are eight builds of one tree — and it
          # is the tree whose `Cargo.toml` carries this release's version,
          # which is the whole reason `prepare` runs before anything compiles.
          ref: ${{ needs.prepare.outputs.sha }}

      # pnpm, Node and the `--frozen-lockfile` install, shared with `ci.yml` —
      # see the action for what each pin is and why. So the viewer that ships is
      # built by the toolchain that CI checked it with.
      - name: Set up the viewer
        uses: ./.github/actions/setup-pnpm-project

      - name: Build
        run: pnpm build

      # `path` is the job's one path that is not the viewer's: the job-wide
      # `working-directory` above governs `run` steps alone, and an action's
      # inputs are read from the repository root regardless.
      - name: Upload the viewer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: viewer
          path: web/dist
          if-no-files-found: error

  # One leg per asset, each on a runner of its own architecture: nothing is
  # cross-compiled, and so every leg can run the binary it just built.
  build:
    name: ${{ matrix.asset }}
    needs: [prepare, viewer]
    runs-on: ${{ matrix.runner }}
    strategy:
      # A broken leg does not cancel its siblings. Which targets are broken is
      # the thing this run is for, and cancelling would report them one per run.
      fail-fast: false
      matrix:
        include:
          - asset: verkstead-linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - asset: verkstead-linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - asset: verkstead-macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - asset: verkstead-macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          # The fifth, which arrived with the Windows port: the same headless
          # server, on the one platform whose executables carry an extension —
          # `.exe` in the asset name because a browser download without one is
          # a file Windows will not run, where the other four are chmodded and
          # started. `exe` is what puts it on the file cargo wrote as well; the
          # four rows above have no such key and the expression that reads it
          # comes out empty for them.
          - asset: verkstead-windows-x64.exe
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            exe: .exe
    # Every `run` below is a shell script — a `case`, a parameter expansion, a
    # backgrounded server — and Windows would otherwise be handed them as
    # PowerShell. Said once here rather than on each step, and it is the shell
    # the other four legs were already getting.
    defaults:
      run:
        shell: bash
    env:
      # Where cargo leaves it, said once: every step below either runs this file
      # or asks something of it.
      BINARY: target/${{ matrix.target }}/release/verkstead${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The bump commit, as every leg does — see the `viewer` job.
          ref: ${{ needs.prepare.outputs.sha }}

      # Straight to where `#[folder]` points — see `crates/server/src/viewer.rs`.
      # `web/dist` is gitignored, so the checkout above left the directory empty
      # and this is the whole of what the embed will read.
      - name: Fetch the viewer
        uses: actions/download-artifact@v8.0.1
        with:
          name: viewer
          path: web/dist

      # musl-tools for the C in the dependency tree: `libsqlite3-sys` bundles
      # SQLite's own source and `ring` compiles C of its own, and both are built
      # by cc-rs rather than by rustc. The `CC_<target>` line is what points
      # cc-rs at the musl compiler: it looks for an `aarch64-linux-musl-gcc`
      # that Ubuntu's package does not install — what it installs is a native
      # `musl-gcc`, on both architectures — and falling back to the host gcc
      # would compile those C sources against glibc's headers.
      - name: Install musl
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      # The version branch _is_ the pin, as in `ci.yml`: 1.95.0 is what the
      # flake's nixpkgs carries, so a release binary is compiled by the rustc
      # the dev shell and CI both use.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      # The same cache `ci.yml` uses, keyed by target on top of what the action
      # already keys on: the four legs compile four different dependency trees,
      # and a key they shared would have each of them evicting the last.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      # The package by name rather than the whole workspace, for the reason
      # `nix/verkstead-source.nix` gives: `verkstead-render`'s default features
      # turn on the TypeScript emitter, which is a test's business, and a
      # workspace-wide build would unify it into the release binary.
      #
      # Nothing else is narrowed, and nothing needs to be. No crate in the
      # workspace links a GUI toolkit any more (ADR-0020), so the five rows above
      # ship the bare server-and-CLI by building it plainly — and the desktop
      # legs below pack this same headless binary inside the Electron app rather
      # than building a second one beside it.
      - name: Build
        run: >
          cargo build --release --locked
          --package verkstead-cli --target ${{ matrix.target }}

      # **What a slim binary must not link, checked rather than trusted** — and
      # this, with the store-closure grep in `nix.yml`, is now the whole of what
      # holds a GUI out of the released CLI. There is no feature boundary behind
      # it any more: with the `desktop` feature gone there is nothing that makes
      # a toolkit *unlinkable*, so this list is what says a dependency added
      # tomorrow may not start.
      #
      # `ts-rs` is the emitter, a normal dependency of `verkstead-render` whenever
      # its `typescript` feature is on. The rest are a window: the toolkit the
      # tray app used to link, the two others a Rust GUI is written against
      # today, and the platform crates all three reach the screen through. Whole
      # megabytes of shared libraries a machine with no screen would never load
      # — and naming only `gtk`, as this did while the feature was what really
      # held it out, would miss every one of the ways a GUI would arrive now.
      # The same span as the closure grep in `nix.yml`, said in crate names
      # where that one is said in store paths.
      #
      # **Matched against the names alone**, because a needle this short against
      # the whole tree would be matched against a version, a feature list and
      # the path the checkout happens to sit at as well. Asked for as names
      # rather than parsed back out of the tree above: `{p}` is
      # `name version (source)`, so the first field is the crate and nothing
      # else, and no leg has to take the box-drawing apart. The tree itself is
      # still printed, because it is what a red step is read against.
      #
      # `--edges normal` is what makes this the binary's question — a
      # dev-dependency turns features on and is no part of what shipped.
      #
      # A toolkit would fail to link on the two musl legs as well, loudly and much
      # later; on the macOS and Windows ones it would link, and ship. So it is
      # named here, on every leg, rather than left to a linker on two of them.
      - name: The build links neither the emitter nor a toolkit
        run: |
          cargo tree --package verkstead-cli --edges normal \
            --target ${{ matrix.target }}
          names=$(cargo tree --package verkstead-cli --edges normal \
            --target ${{ matrix.target }} --prefix none --format '{p}' \
            | awk '{ print $1 }' | sort -u)
          for crate in ts-rs gtk gdk glib appindicator winit tao tray-icon \
            muda wayland x11 cocoa objc; do
            if printf '%s\n' "$names" | grep -qF "$crate"; then
              echo "::error::$crate must not be linked into the released CLI, and is."
              exit 1
            fi
          done

      - name: The binary runs
        run: ./"$BINARY" --help

      # And answers as the binary an adopter downloads: with the viewer, rather
      # than the 503 that `serve` gives when nothing was embedded.
      #
      # `--retry-connrefused` rather than a sleep — the server is up when it
      # answers, which is a moment after the fork and not a fixed one.
      #
      # **Its output goes to a file and it is killed outright**, both of them
      # Windows'. A backgrounded process inherits the step's own standard
      # output there as everywhere, and the shell running the step will not
      # finish while anything still holds that pipe — so a server writing to it
      # would hold this leg open long after the assertion had passed. And the
      # bash here is a Windows program's idea of one: a polite signal to a
      # native child is not something it can always deliver, where `-9` is a
      # handle and a call. Both are harmless on the four legs that never needed
      # them, and the file is `cat`ed either way, so what the server said is
      # still in this log.
      - name: The viewer is inside the binary
        run: |
          # **The workbench is behind the Workbench Key**, which a request
          # showing nothing is answered 401 to — see
          # `crates/server/src/key.rs`. So the fetch below has to be let in
          # first, or `--fail` reports a leg that was never admitted as a leg
          # that served no viewer, which is a different failure entirely.
          #
          # The key is whatever the Data Directory holds, and a start adopts
          # what is already there rather than inventing over it, so this leg
          # states one rather than racing the server for the file it would
          # otherwise have written. A cookie carrying it is the whole of being
          # logged in: the `?key=` on a login link is a handshake that sets
          # this and redirects, so this is what the browser would send.
          # **Two shapes of the same path**, on the one leg of this matrix that
          # needs them: `RUNNER_TEMP` is a Windows path there, the server is
          # handed it as one below, and the shell writing the file is an MSYS
          # one that wants the other spelling. `cygpath` is what turns the
          # first into the second, and it is on that runner and no other — so
          # the three legs that never needed it write what they were given.
          key=the-key-this-leg-states
          data="$RUNNER_TEMP"
          if command -v cygpath > /dev/null; then
            data=$(cygpath -u "$RUNNER_TEMP")
          fi
          printf '%s\n' "$key" > "$data/workbench.key"

          ./"$BINARY" serve --listen 127.0.0.1:8422 \
            --data-dir "$RUNNER_TEMP" > server.log 2>&1 &
          server=$!
          document=$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 1 --retry-connrefused \
            --cookie "workbench_key=$key" \
            http://127.0.0.1:8422/)
          kill -9 "$server"
          cat server.log
          # An absent viewer is a 503, which `--fail` has already caught. This
          # is the rest of it: the document vite wrote names the hashed bundle
          # vite wrote beside it, and the fallback names nothing.
          case "$document" in
            */assets/*) ;;
            *)
              echo "::error::The binary served a document with no bundle in it."
              printf '%s\n' "$document"
              exit 1
              ;;
          esac

      # Static, so that one Linux binary runs on any distro — the whole point of
      # offering one — and so that stage 04's flake can fetch it without
      # patchelf. `ldd` exits non-zero on a binary it finds nothing to say about,
      # which is the answer we want, so its verdict is read rather than its
      # status.
      #
      # Both of its verdicts: rust's musl targets link x86_64 as a static PIE
      # and aarch64 as a plain static executable, and `ldd` calls the first
      # "statically linked" and the second "not a dynamic executable". Neither
      # names a library, which is the property being checked; a dynamic binary
      # is a list of them.
      - name: The Linux binaries are static
        if: runner.os == 'Linux'
        run: |
          report=$(ldd ./"$BINARY" 2>&1 || true)
          printf '%s\n' "$report"
          case "$report" in
            *"not a dynamic executable"* | *"statically linked"*) ;;
            *)
              echo "::error::$BINARY is dynamically linked."
              exit 1
              ;;
          esac

      # Under the name it will carry as a Release asset — `verkstead-linux-x64`
      # rather than a target triple, because that name is what the README's
      # install command will spell out. An artifact is a zip, so the executable
      # bit does not survive the trip; the binary was run above, where it still
      # had it, and whoever downloads one chmods it either way.
      #
      # `upload/` rather than the `assets/` next to it, which is vite's
      # `publicDir` and the repository's own.
      - name: Name the binary for the asset it will be
        run: |
          mkdir -p upload
          cp ./"$BINARY" "upload/${{ matrix.asset }}"

      - name: Upload the binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: upload/${{ matrix.asset }}
          if-no-files-found: error

  # The Linux desktop artifact: the Electron app of ADR-0020 and the released
  # CLI inside it, in one file. A leg of its own rather than a sixth row in the
  # matrix above, because nothing about it is that matrix's shape — it compiles
  # nothing, it wants a screen and a session bus, and what it uploads is a
  # packed app rather than a bare binary. `desktop-macos` is the next leg along
  # and `desktop-windows` the third, one per desktop the app is drawn on.
  #
  # **It waits on the whole `build` job**, which is what makes the sidecar the
  # released artifact rather than a second build of it (ADR-0020): what goes
  # inside is `verkstead-linux-x64`, the static musl binary the matrix above
  # built and ran, downloaded here rather than compiled again. A `needs` cannot
  # name one row of a matrix, so it names the job. Nothing else of that job's is
  # wanted and the viewer artifact is not either — the viewer is embedded in
  # that binary at compile time, so fetching the CLI fetches the viewer with it.
  #
  # **And it compiles nothing at all**, which is what the previous shape of this
  # leg was almost entirely about: there is no Rust toolchain here, no cache of
  # its own, no toolkit development packages, and no `ubuntu:22.04` container —
  # which existed only to hold a GTK binary to an older glibc, and which had to
  # be handed `/dev/fuse`, `SYS_ADMIN` and a way past the host's apparmor
  # profile to mount what it had built. A plain runner has FUSE and a
  # `/dev/fuse`, and electron-builder brings its own `mksquashfs`.
  #
  # x86_64 only, per ADR-0020: an arm64 Linux user has the bare CLI.
  desktop-linux:
    name: Verkstead-x86_64.AppImage
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      # Where `pnpm run pack` leaves it, said once: every step below either runs
      # this file, mounts it or uploads it.
      APPIMAGE: target/electron/out/Verkstead-x86_64.AppImage
    steps:
      # Four packages and a sysctl, and every one of them is about *running*
      # the file rather than building it — the runner image already carries the
      # shared libraries Chromium wants, because it ships browsers built on it.
      #
      # `xvfb` is the screen: the window is the point of this app, and a run
      # with no display is a run that proves the sidecar and nothing else.
      # `dbus-x11` is `dbus-launch`, the name Ubuntu packages it under — the
      # tray is published onto the session bus, and a runner has no session, so
      # the runs below bring a bus of their own. `fuse3` is `fusermount3`: the
      # pinned AppImage runtime links its own squashfuse but still asks that
      # helper for the mount, and the mount is what the two assertions after it
      # stand on. And `binutils` is `objdump`, which the floor below is read
      # with — every runner image carries one, and a check that silently had no
      # tool to run would be the one failure this leg cannot afford to miss.
      #
      # The sysctl is Chromium's sandbox, for the reason `ci.yml` lifts the same
      # restriction for bubblewrap: the `chrome-sandbox` inside an AppImage is
      # not setuid and the image is mounted `nosuid` besides, so the browser
      # falls back to an unprivileged user namespace — which Ubuntu 24.04 denies
      # through AppArmor, and Chromium answers by refusing to start at all. The
      # runner is a throwaway VM, so the restriction goes off rather than a
      # profile being written for a file that is about to be thrown away with
      # it.
      - name: Install what running this file here wants
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 fuse3 binutils dunst
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@v7.0.1
        with:
          # The bump commit, as every leg does — see the `viewer` job.
          ref: ${{ needs.prepare.outputs.sha }}

      # The same pins the viewer's leg and `ci.yml` take — see the action. The
      # Electron this packs is not the one installed here: that package's
      # download is denied in `desktop/pnpm-workspace.yaml`, and
      # electron-builder fetches the pinned build itself — see
      # `desktop/electron-builder.yml`.
      - name: Set up the desktop app
        uses: ./.github/actions/setup-pnpm-project
        with:
          project: desktop

      # The sidecar, which is the whole reason this leg waits on the matrix.
      - name: Fetch the CLI this app carries
        uses: actions/download-artifact@v8.0.1
        with:
          name: verkstead-linux-x64
          path: sidecar

      # **The executable bit is put back before anything is packed.** An
      # artifact is a zip and a zip carries no mode, so what arrived above is a
      # binary nothing can spawn — and the app spawns it as its sidecar. It goes
      # in with the mode it has here, which is what the `ask` assertion below
      # finds out by running it out of the mounted image.
      #
      # `pnpm run pack` rather than electron-builder: the configuration cannot
      # name which `verkstead` this app is to carry, so the script is what
      # stages it — see `desktop/scripts/pack.mjs`, and `VERKSTEAD_CLI` is the
      # same variable a developer packing from a checkout says it in.
      - name: Pack the app
        working-directory: desktop
        env:
          VERKSTEAD_CLI: ${{ github.workspace }}/sidecar/verkstead-linux-x64
        run: |
          chmod +x "$VERKSTEAD_CLI"
          pnpm run pack

      # **Mounted, because everything asserted below is asserted of the file
      # that is uploaded.** An AppImage is its own mount command: the runtime
      # prints where it put the image and stays running until it is killed, so
      # the mount belongs to the job rather than to this step, and the steps
      # after this one read the path out of the environment. The job ending is
      # what takes it down.
      #
      # It is an assertion in its own right, and a promise to a downloader:
      # this file mounts itself on a machine that has a
      # `/dev/fuse` and a `fusermount3` and no libfuse2 at all, which is the
      # pinned runtime's doing — and nothing but a real mount says so.
      - name: The AppImage mounts
        run: |
          mkdir -p target/electron
          where=target/electron/mounted
          ./"$APPIMAGE" --appimage-mount > "$where" 2>&1 &
          # The path appears when the filesystem is up, so this is the wait and
          # the assertion both. An `if` rather than a `&&`, which under `set -e`
          # would end the step on the first turn round the loop that found
          # nothing.
          for _ in $(seq 50); do
            mounted=$(head -1 "$where" || true)
            if [ -n "$mounted" ] && [ -d "$mounted" ]; then
              break
            fi
            sleep 0.2
          done
          if [ ! -f "$mounted/AppRun" ]; then
            echo "::error::The AppImage did not mount."
            cat "$where"
            exit 1
          fi
          echo "Mounted at $mounted:"
          ls "$mounted"
          echo "MOUNTED=$mounted" >> "$GITHUB_ENV"

      # **The floor this artifact runs on, read off it rather than decided by
      # the machine that packed it.** A bundle carries every library it links
      # but not the C runtime — a process holding two of those has two of
      # everything the C library keeps — so what the loader on a downloader's
      # machine has to satisfy is the highest glibc anything inside names. The
      # Rust AppImage was compiled by this leg, so that number was the image the
      # leg ran in, and an older image was the whole of how it was held down.
      # Nothing here is compiled at all now: the sidecar is statically linked
      # musl and names no glibc at any version, so what is left is Electron's
      # own floor, out of the sysroot Chromium is built against.
      #
      # So it is read, over every file in the mounted image — the app's own
      # binaries, the handful of libraries electron-builder carries beside them,
      # and the sidecar, which is the one of the three that could raise this
      # number by having arrived from somewhere it should not have.
      #
      # Said as a number here rather than taken from whatever was measured,
      # because it is a promise made to a downloader and
      # not a fact about a runner — the two are one number, and moving Electron
      # moves both. Anything over it is a file that packs, runs here, and
      # refuses to start on the machines that promise names, with
      # `GLIBC_2.xx not found` and nothing friendlier, long after a release.
      - name: The AppImage asks for no glibc newer than 2.25
        env:
          FLOOR: "2.25"
        run: |
          asked=$(find "$MOUNTED" -type f -print0 |
            xargs -0 objdump -T 2> /dev/null |
            grep -o 'GLIBC_[0-9][0-9.]*' | sort -u -V | tail -1)
          asked=${asked#GLIBC_}
          echo "The highest glibc asked for is ${asked:-none}."
          # Nothing found is a check that did not run rather than an app that
          # asks for nothing: Electron is dynamically linked against the C
          # library, so some version is always named.
          if [ -z "$asked" ]; then
            echo "::error::Nothing in the AppImage names a glibc version at all."
            exit 1
          fi
          # `sort -V` and read the last: over the floor is the only failure, and
          # a version scheme is not a number to compare with `-gt`.
          if [ "$(printf '%s\n%s\n' "$FLOOR" "$asked" | sort -V | tail -1)" != "$FLOOR" ]; then
            echo "::error::The AppImage asks for glibc $asked, above the $FLOOR it promises."
            exit 1
          fi

      # The half of this download a *session* gets, and the invariant the
      # Sandbox stands on (ADR-0020): what a session spawned by this app runs is
      # the binary inside the mounted image, by path, saying `ask`. An AppImage
      # carrying the window alone would come up, serve, draw its icon, pass
      # every other assertion here, and hand each session it spawned a binary
      # with no `ask` in it.
      #
      # **Run as it is, with nothing exported in front of it**, which is the
      # other thing this proves: the sidecar is static, so a session is handed
      # the binary itself rather than a launcher pointing a loader at the
      # bundle's libraries — see `crates/server/src/sandbox.rs`. The help is
      # read rather than the exit status alone, so that a binary answering with
      # some other command's usage fails here rather than passing.
      - name: The binary inside the mounted image answers ask
        run: |
          help=$("$MOUNTED/resources/cli/verkstead" ask --help)
          printf '%s\n' "$help"
          case "$help" in
            *"Question Set"*) ;;
            *)
              echo "::error::The binary inside the AppImage does not answer ask."
              exit 1
              ;;
          esac

      # What a human downloads this file for, asserted on one run of the file
      # itself: a window, an icon in the tray, and the viewer behind both.
      #
      # **A screen, deliberately.** This app *is* a window — there is no
      # headless path to fall back on — so a run without a display is a run
      # that proves nothing this leg exists for. Xvfb is started and `$DISPLAY`
      # points at it.
      #
      # **And a session bus, deliberately.** The app says the icon is in the
      # tray whether or not anything is listening, so this assertion would pass
      # on a runner with no bus at all — and would mean less than it reads.
      # `dbus-launch` gives the run a bus of its own, so the line is said
      # after a StatusNotifierItem was really exported onto one. What it still
      # does not prove is a *panel*: nothing here owns the watcher name, which
      # is the desktop-with-no-tray-host case the README describes
      # and `desktop/tests` pins.
      #
      # **The log is where the answers are.** Neither the window coming up nor
      # the icon being raised is visible from outside the process, so the app
      # says both itself — see `desktop/src/window.ts` and `desktop/src/tray.ts`
      # — and `$XDG_STATE_HOME` is set so the file it says them in is somewhere
      # this step knows. `$VERKSTEAD_DATA_DIR` is the server's own variable,
      # passed on to the sidecar by the app, and it is where the key below goes.
      #
      # `--retry-connrefused` rather than a sleep, as in the CLI legs: the
      # server is up when it answers.
      #
      # **Bounded**, because the failures this app draws it has a screen for are
      # drawn as dialogs, and a dialog waits for somebody to dismiss it. Nobody
      # is here, so a run that got that far would hold the job until the
      # runner's own six hours were up rather than failing in front of whoever
      # tagged.
      - name: The window comes up, the icon goes into the tray, and the viewer is inside
        timeout-minutes: 5
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/state
          VERKSTEAD_DATA_DIR: ${{ runner.temp }}/data
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          screen=$!
          export DISPLAY=:99
          # The socket is what says the display is up, and a Chromium started
          # before it is there is one that will not start. Spelled as an `if`
          # for the reason the mount's loop is.
          for _ in $(seq 50); do
            if [ -e /tmp/.X11-unix/X99 ]; then
              break
            fi
            sleep 0.2
          done

          log="$XDG_STATE_HOME/verkstead/verkstead.log"
          # The Workbench Key, as in the matrix's serving assertion and for the
          # reason said there: the server answers 401 to a request that has
          # shown nothing, and a key written into the Data Directory before the
          # start is the key it adopts. The window reads the same file.
          key=the-key-this-leg-states
          mkdir -p "$VERKSTEAD_DATA_DIR"
          printf '%s\n' "$key" > "$VERKSTEAD_DATA_DIR/workbench.key"

          # The bus is started apart from the app rather than around it, so
          # that `$app` is the app: a `dbus-run-session` in front of it is what
          # a kill would reach, and the app and its server would outlive this
          # step and hold the address the next step starts on.
          eval "$(dbus-launch --sh-syntax)"
          ./"$APPIMAGE" &
          app=$!
          document=$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 1 --retry-connrefused \
            --cookie "workbench_key=$key" \
            http://127.0.0.1:8422/)

          # The window is opened once the server answers and the icon is raised
          # beside it, so the document above is no promise that either has
          # happened yet. Waited for here rather than read after the kill, where
          # whichever won the race would be the answer.
          for _ in $(seq 100); do
            if grep -q "the window is opening on" "$log" 2> /dev/null &&
              grep -q "the icon is in the tray" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done

          # Waited for, so that the server is gone before the next step starts
          # one of its own on the same address.
          kill "$app"
          wait "$app" || true
          kill "$screen" "$DBUS_SESSION_BUS_PID" || true

          # As in the CLI legs: an absent viewer is a 503 that `--fail` has
          # already caught, and this is the rest of it — the document vite wrote
          # names the hashed bundle beside it, and the fallback names nothing.
          case "$document" in
            */assets/*) ;;
            *)
              echo "::error::The AppImage served a document with no bundle in it."
              printf '%s\n' "$document"
              exit 1
              ;;
          esac

          # And the two lines, out of the app's own log. Read for what is there
          # rather than against what is not, so that a log which was never
          # written — no log directory, and the app's events on a standard error
          # nobody kept — fails here rather than passing for want of anything to
          # find in it.
          for said in "the window is opening on" "the icon is in the tray"; do
            if ! grep -q "$said" "$log" 2> /dev/null; then
              echo "::error::The app's log does not say \"$said\"."
              cat "$log" 2> /dev/null || echo "There is no log at $log."
              exit 1
            fi
          done
          cat "$log"

      # **And a notice reaches the desktop as a notification**, which is the
      # other thing this app is downloaded for once the window is shut: the
      # sidecar streams every notice the phones get to the app, and the app
      # draws each as the platform's own notification (ADR-0020, *Amended:
      # notifications are the app's own*). Asserted end to end on the file
      # itself — the stream held, a Set asked, the notification shown, and a
      # notification daemon on the runner saying it was handed one.
      #
      # **A daemon, deliberately, for the reason the bus above is one.** Electron
      # draws a Linux notification through libnotify, which it loads at runtime
      # rather than links — the AppImage carries a copy beside Electron for a
      # desktop without one — and libnotify hands it to whatever owns
      # `org.freedesktop.Notifications` on the session bus. With nothing there
      # the app would still say it showed one, so `dunst` owns the name on a bus
      # of this step's own, and the `Notify` call read off that bus is the word that
      # the daemon was handed the notification, with the title the Set gave it.
      #
      # **Started `--hidden`, which is a login's start**: the app draws a notice
      # only while its window is not in front, because a window in front already
      # draws the news — and a window that never came up is the one case of that
      # with nothing about a window manager or focus left to chance. The tray is
      # on by default, which is what lets a hidden start be one.
      #
      # **The Set is asked the way a session asks one**, by the binary inside the
      # mounted image, from a Conversation over this checkout made through the
      # same two routes the development guide's quickstart scripts. `--deferred`
      # so the ask returns as soon as the Set is stored rather than waiting on an
      # answer nobody here will give.
      - name: A notice is shown as a notification, and the daemon is handed it
        timeout-minutes: 5
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/state
          VERKSTEAD_DATA_DIR: ${{ runner.temp }}/data
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          screen=$!
          export DISPLAY=:99
          for _ in $(seq 50); do
            if [ -e /tmp/.X11-unix/X99 ]; then
              break
            fi
            sleep 0.2
          done

          # One bus for the daemon, the app and the question asked of the daemon
          # afterwards, which `dbus-run-session` around a single command cannot
          # give three commands.
          eval "$(dbus-launch --sh-syntax)"
          dunst > dunst.log 2>&1 &
          daemon=$!
          for _ in $(seq 50); do
            if dunstctl is-paused > /dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done
          # What crossed the bus to the daemon, which is the record: dunst keeps
          # a notification in its history only once it has closed, and one on
          # the screen is in no list a command can read.
          dbus-monitor --session \
            "type='method_call',interface='org.freedesktop.Notifications',member='Notify'" \
            > notify.log 2>&1 &
          monitor=$!

          log="$XDG_STATE_HOME/verkstead/verkstead.log"
          rm -f "$log"
          key=$(cat "$VERKSTEAD_DATA_DIR/workbench.key")

          ./"$APPIMAGE" --hidden &
          app=$!

          # The stream is opened once the server answers, so this is the wait
          # for both — and a Set asked before it is held is a notice nobody hears.
          for _ in $(seq 150); do
            if grep -q "the notices stream is held" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done

          # A repository of the step's own to ask from, on a `main` with one
          # commit: the checkout is a detached HEAD with no default branch, which
          # a Repo is refused for.
          repo="$RUNNER_TEMP/asking"
          git init -q -b main "$repo"
          git -C "$repo" -c user.name=release -c user.email=release@localhost \
            commit -q --allow-empty -m "the repository a Set is asked from"
          curl --fail --silent --show-error -X POST \
            --cookie "workbench_key=$key" -H 'Content-Type: application/json' \
            -d "{\"path\":\"$repo\"}" http://127.0.0.1:8422/api/ui/repos
          echo
          curl --fail --silent --show-error -X POST \
            --cookie "workbench_key=$key" -H 'Content-Type: application/json' \
            -d '{"repo_id":1}' http://127.0.0.1:8422/api/ui/conversations
          echo
          (cd "$repo" && VERKSTEAD_SERVER=http://127.0.0.1:8422/conversations/1 \
            "$MOUNTED/resources/cli/verkstead" ask --deferred "$GITHUB_WORKSPACE/examples/questions.yaml")

          for _ in $(seq 100); do
            if grep -q "a notice is shown" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done
          # A moment for the daemon, which hears it after the app has said so.
          sleep 1

          kill "$app" "$monitor" "$daemon" "$screen" || true
          kill "$DBUS_SESSION_BUS_PID" || true
          cat "$log" 2> /dev/null || echo "There is no log at $log."

          for said in "the notices stream is held" "a notice is shown"; do
            if ! grep -q "$said" "$log" 2> /dev/null; then
              echo "::error::The app's log does not say \"$said\"."
              exit 1
            fi
          done
          if grep -q "a notification failed" "$log"; then
            echo "::error::The app showed a notification and the platform refused it."
            exit 1
          fi

          cat notify.log
          if ! grep -q '"Rate limiting for the public API"' notify.log; then
            echo "::error::The notification daemon was never handed the notification."
            cat dunst.log
            exit 1
          fi

      # Under an artifact name that says which desktop this is rather than what
      # the file is called. `publish` fetches the CLI binaries by a
      # `verkstead-*` pattern and counts what arrives, so a desktop asset named
      # in that scheme — a Windows `.exe` would be — would be counted as a sixth
      # binary; keeping every desktop leg's artifact under `desktop-*` is what
      # holds the two sets apart whatever the files inside them are called.
      # `publish` is where the file's own name is written down.
      #
      # An artifact is a zip, so the executable bit does not survive the trip,
      # and a Release asset has no mode to carry it either. The file was run
      # above, where it still had one, and whoever downloads it chmods it — as
      # they do a bare binary.
      - name: Upload the AppImage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-linux
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error

  # The macOS desktop artifact: the same Electron app the AppImage carries,
  # drawn over AppKit instead of GTK and inside the disk image a Mac download
  # arrives as. A leg of its own rather than two rows in the matrix above, for
  # the reason `desktop-linux` gives about itself — what it uploads is a packed
  # bundle rather than a bare binary, it wants a window server, and nothing
  # about it is that matrix's shape.
  #
  # **It waits on the whole `build` job**, as `desktop-linux` does and for the
  # reason ADR-0020 gives: what goes inside is `verkstead-macos-x64` and
  # `verkstead-macos-arm64`, the two binaries that matrix already built and ran,
  # downloaded here and joined rather than built a second time — so the sidecar
  # a session is handed is the artifact a downloader gets. A `needs` cannot name
  # one row of a matrix, so it names the job. The viewer artifact is not wanted
  # beside them: the viewer is embedded in each of those binaries at compile
  # time, so fetching the CLI fetches the viewer with it.
  #
  # **And it compiles nothing**, which is most of what this leg used to be: no
  # Rust toolchain, no `targets: aarch64-apple-darwin, x86_64-apple-darwin`, no
  # cache of its own, and no `web/dist` to fetch first. `lipo` is still here —
  # a universal app carries a universal sidecar — but over two downloads rather
  # than two builds, and inside `desktop/scripts/pack.mjs` rather than in a
  # script of this leg's own, so that a developer packing from a checkout packs
  # the way this does.
  #
  # `macos-15` all the same: `lipo`, `hdiutil`, `codesign` and `iconutil` are
  # the operating system's own tools, and that image is the Apple silicon one —
  # the half more people download.
  desktop-macos:
    name: Verkstead-universal.dmg
    needs: [prepare, build]
    runs-on: macos-15
    env:
      # Where `pnpm run pack` leaves it, where the steps below mount it, and the
      # bundle inside that mount: three paths said once each, because every step
      # below packs, mounts, reads or uploads one of them. Under `target/`, which
      # is where `desktop/electron-builder.yml` puts everything it makes.
      DMG: target/electron/out/Verkstead-universal.dmg
      MOUNT: target/electron/mounted
      APP: target/electron/mounted/Verkstead.app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The bump commit, as every leg does — see the `viewer` job.
          ref: ${{ needs.prepare.outputs.sha }}

      # The same pins the viewer's leg and `ci.yml` take — see the action. The
      # Electron this packs is not the one installed here: that package's
      # download is denied in `desktop/pnpm-workspace.yaml`, and
      # electron-builder fetches the pinned build itself — see
      # `desktop/electron-builder.yml`.
      - name: Set up the desktop app
        uses: ./.github/actions/setup-pnpm-project
        with:
          project: desktop

      # Both halves of the sidecar, which is the whole reason this leg waits on
      # the matrix. Two steps because an artifact is fetched by name and these
      # are two artifacts; into the one directory because what the pack is given
      # is two paths beside each other.
      - name: Fetch the Apple silicon CLI this app carries
        uses: actions/download-artifact@v8.0.1
        with:
          name: verkstead-macos-arm64
          path: sidecar

      - name: Fetch the Intel CLI this app carries
        uses: actions/download-artifact@v8.0.1
        with:
          name: verkstead-macos-x64
          path: sidecar

      # **Two paths rather than `VERKSTEAD_CLI`**, which is the one thing a
      # Mac's pack says differently from the other two platforms': the app is
      # universal, so the sidecar inside it is too, and the `lipo` that joins
      # them is `desktop/scripts/pack.mjs`'s (ADR-0020). Either order — `lipo`
      # reads each half's architecture off the half — and that script reads both
      # architectures back off what it wrote, a `lipo` given one input writing a
      # perfectly good single-architecture file.
      #
      # **The executable bit is put back on each half first.** An artifact is a
      # zip and a zip carries no mode, so what arrived above is a pair of
      # binaries nothing can spawn. The mode the sidecar goes in with is not
      # these: `lipo` neither reads nor copies it, and the script states 0755
      # over the file it writes. But a half nothing can run is the first thing
      # anybody debugging this leg would try to run, and the bit costs a line.
      # **A release never publishes an ad-hoc Mac app** (ADR-0027, *The
      # release*): Squirrel.Mac refuses an ad-hoc signed update, so one shipped
      # would be a version no Mac could update to or from. The pack itself
      # signs ad-hoc when it is given no certificate, which is what a checkout,
      # a pull request and the probe branch want — so it is this leg that
      # refuses, before anything is packed, naming the secret it has not got.
      # `docs/releasing.md` says how each is made.
      #
      # Repository secrets rather than an environment's, so that a throwaway
      # workflow on another branch can be handed the same certificate.
      - name: The Developer ID certificate is in the secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          missing=0
          for secret in CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::The repository has no $secret secret," \
                "so this Mac app would be signed ad-hoc and could never update."
              missing=1
            fi
          done
          exit "$missing"

      - name: Pack the app
        working-directory: desktop
        env:
          ARM64: ${{ github.workspace }}/sidecar/verkstead-macos-arm64
          X64: ${{ github.workspace }}/sidecar/verkstead-macos-x64
          # electron-builder's own names: the base64 of the `.p12` and its
          # password, which the pack imports into a keychain of its own and
          # throws away after. Its log says whose identity it signed with.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          chmod +x "$ARM64" "$X64"
          pnpm run pack "$ARM64" "$X64"
          ls -l ../target/electron/out

      # **Mounted, because everything asserted below is asserted of the file
      # that is uploaded** — rather than of the `Verkstead.app` the pack left
      # beside the image, which is the copy that was made before the image was
      # packed and could differ from it. Opened the way a download is opened.
      #
      # At a path this job names rather than the `/Volumes/Verkstead` the volume
      # name would otherwise take, so that the steps below have one path to say
      # whatever else this runner has mounted; `-readonly` because that is what
      # a downloader's is; and `-nobrowse` because there is no Finder here for
      # it to appear in.
      - name: The dmg mounts
        run: |
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$PWD/$MOUNT"
          ls -l "$MOUNT"
          ls -l "$APP/Contents"

      # The half of this download a *session* gets, and the invariant the
      # Sandbox stands on (ADR-0020): what a session spawned by this app runs is
      # the binary inside the mounted image, by path, saying a verb of its own. A
      # bundle carrying the window alone would come up, serve, draw its icon,
      # pass every other assertion here, and hand each session it spawned a
      # binary with no `ask` in it.
      #
      # Both of the verbs an agent has rather than the exit status alone: the
      # help is read for what only `ask`'s prints, and the Guide for its own
      # first heading, so a binary answering with some other command's usage
      # fails here rather than passing.
      - name: The binary inside answers ask and guide
        run: |
          binary="$APP/Contents/Resources/cli/verkstead"

          help=$("$binary" ask --help)
          printf '%s\n' "$help"
          case "$help" in
            *"Question Set"*) ;;
            *)
              echo "::error::The binary inside the dmg does not answer ask."
              exit 1
              ;;
          esac

          guide=$("$binary" guide)
          case "$guide" in
            *"Asking the human"*) ;;
            *)
              echo "::error::The binary inside the dmg does not print the Guide."
              printf '%s\n' "$guide"
              exit 1
              ;;
          esac

      # And that what a downloader mounts is still sealed. The reason this was
      # first written is gone — the bundle's executable was a shell script, whose
      # signature lives in an extended attribute a copy can drop, and it is a
      # real Mach-O again — but it is kept, because an Apple silicon Mac refuses
      # to execute a Mach-O carrying no signature at all, and a seal broken by
      # the pack or by the image is the "damaged" a Mac will not open rather than
      # the "unidentified developer" it offers a way past. Which is worth failing
      # a tag over.
      #
      # Over the bundle and over the sidecar inside it: the pack signs the app
      # and everything electron-builder knows to be in it, and the sidecar is an
      # extra resource that arrived from another job.
      #
      # **And that the seal is a Developer ID's, under the hardened runtime**,
      # over both again: notarization refuses anything less, Squirrel.Mac
      # refuses an ad-hoc update, and the sidecar is the binary every session
      # is spawned from — a bundle signed properly around a sidecar signed
      # ad-hoc is one Apple's notary sends back. `codesign -dv` prints an
      # `Authority=` line per certificate in the chain, the leaf's first, and
      # the runtime among its `flags=`; it prints them to standard error.
      - name: The signature survived the packing
        run: |
          codesign --verify --strict --verbose=2 "$APP"
          codesign --verify --strict "$APP/Contents/Resources/cli/verkstead"

          for signed in "$APP" "$APP/Contents/Resources/cli/verkstead"; do
            shown=$(codesign -dv --verbose=2 "$signed" 2>&1)
            printf '%s\n' "$shown" | grep -E '^(Authority|Identifier|TeamIdentifier|CodeDirectory)'
            if ! printf '%s\n' "$shown" | grep -q '^Authority=Developer ID Application: '; then
              echo "::error::$signed is not signed by a Developer ID Application certificate."
              exit 1
            fi
            if ! printf '%s\n' "$shown" | grep -Eq 'flags=[^ ]*runtime'; then
              echo "::error::$signed is not signed with the hardened runtime."
              exit 1
            fi
          done

      # And that the icon a downloader drags into Applications resolves to a
      # file macOS can read. The Finder icon is the one thing about this bundle
      # that nothing running the app can tell you about — v0.1.2 shipped a sound
      # icns under a `CFBundleIconFile` naming no file at all, passed every
      # assertion beside this one, and drew the generic app icon on every Mac
      # that downloaded it.
      #
      # Read off the mounted plist rather than out of the configuration that
      # wrote it: the point is a Mac reading back what was packed, so the name is
      # taken from the bundle and looked for in the bundle. Exactly, and against
      # the directory listing rather than with `[ -f ]` alone — the volume is
      # HFS+, which is case-insensitive, so a test that only opened the file
      # would pass on a name macOS's own lookup would not.
      #
      # Then `iconutil` over the file, which is the other half of resolving: a
      # name pointing at an icns the system cannot parse draws the same
      # placeholder as a name pointing at nothing. Its output goes to the
      # runner's temp because the image is mounted read-only, under a name ending
      # in `.iconset`, which is the extension that conversion writes and the only
      # one it accepts.
      - name: The bundle's icon resolves
        run: |
          resources="$APP/Contents/Resources"
          iconset="$RUNNER_TEMP/Verkstead.iconset"

          icon=$(plutil -extract CFBundleIconFile raw -o - \
            "$APP/Contents/Info.plist") || {
            echo "::error::The bundle's Info.plist has no CFBundleIconFile."
            exit 1
          }
          echo "CFBundleIconFile is $icon"

          if ! ls "$resources" | grep -qxF "$icon"; then
            echo "::error::CFBundleIconFile names $icon," \
              "which is no file in Contents/Resources."
            ls -l "$resources"
            exit 1
          fi

          iconutil --convert iconset --output "$iconset" \
            "$resources/$icon" || {
            echo "::error::iconutil will not read $icon:" \
              "macOS would draw the generic icon."
            exit 1
          }
          ls -l "$iconset"

      # **And the two things the plist says about this app that nothing running
      # it can tell you**, read back off the mounted bundle the way the icon's
      # name is and for the reason the AppImage's glibc floor is: both are
      # promises made to a downloader rather than facts about
      # a runner, and `desktop/electron-builder.yml` says of each that it is read
      # off what was packed.
      #
      # **`LSUIElement` by its absence**, which is the whole of what makes this a
      # regular Dock app: that key is what made the Rust bundle a menu-bar app
      # with no Dock tile, ADR-0020 retires it, and electron-builder writes no
      # such key — so there is nothing here to turn off and nothing but this to
      # notice one arriving. An app that grew one back would come up, serve, draw
      # its icon and pass every other assertion in this leg, and the close that
      # ADR-0020 made a hide would leave a Verkstead with no way back.
      #
      # **And the floor as a number said here**, not as whatever the bundle
      # happens to carry: it is Electron's own, out of the runtime
      # electron-builder fetched, and the promise and the check are one number —
      # move Electron and both move. Over it is a download that starts on fewer
      # Macs than the words say, months after a tag.
      - name: The bundle is a Dock app and asks for no macOS newer than 12
        env:
          FLOOR: "12.0"
        run: |
          plist="$APP/Contents/Info.plist"

          # Extracting a key that is not there exits non-zero, which is the
          # answer wanted here: absent is right, and any value at all is wrong.
          if ui=$(plutil -extract LSUIElement raw -o - "$plist" 2> /dev/null); then
            echo "::error::The bundle's Info.plist has LSUIElement set to $ui," \
              "which is a menu-bar app with no Dock tile."
            exit 1
          fi
          echo "There is no LSUIElement, so the app has a Dock tile."

          asked=$(plutil -extract LSMinimumSystemVersion raw -o - "$plist") || {
            echo "::error::The bundle's Info.plist names no LSMinimumSystemVersion," \
              "so nothing says which Macs it starts on."
            exit 1
          }
          echo "LSMinimumSystemVersion is $asked."
          # Over the floor is the only failure — a bundle that starts on more
          # Macs than the words promise is the words being cautious. Compared
          # component by component in `awk` rather than with `sort -V`, which is
          # how the AppImage's floor is read: that leg runs on Linux and this one
          # on a Mac, whose `sort` is another implementation, and a version is
          # not a number to hand to `-gt` either way.
          if ! awk -v asked="$asked" -v floor="$FLOOR" '
            BEGIN {
              n = split(asked, a, "."); m = split(floor, f, ".");
              for (i = 1; i <= (n > m ? n : m); i++) {
                if ((a[i] + 0) > (f[i] + 0)) exit 1;
                if ((a[i] + 0) < (f[i] + 0)) exit 0;
              }
              exit 0;
            }'; then
            echo "::error::The bundle asks for macOS $asked," \
              "above the $FLOOR the documentation promises."
            exit 1
          fi

      # **And that the menu bar's own artwork came along.** It is the one thing
      # this app ships that nothing running it ever names by its full set: the
      # app hands Electron the one-times path and AppKit finds the `@2x` beside
      # it, so a Retina Mac is the only place a missing second file shows and
      # there is no Retina display on a runner. A missing file of either size is
      # a `Tray` holding an empty image — an icon that is not there, over a log
      # line still saying it is — which is the failure the assertions below
      # cannot see.
      #
      # Against the directory listing rather than with `[ -f ]`, for the reason
      # the icon's name is read that way: the volume is case-insensitive, and
      # `Template` at the end of the name is the whole of how Electron is asked
      # for a template image, so a file the loader would open under a different
      # case is not a file that draws.
      - name: The menu bar's artwork is inside
        run: |
          resources="$APP/Contents/Resources"

          for artwork in menubarTemplate.png menubarTemplate@2x.png; do
            if ! ls "$resources" | grep -qxF "$artwork"; then
              echo "::error::$artwork is not in Contents/Resources," \
                "so the menu bar icon would be drawn from nothing."
              ls -l "$resources"
              exit 1
            fi
          done
          echo "Both menu bar template files are in $resources."

      # What a human downloads this file for, asserted on one run of the app out
      # of the mount: a window, an icon in the menu bar, and the viewer behind
      # both.
      #
      # **No screen to arrange**, which is the one place this is shorter than the
      # AppImage's assertion: a macOS runner is a logged-in session with a window
      # server of its own, so the window really opens and the icon really reaches
      # the menu bar with nothing started in front of them.
      #
      # **The app takes no flags**, so this is the whole command line: there is
      # no `--no-open`, no `--listen` and no `--data-dir` on it — the window is
      # what it opens instead of a browser, the port is the server's own, and
      # `$VERKSTEAD_DATA_DIR` is how the directory is said. Which is the server's
      # own variable, and what the app hands its sidecar.
      #
      # **The log is where the answers are**: neither the window coming up nor
      # the icon being raised is visible from outside the process, so the app
      # says both itself — see `desktop/src/window.ts` and `desktop/src/tray.ts`.
      # The Log Directory on macOS is `~/Library/Logs/Verkstead` — see
      # `crates/server/src/platform.rs` — which a runner has a home for and needs
      # nothing said about; the file is taken away first all the same, so that a
      # line found in it is this run's.
      #
      # `--retry-connrefused` rather than a sleep, as in every other leg: the
      # app is up when it answers.
      #
      # **Bounded**, for the reason the AppImage's is: the failures this app
      # draws it has a screen for are drawn as dialogs, and a dialog nobody
      # dismisses would hold the job until the runner's own six hours were up
      # rather than failing in front of whoever tagged.
      - name: The window comes up, the icon goes into the menu bar, and the viewer is inside
        timeout-minutes: 5
        env:
          VERKSTEAD_DATA_DIR: ${{ runner.temp }}/data
        run: |
          log="$HOME/Library/Logs/Verkstead/verkstead.log"
          rm -f "$log"

          # The Workbench Key, as in the matrix's serving assertion and for the
          # reason said there: the server answers 401 to a request that has
          # shown nothing, and a key written into the Data Directory before the
          # start is the key it adopts. The window reads the same file.
          key=the-key-this-leg-states
          mkdir -p "$VERKSTEAD_DATA_DIR"
          printf '%s\n' "$key" > "$VERKSTEAD_DATA_DIR/workbench.key"

          "$APP/Contents/MacOS/Verkstead" &
          app=$!
          document=$(curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused \
            --cookie "workbench_key=$key" \
            http://127.0.0.1:8422/)

          # The window is opened once the server answers and the icon is raised
          # beside it, so the document above is no promise that either has
          # happened yet. Waited for here rather than read after the kill, where
          # whichever won the race would be the answer.
          for _ in $(seq 100); do
            if grep -q "the window is opening on" "$log" 2> /dev/null &&
              grep -q "the icon is in the tray" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done

          # Whatever it has got to: an app that ended on its own is a failure the
          # assertions below name, rather than one for `kill` to report first.
          kill "$app" || true

          # As in every other leg: an absent viewer is a 503 that `--fail` has
          # already caught, and this is the rest of it — the document vite wrote
          # names the hashed bundle beside it, and the fallback names nothing.
          case "$document" in
            */assets/*) ;;
            *)
              echo "::error::The app served a document with no bundle in it."
              printf '%s\n' "$document"
              exit 1
              ;;
          esac

          # And the two lines, out of the app's own log. Read for what is there
          # rather than against what is not, so that a log which was never
          # written — no log directory, and the app's events on a standard error
          # nobody kept — fails here rather than passing for want of anything to
          # find in it.
          for said in "the window is opening on" "the icon is in the tray"; do
            if ! grep -q "$said" "$log" 2> /dev/null; then
              echo "::error::The app's log does not say \"$said\"."
              cat "$log" 2> /dev/null || echo "There is no log at $log."
              exit 1
            fi
          done
          cat "$log"

      # **And a notice reaches the desktop as a notification** — the stream the
      # sidecar holds open to the app, a Set asked, and the notification drawn —
      # asserted on the app out of the mount as the AppImage's leg asserts it on
      # the file, and for the same reasons: started `--hidden`, so no window is
      # in front to make the notice redundant, and the Set asked by the binary
      # inside the bundle from a Conversation over this checkout.
      #
      # **What this leg is for beyond the other two is the signature.** The
      # notification centre is the one part of macOS that may decline an app it
      # cannot place, which an ad-hoc bundle was and a Developer ID one should
      # not be; Electron says so with a `failed` event, which the app logs.
      # So the line saying it was shown, the absence of that refusal, and
      # `usernoted` presenting it are all read. Measured on macos-15: an ad-hoc
      # bundle installed in `/Applications` is presented, and the same bundle
      # run out of the mounted image is refused — so it is installed first.
      - name: A notice is shown as a notification
        timeout-minutes: 5
        env:
          VERKSTEAD_DATA_DIR: ${{ runner.temp }}/data
        run: |
          log="$HOME/Library/Logs/Verkstead/verkstead.log"
          rm -f "$log"
          key=$(cat "$VERKSTEAD_DATA_DIR/workbench.key")

          # Installed the way a downloader installs it, by copying it out of
          # the image into `/Applications` — which is where LaunchServices
          # learns the bundle's identifier. The notification centre finds an
          # app through that record, and run straight out of the mount it has
          # none: `usernoted` answers "LSApplicationRecord failed to find
          # net.tobico.Verkstead" and Electron's `failed` says the app is not
          # allowed to notify.
          installed=/Applications/Verkstead.app
          ditto "$APP" "$installed"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister \
            -f "$installed"

          "$installed/Contents/MacOS/Verkstead" --hidden &
          app=$!

          for _ in $(seq 150); do
            if grep -q "the notices stream is held" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done

          # A repository of the step's own to ask from, on a `main` with one
          # commit: the checkout is a detached HEAD with no default branch, which
          # a Repo is refused for.
          repo="$RUNNER_TEMP/asking"
          git init -q -b main "$repo"
          git -C "$repo" -c user.name=release -c user.email=release@localhost \
            commit -q --allow-empty -m "the repository a Set is asked from"
          curl --fail --silent --show-error -X POST \
            --cookie "workbench_key=$key" -H 'Content-Type: application/json' \
            -d "{\"path\":\"$repo\"}" http://127.0.0.1:8422/api/ui/repos
          echo
          curl --fail --silent --show-error -X POST \
            --cookie "workbench_key=$key" -H 'Content-Type: application/json' \
            -d '{"repo_id":1}' http://127.0.0.1:8422/api/ui/conversations
          echo
          (cd "$repo" && VERKSTEAD_SERVER=http://127.0.0.1:8422/conversations/1 \
            "$installed/Contents/Resources/cli/verkstead" ask --deferred "$GITHUB_WORKSPACE/examples/questions.yaml")

          for _ in $(seq 100); do
            if grep -q "a notice is shown" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done
          # Time for a refusal, which arrives after the show it refuses.
          sleep 3

          # And the notification centre's own word that it took it: `usernoted`
          # logs every notification it presents, by the bundle identifier it
          # validated the app under. A refusal never gets this far.
          presented=$(log show --last 2m --style compact \
            --predicate 'process == "usernoted"' |
            grep 'Presenting <NotificationRecord app:"net.tobico.Verkstead"' || true)

          kill "$app" || true
          cat "$log" 2> /dev/null || echo "There is no log at $log."

          for said in "the notices stream is held" "a notice is shown"; do
            if ! grep -q "$said" "$log" 2> /dev/null; then
              echo "::error::The app's log does not say \"$said\"."
              exit 1
            fi
          done
          if grep -q "a notification failed" "$log"; then
            echo "::error::The app showed a notification and the notification centre refused it."
            exit 1
          fi

          printf '%s\n' "$presented"
          if [ -z "$presented" ]; then
            echo "::error::The notification centre presented nothing from net.tobico.Verkstead."
            exit 1
          fi

      # Before the upload and whatever the assertions said, because the mount is
      # inside the directory the artifact is read out of and nothing else on this
      # runner would take it down. Asked of `hdiutil` first: a run that failed
      # before the image was packed has nothing attached, and a detach of nothing
      # is an error about the wrong thing.
      - name: Unmount the dmg
        if: always()
        run: |
          if hdiutil info | grep -qF "$PWD/$MOUNT"; then
            # Forced on the second try, because this step runs `always()` and
            # the run it has to clean up after is the one where the assertion
            # above failed: a leg that ended before its `kill` leaves the app
            # running out of the mount, and a detach refused as busy would
            # report that as a failure to unmount rather than as the failure
            # it was. The first try is still the polite one, so a mount
            # nothing is holding comes down the way it always did.
            hdiutil detach "$PWD/$MOUNT" ||
              hdiutil detach -force "$PWD/$MOUNT"
          fi

      # Under the `desktop-` artifact prefix, for the reason the AppImage's
      # upload gives: that prefix is what keeps a desktop asset out of the count
      # `publish` makes of the bare binaries, whatever the file inside it is
      # called. `publish` is where the file's own name is written down.
      #
      # A zip carries no symlink and no mode, and neither does a Release asset —
      # but a dmg is a filesystem in a file, so what comes back out of this
      # artifact is the image itself with the app, the `/Applications` symlink
      # and every mode either of them has still inside it. Which is the other
      # half of why a Mac download is an image rather than a folder.
      - name: Upload the dmg
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-macos
          path: ${{ env.DMG }}
          if-no-files-found: error

  # The Windows desktop artifact: the same Electron app the other two legs pack,
  # inside the NSIS installer a Windows download arrives as. A leg of its own rather than a
  # row in the matrix above, for the reason `desktop-linux` gives about itself —
  # what it uploads is an installer rather than a bare binary, and nothing about
  # it is that matrix's shape.
  #
  # **It waits on the whole `build` job**, as both other desktop legs do and for
  # the reason ADR-0020 gives: what goes inside is `verkstead-windows-x64.exe`,
  # the binary that matrix already built and ran, downloaded here rather than
  # built a second time — so the sidecar a session is handed is the artifact a
  # downloader gets. A `needs` cannot name one row of a matrix, so it names the
  # job, where it used to name `viewer`. That artifact is not wanted at all now:
  # the viewer is embedded in the binary above at compile time, so fetching the
  # CLI fetches the viewer with it.
  #
  # **And it compiles nothing**: no Rust toolchain, no `touch` of the embed to
  # defeat cargo's staleness, and no `web/dist` to fetch first. The package is
  # electron-builder's `nsis` target, which fetches its own makensis
  # (ADR-0027, and `desktop/electron-builder.yml`).
  #
  # `windows-2025` all the same: makensis is a Windows program, and the
  # install and every assertion after it want a real Windows to happen on.
  #
  # x86_64 only, as the AppImage is (ADR-0012, kept by ADR-0020): Windows on
  # arm64 runs an x86_64 exe under the emulation it has for exactly this.
  desktop-windows:
    name: Verkstead-x86_64.exe
    needs: [prepare, build]
    runs-on: windows-2025
    # Every `run` below is a shell script, as in the `build` job above: said
    # once here rather than left to the PowerShell a Windows runner defaults
    # to, so that this leg's assertions read as the other two legs' do. What
    # only Windows can answer — the registry, a shortcut's target, the bytes of
    # a PE header — is asked of `powershell` a line at a time from inside them.
    defaults:
      run:
        shell: bash
    env:
      # Where `pnpm run pack` leaves it, said once: the steps below install
      # this file and upload it. Under `target/`, which is where
      # `desktop/electron-builder.yml` puts everything it makes.
      INSTALLER: target/electron/out/Verkstead-x86_64.exe
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The bump commit, as every leg does — see the `viewer` job. It is the
          # commit whose `desktop/package.json` carries this release's version,
          # which is the number the installer carries as its version.
          ref: ${{ needs.prepare.outputs.sha }}

      # The same pins the viewer's leg and `ci.yml` take — see the action. The
      # Electron this packs is not the one installed here: that package's
      # download is denied in `desktop/pnpm-workspace.yaml`, and
      # electron-builder fetches the pinned build itself — see
      # `desktop/electron-builder.yml`.
      - name: Set up the desktop app
        uses: ./.github/actions/setup-pnpm-project
        with:
          project: desktop

      # The sidecar, which is the whole reason this leg waits on the matrix.
      - name: Fetch the CLI this app carries
        uses: actions/download-artifact@v8.0.1
        with:
          name: verkstead-windows-x64.exe
          path: sidecar

      # `pnpm run pack` rather than electron-builder: the configuration cannot
      # name which `verkstead` this app is to carry, so the script is what
      # stages it — see `desktop/scripts/pack.mjs`, and `VERKSTEAD_CLI` is the
      # same variable a developer packing from a checkout says it in.
      #
      # No `chmod` in front of it, unlike both other legs: an artifact is a zip
      # and a zip carries no mode, and this platform has no mode for it to have
      # dropped.
      - name: Pack the app
        working-directory: desktop
        env:
          VERKSTEAD_CLI: ${{ github.workspace }}/sidecar/verkstead-windows-x64.exe
        run: |
          pnpm run pack
          ls -l ../target/electron/out

      # Installed rather than unpacked, which is what makes every assertion
      # below one about the file that is uploaded: this is that installer,
      # handed to Windows the way a double-click hands it over — the whole
      # product, and nothing asked of anybody.
      #
      # `/S` is what stands in for the human, and it is also what keeps
      # `runAfterFinish` out of every install this leg makes: electron-builder's
      # template starts the app after a silent install only when it is also
      # told `--force-run`, so the installer starts the app for a human who
      # double-clicked the file and never for a quiet install here.
      #
      # Through `Start-Process -Wait` rather than started from this shell,
      # because the installer is a windows-subsystem program: run directly it
      # hands back a prompt before the install it started has finished, and
      # every step below would then be asking about a half-written directory.
      # NSIS writes no log of its own, so the exit code is the whole of what a
      # failed install says.
      - name: The installer installs
        run: |
          installer=$(cygpath -w "$INSTALLER")
          code=0
          powershell -NoProfile -Command \
            "exit (Start-Process -FilePath \"$installer\" -ArgumentList '/S' -Wait -PassThru).ExitCode" ||
            code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::The installer refused to install (exit $code)."
            exit 1
          fi

      # **Per-user, which is the decision the whole package turns on**: the app
      # is unsigned, so an installer asking for administrator would be an
      # unsigned program asking for the machine, and elevation buys a
      # downloader nothing they wanted.
      #
      # **An NSIS installer writes its registration where its scope says**:
      # a per-user install writes its Installed apps entry under `HKCU`'s
      # Uninstall key, a per-machine one under `HKLM`'s, and nothing else
      # writes either for it. So the claim is made there — one entry in the
      # first, none in the second — and the entry is also what somebody who
      # installed this has to find again to remove it.
      #
      # Three things therefore say it landed the way the package asked: the
      # files are in this user's profile, the install is registered to this
      # user rather than to the machine, and Installed apps can see it.
      #
      # **The profile directory is `…\Programs\Verkstead`**, which is the one
      # thing about where it landed that `desktop/build/installer.nsh` decides
      # rather than electron-builder: left alone, a per-user install is named
      # for the package, `verkstead-desktop`. It is the directory Launch on
      # Startup's Run value names `Verkstead.exe` inside, so a wrong one here
      # is a machine that stops starting the app at login.
      #
      # **And the two files are the launcher and the CLI under it**: `Verkstead.exe`
      # at the root is what electron-builder names the launcher, and the
      # sidecar is in a directory of its own inside the install (ADR-0020).
      # Looked for with `find` rather than with `[ -f ]`, the way the dmg leg
      # reads the names inside a bundle: NTFS does not read case, so a test that
      # only opened the file would pass on a spelling Windows' own lookup treats
      # as another name — and the two spellings one directory cannot hold are
      # the whole reason the CLI has a directory at all.
      #
      # Where they landed is then written down for the steps after this one,
      # because one of them points `LOCALAPPDATA` at a directory of its own and
      # could no longer work it out.
      - name: It installed into this user's profile, and nowhere else
        run: |
          install="$(cygpath -u "$LOCALAPPDATA")/Programs/Verkstead"
          for file in "$install/Verkstead.exe" "$install/resources/cli/verkstead.exe"; do
            if [ -z "$(find "$(dirname "$file")" -maxdepth 1 \
              -name "$(basename "$file")" 2> /dev/null)" ]; then
              echo "::error::$file is not there, under that spelling or at all."
              find "$(cygpath -u "$LOCALAPPDATA")/Programs" -maxdepth 2 2> /dev/null ||
                echo "There is no Programs directory in this profile at all."
              exit 1
            fi
          done
          ls -l "$install" "$install/resources/cli"

          # Both hives asked in one pass and printed whole, so that a leg which
          # fails below shows what Windows actually recorded rather than only
          # which assertion tripped over it.
          registration=$(powershell -NoProfile -Command "
            \$user = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              Where-Object DisplayName -eq 'Verkstead')
            \$machine = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              Where-Object DisplayName -eq 'Verkstead')
            'user=' + \$user.Count
            'machine=' + \$machine.Count
            'says=' + ((\$user + \$machine | ForEach-Object { \$_.DisplayVersion + ' at ' + (\$_.PSPath -replace '^.*::','') + ', uninstalled by ' + \$_.QuietUninstallString }) -join '; ')
          " | tr -d '\r')
          echo "$registration"

          user=$(printf '%s\n' "$registration" | sed -n 's/^user=//p')
          machine=$(printf '%s\n' "$registration" | sed -n 's/^machine=//p')

          if [ "$user" != 1 ] || [ "$machine" != 0 ]; then
            echo "::error::Verkstead is registered $user time(s) to this user and $machine to the machine, and a per-user install is 1 and 0."
            exit 1
          fi
          echo "Installed apps says: Verkstead $(printf '%s\n' "$registration" | sed -n 's/^says=//p')"

          echo "INSTALL=$install" >> "$GITHUB_ENV"

      # The way in, and the one thing about it a human would notice going
      # wrong. Three claims, each asked of what was installed rather than of
      # what it was built from:
      #
      # **There is an entry**, in this user's own Start menu — which is where a
      # per-user install writes one, and says once more what the step above
      # established. It is the entry that carries `net.tobico.Verkstead` as its
      # AppUserModelID, which the toast below depends on.
      #
      # **It opens the app**: the shortcut names `Verkstead.exe` at the install
      # root, which is the launcher electron-builder writes and the file its
      # installer hangs the shortcut off. There is no verb for it to carry and no
      # shim for it to name — the app is the one way into itself.
      #
      # **And it opens no console with it**, which the shim used to be the whole
      # answer to: `verkstead.exe` is an ordinary console program on every
      # platform, so a shortcut naming *that* would put a black window in front
      # of whoever clicked. Read out of the file's PE header rather than off a
      # run of it, a subsystem being a fact about the file: the field sits 92
      # bytes into the optional header, which is 24 bytes past where the offset
      # at `0x3c` points, and 2 there is the windowed kind where 3 is the
      # console one. What it asserts is that whatever the entry opens is a
      # windows-subsystem program, and an Electron launcher is one.
      #
      # The target is read through `WScript.Shell`, which reads one off an
      # ordinary shortcut, and an NSIS installer writes no other kind.
      #
      # Paths are compared with the case taken out of them, because that is how
      # Windows compares them and nothing here settles whose spelling of the
      # profile directory each side got.
      - name: The Start-menu entry opens the app, and opens no console with it
        run: |
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          lnk="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Verkstead.lnk"
          if [ ! -f "$lnk" ]; then
            echo "::error::The install left no Start-menu entry at $lnk."
            exit 1
          fi

          launcher="$INSTALL/Verkstead.exe"
          target=$(powershell -NoProfile -Command \
            "(New-Object -ComObject WScript.Shell).CreateShortcut('$(cygpath -w "$lnk")').TargetPath" |
            tr -d '\r')
          echo "The entry opens $target."
          if [ "$(lower "$(cygpath -u "$target")")" != "$(lower "$launcher")" ]; then
            echo "::error::The Start-menu entry does not open $launcher."
            exit 1
          fi

          subsystem=$(powershell -NoProfile -Command \
            "\$bytes = [IO.File]::ReadAllBytes('$(cygpath -w "$launcher")'); [BitConverter]::ToUInt16(\$bytes, [BitConverter]::ToInt32(\$bytes, 0x3c) + 92)" |
            tr -d '\r')
          echo "Its subsystem is $subsystem."
          if [ "$subsystem" != "2" ]; then
            echo "::error::$launcher is a console program, so the entry would open a window in front of the app."
            exit 1
          fi

      # The half of the install that is not the app at all: a human at a
      # terminal. A session Verkstead spawns is handed the server's own image
      # by path, but somebody typing `verkstead ask` is handed whatever `PATH`
      # says — so the installer puts a directory of the install on this user's own
      # `PATH`, and this is that entry read back the way a terminal opened
      # afterwards would read it.
      #
      # Assembled out of the registry rather than taken from this step's
      # environment, which is the whole point: this shell started before the
      # install and its `PATH` says nothing about it. What Windows hands a new
      # process is the machine's list and then the user's, so that is what is
      # joined here, and `cygpath -up` turns the `;`-separated Windows list
      # into the `:`-separated one this shell looks names up in.
      #
      # **And the directory is `resources\cli` rather than the install root**,
      # which is the assertion worth making both ways round. The root holds
      # `Verkstead.exe`; Windows resolves a `PATH` lookup without regard to
      # case, and so does the lookup this shell makes; so a root on `PATH` would
      # answer `verkstead guide` with a window rather than with the Guide, which
      # is the promise kept backwards. The root is therefore asked of the list
      # rather than of what a lookup found — a lookup finds the first answer and
      # says nothing about a second.
      #
      # Set inside the substitution rather than exported, so that everything
      # after it still has the runner's own `PATH` — `cygpath` and `tr` among
      # them, which live somewhere the registry never mentions.
      - name: verkstead guide answers in a fresh terminal, and the install root does not
        run: |
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          windows=$(powershell -NoProfile -Command \
            "[Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')" |
            tr -d '\r')
          fresh=$(cygpath -up "$windows")

          # The root, against every entry of the list rather than against the
          # first answer. A trailing separator comes off each one: a Windows
          # directory property ends in one, and the root and the CLI's directory
          # are the same string up to it.
          root=$(lower "$INSTALL")
          IFS=: read -r -a entries <<< "$fresh"
          for entry in "${entries[@]}"; do
            if [ "$(lower "${entry%/}")" = "$root" ]; then
              echo "::error::$INSTALL is on this user's PATH, and the verkstead there is the app rather than the CLI."
              printf '%s\n' "$fresh"
              exit 1
            fi
          done
          echo "The install root is not on this user's PATH."

          # Which `verkstead` before what it prints: a `PATH` that found some
          # other one would answer this step's question with the wrong binary.
          # `tr -s` because a Windows directory property ends in a separator and
          # a shell joining a name onto one leaves two — the entry the installer
          # writes names a directory *inside* the install rather than the
          # property alone, so it does not, and one fewer thing depends on that.
          cli=$(lower "$INSTALL/resources/cli")
          found=$( PATH="$fresh"; command -v verkstead || true )
          found=$(printf '%s' "$found" | tr -s '/')
          echo "A fresh terminal finds ${found:-nothing}."
          case "$(lower "$found")" in
            "$cli"/verkstead | "$cli"/verkstead.exe) ;;
            *)
              echo "::error::A terminal opened after the install does not find $INSTALL/resources/cli/verkstead.exe."
              exit 1
              ;;
          esac

          guide=$( PATH="$fresh"; verkstead guide )
          printf '%s\n' "$guide" | head -n 5
          case "$guide" in
            *"Asking the human"*) ;;
            *)
              echo "::error::The installed binary printed no Guide."
              exit 1
              ;;
          esac

      # What a human downloads this file for, asserted on one run of what the
      # install left: a window, an icon in the notification area, and the viewer
      # behind both. Started the way the Start-menu entry starts it — the
      # launcher at the install root, by path and with nothing in front of it.
      #
      # **No screen to arrange**, as on macOS and unlike the AppImage's leg: a
      # Windows runner has a window station of its own, so the window really
      # opens and the icon really reaches the notification area with nothing
      # started before them.
      #
      # **The app takes no flags**, which is what this run says differently from
      # the tray app's: there is no `--no-open`, no `--listen` and no
      # `--data-dir` on it — the window is what it opens instead of a browser,
      # the port is the server's own, and `VERKSTEAD_DATA_DIR` is how the Data
      # Directory is said. Which is the server's own variable, and what the app
      # hands its sidecar.
      #
      # **The log is where the answers are**, as in both other legs: neither the
      # window coming up nor the icon being raised is visible from outside the
      # process, so the app says both itself — see `desktop/src/window.ts` and
      # `desktop/src/tray.ts`, and the two lines waited for are theirs rather
      # than the tray app's one. The Log Directory on Windows is
      # `%LOCALAPPDATA%\Verkstead` — see `desktop/src/platform.ts` — so that
      # variable is pointed at a directory of this run's own, which is both
      # where the file will be and a guarantee that a line found in it is this
      # run's. It moves nothing else: the install went to the real one while it
      # still said so, and where that was is `INSTALL`.
      #
      # **Two shapes of the same path**, which is this leg's own wrinkle: the
      # app is a Windows program and wants `D:\…`, while the `grep` below is an
      # MSYS one and wants `/d/…`. `cygpath` is what turns the first into the
      # second, rather than either of them being written out twice.
      #
      # `--retry-connrefused` rather than a sleep, as in every other leg: the
      # app is up when it answers.
      #
      # **Bounded**, for the reason the other two are: the failures this app
      # draws it has a screen for are drawn as dialogs, and a dialog nobody
      # dismisses would hold the job until the runner's own six hours were up
      # rather than failing in front of whoever tagged.
      #
      # And its output goes to a file, for the reason the matrix's serving
      # assertion gives: a background process holding this step's standard
      # output is a step that does not end.
      - name: The window comes up, the icon goes into the tray, and the viewer is inside
        timeout-minutes: 5
        env:
          LOCALAPPDATA: ${{ runner.temp }}\state
          VERKSTEAD_DATA_DIR: ${{ runner.temp }}\data
        run: |
          log="$(cygpath -u "$LOCALAPPDATA")/Verkstead/verkstead.log"

          # The Workbench Key, as in the matrix's serving assertion and for the
          # reason said there: the server answers 401 to a request that has
          # shown nothing, and a key written into the Data Directory before the
          # start is the key it adopts. The window reads the same file.
          key=the-key-this-leg-states
          data="$(cygpath -u "$VERKSTEAD_DATA_DIR")"
          mkdir -p "$data"
          printf '%s\n' "$key" > "$data/workbench.key"

          "$INSTALL/Verkstead.exe" > app.log 2>&1 &
          app=$!
          document=$(curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused \
            --cookie "workbench_key=$key" \
            http://127.0.0.1:8422/)

          # The window is opened once the server answers and the icon is raised
          # beside it, so the document above is no promise that either has
          # happened yet. Waited for here rather than read after the kill, where
          # whichever won the race would be the answer.
          for _ in $(seq 100); do
            if grep -q "the window is opening on" "$log" 2> /dev/null &&
              grep -q "the icon is in the tray" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done

          # By image name rather than by what this shell backgrounded: an
          # Electron app is a launcher and the helper processes it starts, and
          # the sidecar is a process of its own beside them. Windows compares an
          # image name without regard to case, so the one name covers
          # `Verkstead.exe` and the `verkstead.exe` it spawned both — which is
          # the same case-blindness this whole layout is arranged around.
          taskkill //F //IM verkstead.exe > /dev/null 2>&1 || true
          kill -9 "$app" 2> /dev/null || true
          cat app.log

          # As in every other leg: an absent viewer is a 503 that `--fail` has
          # already caught, and this is the rest of it — the document vite wrote
          # names the hashed bundle beside it, and the fallback names nothing.
          case "$document" in
            */assets/*) ;;
            *)
              echo "::error::The installed app served a document with no bundle in it."
              printf '%s\n' "$document"
              exit 1
              ;;
          esac

          # And the two lines, out of the app's own log. Read for what is there
          # rather than against what is not, so that a log which was never
          # written — no log directory, and the app's events on a standard error
          # nobody kept — fails here rather than passing for want of anything to
          # find in it.
          for said in "the window is opening on" "the icon is in the tray"; do
            if ! grep -q "$said" "$log" 2> /dev/null; then
              echo "::error::The app's log does not say \"$said\"."
              cat "$log" 2> /dev/null || echo "There is no log at $log."
              exit 1
            fi
          done
          cat "$log"

      # **And a notice reaches the desktop as a toast** — the stream the sidecar
      # holds open to the app, a Set asked, and the notification drawn —
      # asserted on what the install left, as the other two legs assert it, and
      # for their reasons: started `--hidden`, so no window is in front to make
      # the notice redundant, and the Set asked by the installed CLI from a
      # Conversation over this checkout.
      #
      # **What this leg is for beyond the other two is the AppUserModelID.** A
      # Windows toast belongs to an application id, and Windows shows one only
      # for an id something on the machine has claimed — here the Start-menu
      # entry the installer wrote, which carries the id `main.ts` sets. A toast under
      # an id nothing claims is dropped, and Electron says so with a `failed`
      # event, which the app logs. So the line saying it was shown and the
      # absence of that refusal are both read.
      - name: A notice is shown as a toast
        timeout-minutes: 5
        env:
          LOCALAPPDATA: ${{ runner.temp }}\state
          VERKSTEAD_DATA_DIR: ${{ runner.temp }}\data
        run: |
          log="$(cygpath -u "$LOCALAPPDATA")/Verkstead/verkstead.log"
          rm -f "$log"
          data="$(cygpath -u "$VERKSTEAD_DATA_DIR")"
          key=$(cat "$data/workbench.key")

          "$INSTALL/Verkstead.exe" --hidden > app.log 2>&1 &
          app=$!

          for _ in $(seq 150); do
            if grep -q "the notices stream is held" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done

          # A repository of the step's own to ask from, on a `main` with one
          # commit: the checkout is a detached HEAD with no default branch, which
          # a Repo is refused for.
          repo="$(cygpath -u "$RUNNER_TEMP")/asking"
          git init -q -b main "$repo"
          git -C "$repo" -c user.name=release -c user.email=release@localhost \
            commit -q --allow-empty -m "the repository a Set is asked from"
          # The path as the server reads one here, with forward slashes so that
          # nothing has to be escaped to put it in JSON.
          curl --fail --silent --show-error -X POST \
            --cookie "workbench_key=$key" -H 'Content-Type: application/json' \
            -d "{\"path\":\"$(cygpath -m "$repo")\"}" http://127.0.0.1:8422/api/ui/repos
          echo
          curl --fail --silent --show-error -X POST \
            --cookie "workbench_key=$key" -H 'Content-Type: application/json' \
            -d '{"repo_id":1}' http://127.0.0.1:8422/api/ui/conversations
          echo
          (cd "$repo" && VERKSTEAD_SERVER=http://127.0.0.1:8422/conversations/1 \
            "$INSTALL/resources/cli/verkstead.exe" ask --deferred "$GITHUB_WORKSPACE/examples/questions.yaml")

          for _ in $(seq 100); do
            if grep -q "a notice is shown" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done
          # Time for a refusal, which arrives after the show it refuses.
          sleep 3

          # And Windows' own record of it: the notification platform writes
          # every toast it accepts into this user's database, under the
          # application id it was raised for — so a row under the Start-menu
          # entry's id, carrying the Set's title, is the toast delivered rather
          # than only asked for.
          toasts=$(python - "$USERPROFILE/AppData/Local/Microsoft/Windows/Notifications/wpndatabase.db" << 'EOF'
          import sqlite3, sys
          db = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
          for handler, payload in db.execute(
              "select h.PrimaryId, n.Payload from Notification n"
              " join NotificationHandler h on n.HandlerId = h.RecordId"
              " where n.Type = 'toast'"
          ):
              print(handler, (payload or b"").decode("utf-8", "replace").replace("\r\n", " "))
          EOF
          )

          taskkill //F //IM verkstead.exe > /dev/null 2>&1 || true
          kill -9 "$app" 2> /dev/null || true
          cat app.log
          cat "$log" 2> /dev/null || echo "There is no log at $log."

          for said in "the notices stream is held" "a notice is shown"; do
            if ! grep -q "$said" "$log" 2> /dev/null; then
              echo "::error::The app's log does not say \"$said\"."
              exit 1
            fi
          done
          if grep -q "a notification failed" "$log"; then
            echo "::error::The app showed a toast and Windows refused it."
            exit 1
          fi

          printf '%s\n' "$toasts"
          if ! printf '%s\n' "$toasts" |
            grep -q "^net.tobico.Verkstead .*Rate limiting for the public API"; then
            echo "::error::Windows holds no toast from net.tobico.Verkstead with the Set's title."
            exit 1
          fi

      # **An install over what is already there**, which is the one shape of
      # install a real machine makes after its first. Two halves, each followed
      # by three counts — one row in Installed apps, one entry on this user's
      # `PATH` naming the install, one Start-menu entry across both menus —
      # because those are the three ways two products would show to whoever
      # installed them. Asked after each half rather than once at the end, so
      # that a failure says which install left two.
      #
      # **The first half is this exe over itself**, with nothing uninstalled in
      # between: a second download of a version already installed, and the
      # shape electron-updater's update takes. It is the check that
      # `desktop/build/installer.nsh` adds its `PATH` entry once rather than once
      # more.
      #
      # **The second half is this exe over the last Release's msi**, which an
      # NSIS installer cannot upgrade: the include script finds the msi by its
      # UpgradeCode and uninstalls it before anything is extracted (Set 1393
      # Q2). So the order is the one a machine that ran that release is in —
      # this install taken away, the msi installed, then this exe over it — and
      # afterwards the msi is gone from Windows Installer's own record of this
      # user's products, as well as from the three counts.
      #
      # **And the `PATH` entry is read as well as counted.** The msi's entry and
      # this installer's name the same directory, so a count of one does not say
      # whose survived. What is checked is that the one left is
      # `resources\cli`, which is what a terminal needs.
      #
      # **Launch on Startup's Run value survives it.** That value is the app's,
      # written through Electron's login-item API from the window, which nothing
      # here can reach. So it is written the way that API writes it, before the
      # install over the msi, and read back after it: still there, unchanged,
      # and naming a `Verkstead.exe` that exists.
      #
      # **Where the last Release has no msi, that half is skipped with a
      # warning** saying it went unchecked, so a skip cannot be read off the log
      # as a pass. The Release before the first to ship this installer is the
      # last to carry an msi, so from the second Release that ships it this
      # half skips itself every run. It
      # retires with the removal code in `desktop/build/installer.nsh`, which
      # is there for machines still holding that msi.
      #
      # Before the uninstall step rather than after it, so that the install that
      # step takes away is the one made over the msi.
      - name: Installed over itself, and over the last Release's msi, it is still one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          # Every program below is a windows-subsystem one, so each is waited
          # for through `Start-Process -Wait` — see the step that installed this
          # in the first place.
          run() {
            said=$1
            program=$2
            arguments=$3
            code=0
            powershell -NoProfile -Command \
              "exit (Start-Process -FilePath \"$program\" -ArgumentList '$arguments' -Wait -PassThru).ExitCode" ||
              code=$?
            if [ "$code" -ne 0 ]; then
              echo "::error::$said failed (exit $code)."
              exit 1
            fi
            echo "$said: done."
          }

          # The three counts and what they are counting, in one pass and printed
          # whole, so that a count that is wrong shows what the machine holds.
          # Looked for by the name a human reads, because what is being asked is
          # what somebody opening Installed apps finds.
          counts() {
            powershell -NoProfile -Command "
              \$menus = @(
                (Join-Path \$env:APPDATA 'Microsoft\Windows\Start Menu\Programs'),
                (Join-Path \$env:ProgramData 'Microsoft\Windows\Start Menu\Programs')
              ) | Where-Object { Test-Path \$_ }
              \$arp = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
                Where-Object DisplayName -eq 'Verkstead')
              \$path = @([Environment]::GetEnvironmentVariable('Path','User') -split ';' |
                Where-Object { \$_ -like '*Verkstead*' })
              \$menu = @(\$menus | ForEach-Object { Get-ChildItem \$_ -Recurse -Filter 'Verkstead*.lnk' -EA SilentlyContinue })
              'arp=' + \$arp.Count
              'path=' + \$path.Count
              'menu=' + \$menu.Count
              'says=Installed apps: ' + ((\$arp | ForEach-Object { \$_.DisplayVersion + ' at ' + (\$_.PSPath -replace '^.*::','') }) -join '; ')
              'says=PATH: ' + (\$path -join '; ')
              'says=Start menu: ' + ((\$menu | ForEach-Object { \$_.FullName }) -join '; ')
            " | tr -d '\r'
          }

          # The msi products Windows Installer holds for this user, by name: a
          # per-user msi is recorded under this key and nowhere an NSIS install
          # writes.
          msis() {
            powershell -NoProfile -Command "
              @(Get-ItemProperty 'HKCU:\Software\Microsoft\Installer\Products\*' -EA SilentlyContinue |
                Where-Object ProductName -eq 'Verkstead').Count" | tr -d '\r'
          }

          # One of each, and the one `PATH` entry naming `resources\cli`.
          # Compared with the case and a trailing separator taken off, for the
          # reasons the steps above give.
          one() {
            said=$1
            report=$(counts)
            echo "After $said, the machine holds:"
            printf '%s\n' "$report" | sed -n 's/^says=/  /p'
            for pair in "arp=rows in Installed apps" "path=PATH entries" \
              "menu=Start-menu entries"; do
              got=$(printf '%s\n' "$report" | sed -n "s/^${pair%%=*}=//p")
              if [ "$got" != 1 ]; then
                echo "::error::After $said there are $got ${pair#*=} for Verkstead, and an install over another leaves one."
                exit 1
              fi
            done

            entry=$(printf '%s\n' "$report" | sed -n 's/^says=PATH: //p')
            got=$(lower "$(cygpath -u "$entry" 2> /dev/null)")
            if [ "${got%/}" != "$(lower "$INSTALL/resources/cli")" ]; then
              echo "::error::After $said the one PATH entry is '$entry', and it is not $INSTALL/resources/cli."
              exit 1
            fi
            echo "One row in Installed apps, one Start-menu entry, and the one PATH entry is $entry."
          }

          installer=$(cygpath -w "$INSTALLER")

          # The first half.
          run "Installing this exe over itself" "$installer" /S
          one "installing it over itself"

          # The second half, and the tag it is against: the last Release, since
          # the tag for this one is `publish`'s to make. The Release is read
          # before the asset, so that one with no msi is told apart from none.
          tag=$(gh release view --json tagName --jq .tagName 2> release.err) || tag=
          if [ -z "$tag" ]; then
            echo "::warning::There is no Release to fetch an msi from, so the install over the msi went unchecked."
            cat release.err
            exit 0
          fi
          if [ -z "$(gh release view "$tag" --json assets \
            --jq '.assets[].name | select(. == "Verkstead-x86_64.msi")')" ]; then
            echo "::warning::The last Release, $tag, carries no Verkstead-x86_64.msi, so the install over the msi went unchecked."
            exit 0
          fi
          gh release download "$tag" --pattern Verkstead-x86_64.msi --dir previous
          ls -l previous

          # This install taken away, the way Installed apps would take it.
          quiet=$(powershell -NoProfile -Command "
            (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              Where-Object DisplayName -eq 'Verkstead').QuietUninstallString" | tr -d '\r')
          program=${quiet#\"}
          program=${program%%\"*}
          run "Uninstalling it to make room for $tag's msi" "$program" "${quiet#\""$program"\"}"
          for _ in $(seq 60); do
            [ ! -e "$INSTALL" ] && break
            sleep 1
          done

          log=$(cygpath -w "$PWD/msiexec.log")
          code=0
          powershell -NoProfile -Command \
            "exit (Start-Process msiexec -ArgumentList '/i',\"$(cygpath -w "$PWD/previous/Verkstead-x86_64.msi")\",'/qn','/norestart','/l*v',\"$log\" -Wait -PassThru).ExitCode" ||
            code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Windows Installer refused $tag's msi (exit $code)."
            tr -d '\000' < msiexec.log | tail -n 200
            exit 1
          fi
          if [ "$(msis)" != 1 ]; then
            echo "::error::$tag's msi installed, and Windows Installer does not hold it for this user."
            exit 1
          fi
          echo "Windows Installer holds $tag's msi for this user."

          # Launch on Startup, registered the way Electron's login-item API
          # registers it: a value named `Verkstead`, holding the launcher in
          # quotes and `--hidden` — see `desktop/src/startup.ts`.
          start="\"$(cygpath -w "$INSTALL/Verkstead.exe")\" --hidden"
          START="$start" powershell -NoProfile -Command \
            "Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Verkstead -Value \$env:START"

          run "Installing this exe over $tag's msi" "$installer" /S
          one "installing it over $tag's msi"

          if [ "$(msis)" != 0 ]; then
            echo "::error::After installing over $tag's msi, Windows Installer still holds the msi for this user."
            exit 1
          fi
          echo "Windows Installer holds no Verkstead msi any more."

          kept=$(powershell -NoProfile -Command \
            "(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -EA SilentlyContinue).Verkstead" |
            tr -d '\r')
          echo "Launch on Startup's Run value says: $kept"
          if [ "$kept" != "$start" ]; then
            echo "::error::After installing over $tag's msi, the Run value is '$kept', and it was '$start'."
            exit 1
          fi
          if [ ! -f "$INSTALL/Verkstead.exe" ]; then
            echo "::error::The Run value names $INSTALL/Verkstead.exe, and there is nothing there."
            exit 1
          fi
          echo "The Run value is as it was, and names the launcher this install put there."

      # **And the uninstall takes back everything the install put down**, which
      # is a promise to whoever installed this as much as the install is: the
      # files, the Start-menu entry, the row in Installed apps and — the one
      # `desktop/build/installer.nsh` is answerable for — the entry on this
      # user's `PATH`. A `PATH` entry left behind names a directory that is no
      # longer there, in every terminal this user opens, until somebody finds it
      # by hand.
      #
      # **And it leaves the Data Directory alone**: `%APPDATA%\Verkstead`, which
      # electron-builder's uninstaller would delete as the app's data if it were
      # told to (`deleteAppDataOnUninstall`, which is off). A file is put there
      # first and looked for afterwards, because the steps above pointed the app
      # somewhere else and this profile's own is otherwise empty.
      #
      # The uninstaller is the one Installed apps would run, read out of the
      # registration as `QuietUninstallString` — the same command with its own
      # `/S`. Waited for by what it removes rather than by the process: an NSIS
      # uninstaller copies itself out of the directory it is about to delete and
      # runs the copy, so the process this shell started can be gone while the
      # uninstall is still going.
      - name: The uninstaller takes it all away, and leaves the Data Directory
        run: |
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          data="$(cygpath -u "$APPDATA")/Verkstead"
          mkdir -p "$data"
          printf '%s\n' "an uninstall leaves this" > "$data/uninstall-leaves-this"

          quiet=$(powershell -NoProfile -Command "
            (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              Where-Object DisplayName -eq 'Verkstead').QuietUninstallString" | tr -d '\r')
          echo "Installed apps uninstalls with: $quiet"
          if [ -z "$quiet" ]; then
            echo "::error::The registration names no quiet uninstaller."
            exit 1
          fi
          # `"C:\…\Uninstall Verkstead.exe" /currentuser /S` — the program in
          # its quotes, and what follows it.
          program=${quiet#\"}
          program=${program%%\"*}
          arguments=${quiet#\""$program"\"}
          code=0
          powershell -NoProfile -Command \
            "exit (Start-Process -FilePath \"$program\" -ArgumentList '$arguments' -Wait -PassThru).ExitCode" ||
            code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::The uninstaller refused to uninstall (exit $code)."
            exit 1
          fi

          lnk="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Verkstead.lnk"
          for _ in $(seq 60); do
            [ ! -e "$INSTALL" ] && [ ! -e "$lnk" ] && break
            sleep 1
          done

          report=$(powershell -NoProfile -Command "
            \$arp = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              Where-Object DisplayName -eq 'Verkstead')
            'arp=' + \$arp.Count
            'path=' + [Environment]::GetEnvironmentVariable('Path','User')
          " | tr -d '\r')
          printf '%s\n' "$report"

          failed=
          if [ -e "$INSTALL" ]; then
            echo "::error::The uninstall left $INSTALL behind."
            find "$INSTALL" -maxdepth 2
            failed=1
          fi
          if [ -e "$lnk" ]; then
            echo "::error::The uninstall left the Start-menu entry at $lnk."
            failed=1
          fi
          if [ "$(printf '%s\n' "$report" | sed -n 's/^arp=//p')" != 0 ]; then
            echo "::error::The uninstall left Verkstead in Installed apps."
            failed=1
          fi
          case "$(lower "$(printf '%s\n' "$report" | sed -n 's/^path=//p')")" in
            *'\programs\verkstead'*)
              echo "::error::The uninstall left an entry naming the install on this user's PATH."
              failed=1
              ;;
          esac
          if [ ! -f "$data/uninstall-leaves-this" ]; then
            echo "::error::The uninstall deleted the Data Directory, $data."
            failed=1
          fi
          [ -z "$failed" ] || exit 1
          echo "The install, its Start-menu entry, its row and its PATH entry are gone, and the Data Directory is where it was."

      # Under the `desktop-` artifact prefix, for the reason both other desktop
      # uploads give: that prefix is what keeps a desktop asset out of the count
      # `publish` makes of the bare binaries. Since the portable exe became an
      # installer the two could be told apart by name as well — but the rule is
      # the prefix rather than the extension, and a leg is not the place to
      # start making exceptions to it.
      - name: Upload the installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-windows
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

  # The tag and the Release, once every leg has succeeded — the desktop ones as
  # much as the matrix. `needs` is the whole of that rule: a matrix job has
  # failed if any of its legs did, and a job whose `needs` failed does not run
  # — so a release that could not be built for one architecture publishes
  # nothing, rather than a set that looks complete until somebody reaches for
  # what is not in it.
  #
  # The tag is made here rather than in `prepare` for that same reason. It is
  # the one write this workflow cannot take back — a tag is what
  # `releases/latest`, the flake's urls and every link anybody saves are keyed
  # by — so it is made at the last moment at which everything it names is known
  # to exist, and after it there is only the Release it was made for.
  publish:
    name: Publish
    needs: [prepare, build, desktop-linux, desktop-macos, desktop-windows]
    runs-on: ubuntu-24.04
    # The second of the three jobs that write. Pushing a tag and creating a
    # Release are both writes to the repository's contents, and it is granted
    # here rather than at the top of the file so that the build legs never hold
    # a token that can publish.
    permissions:
      contents: write
    steps:
      # A checkout, which this job did without until it started tagging: the
      # tag is made with git against the commit `prepare` landed, so the
      # repository has to be here. The sha rather than `main`, for the reason
      # every build leg takes the sha — `main` may have moved under a release
      # that takes an hour to build, and the tag belongs on what was built.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # The five bare binaries, and neither the viewer artifact this run is
      # also holding nor the desktop ones: `pattern` is what leaves both
      # behind, and every desktop leg names its artifact `desktop-…` precisely
      # so that it cannot land here and be counted as a sixth binary. Which was a
      # real hazard rather than a precaution while the Windows desktop download
      # was an exe, as the CLI one is; it is an installer now, and the prefix is
      # still what the split is made on rather than the extension.
      # `merge-multiple` unwraps the per-artifact directories, so what lands in
      # `binaries/` is five files under the names the legs gave them — which
      # are the names the assets carry, and the names the README's install
      # command will spell.
      - name: Fetch the CLI binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: verkstead-*
          merge-multiple: true
          path: binaries

      # What the pattern matched, counted before anything is published, and
      # counted through the same glob the upload below hands to `gh`. `needs`
      # says all five legs passed; this says all five arrived, which a
      # mistyped pattern would not.
      #
      # Five is this set's own number — one bare binary per platform the
      # project builds one for, which the Windows port made five of — and it
      # stays five however many desktop artifacts a release carries: those are
      # the step below's, checked by name, because a count is the wrong
      # question to ask of them.
      - name: All five CLI binaries are here
        run: |
          ls -l binaries
          # So that a glob matching nothing counts as none, rather than as the
          # one unexpanded pattern bash would otherwise leave behind.
          shopt -s nullglob
          binaries=(binaries/verkstead-*)
          if [ "${#binaries[@]}" -ne 5 ]; then
            echo "::error::Expected five binaries, found ${#binaries[@]}."
            exit 1
          fi

      # Everything every desktop leg built, under the artifact-name prefix that
      # keeps it out of the count above. `merge-multiple` again, so
      # `desktop-assets/` holds the files themselves under the names they will
      # carry as assets.
      #
      # `desktop-assets/` rather than `desktop/`, because this job checks the
      # repository out for the tag below and `desktop/` is already the Electron
      # app's own directory in it. Downloading over that leaves the installers
      # sitting among the app's sources, where the step below reads every one of
      # those sources as an asset that arrived unnamed — and where the upload's
      # glob would have published them.
      - name: Fetch the desktop artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-assets

      # Named rather than counted, which is the other half of the split above.
      # What can go wrong with a desktop artifact is its name — the name is
      # what an install line and the documentation spell out — and any count
      # would be satisfied by a leg that uploaded `verkstead-desktop.AppImage`.
      # So this is the one place the desktop asset names are written down, and
      # there is one line per desktop leg.
      #
      # Read both ways round: every name here arrived, and nothing arrived that
      # is not named here. Without the second, a leg this job has never been
      # told about would be built, uploaded, and quietly left off the Release.
      - name: The desktop artifacts are the ones named here
        env:
          DESKTOP_ASSETS: |
            Verkstead-x86_64.AppImage
            Verkstead-universal.dmg
            Verkstead-x86_64.exe
        run: |
          expected=$(printf '%s\n' "$DESKTOP_ASSETS" | sed '/^[[:space:]]*$/d' | sort)
          found=$(ls -1 desktop-assets 2> /dev/null | sort)
          if [ "$expected" != "$found" ]; then
            echo "::error::The desktop assets are not what this job expects."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Found:"
            printf '%s\n' "$found"
            exit 1
          fi
          printf '%s\n' "$found"

      # The tag, on the commit every artifact above was built from, and the
      # last thing before the Release that names it. Annotated rather than
      # lightweight — it is the one written record that this commit is this
      # version, and an annotation is where that sentence goes; `git describe`
      # reads annotated tags and skips the others besides.
      #
      # `prepare` established the tag was free before anything was built. This
      # asks again, because the answer could have changed in the hour since,
      # and because a re-run of a `publish` that tagged and then failed to
      # upload should find its own tag and carry on rather than stop on it.
      #
      # Pushed with the workflow's own `GITHUB_TOKEN`, which starts no workflow
      # run — nothing in this repository listens for a tag any more, and this
      # is why it does not need to.
      - name: Tag the commit this was built from
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG is already on origin."
          else
            git tag -a "$TAG" -m "Verkstead $TAG" "$SHA"
            git push origin "$TAG"
          fi
          # The sha rather than the tag: in the branch above, the tag is on
          # origin and not in this shallow checkout, and `log` would not find
          # it. What is worth reading here is the commit either way.
          git --no-pager log -1 --oneline "$SHA"

      # `gh` rather than a release action: it is on the runner already and it
      # takes the workflow's own token, so there is no third-party version to
      # pin for what is one API call. The repository is given by name all the
      # same, so that the step says what it is publishing to rather than
      # inferring it from the checkout above.
      #
      # A pre-release is semver's own rule, a hyphen after the version, as in
      # `v0.1.0-rc.1`. Marking it keeps `releases/latest` on the newest real
      # version, which is the url the install command asks for — so a release
      # that only rehearses the pipeline is a version with a hyphen in it, and
      # that is the whole of the difference between the two.
      #
      # Notes are generated rather than written. There is nobody to write them
      # at the moment a release is coined, and a release with an empty body is
      # worse than one listing what landed since the last tag. The `note`
      # input, where there is one, is `--notes`, which `gh` puts above the
      # generated notes. It is read through the environment like the version,
      # and left off entirely when it is empty, so a release without one is
      # published exactly as before.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTE: ${{ inputs.note }}
        run: |
          case "$TAG" in
            *-*) prerelease=(--prerelease) ;;
            *) prerelease=() ;;
          esac
          note=()
          if [ -n "$NOTE" ]; then
            note=(--notes "$NOTE")
          fi
          gh release create "$TAG" --generate-notes "${note[@]}" "${prerelease[@]}" \
            binaries/verkstead-* desktop-assets/*

      # What GitHub says it now has, in the log of the run that put it there —
      # the asset names an adopter's url has to match, and whether the tag was
      # read as a pre-release. The `manifest` job below reads this same Release
      # back to hash it; this is the same answer, for a human.
      - name: What was published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$TAG" --json isPrerelease,assets

  # What the Release now holds of the bare binaries, written down where the
  # binary flake can read it. The flake fetches by url and verifies by hash, and
  # nothing about it is hand-edited, so this job is the only thing standing
  # between a release and a flake that still points at the version before it.
  #
  # **Four here, where `publish` counts five and three.** The desktop artifacts
  # are no part of this — what the flake and the NixOS module run is the
  # headless daemon, and nothing fetches a bundle through nix — and neither is
  # the Windows CLI binary, for the plainer reason that there is no nix system
  # to key it under. This job is a map from nix's names to urls, so what it
  # carries is the platforms nix has, whatever else a Release holds.
  #
  # It runs after `publish` rather than beside it because the assets it hashes
  # are the published ones — see the hashing step for why that distinction is
  # the point of the job.
  manifest:
    name: Manifest
    needs: publish
    runs-on: ubuntu-24.04
    # The third and last job that writes: the manifest is a commit on `main`.
    permissions:
      contents: write
    env:
      # Where the four assets this job hashes now live. Built once here because
      # both the step that hashes them and the manifest it writes need the same
      # urls, and a url the manifest only resembles is a url nobody checked.
      DOWNLOAD_BASE: >-
        ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ inputs.version }}
    steps:
      # `main`, not the tag: the commit goes on top of whatever `main` has
      # reached by now. What the tag's own tree held is beside the point — the
      # manifest describes the Release, and the Release is already built.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      # Keyed by nix system name rather than by asset name, because a nix system
      # name is what the consumer already has in hand — the flake asks for
      # `x86_64-linux`, not for `verkstead-linux-x64`.
      #
      # Hashes are SRI, which is what `fetchurl` takes verbatim, so there is no
      # conversion step at the point of use. `sha256sum` speaks hex and SRI is
      # base64 of the same digest, which is the whole of what the `basenc` pair
      # is doing: decode the hex, re-encode as base64.
      #
      # Downloaded rather than read off the `publish` job's artifacts, so what
      # the manifest promises is what an adopter actually receives. A hash taken
      # from the build output would still be a true hash of a file we built; it
      # would just have never been compared against the one GitHub serves.
      - name: Build the manifest
        run: |
          mkdir -p downloads
          systems='{}'
          for pair in \
            x86_64-linux:verkstead-linux-x64 \
            aarch64-linux:verkstead-linux-arm64 \
            x86_64-darwin:verkstead-macos-x64 \
            aarch64-darwin:verkstead-macos-arm64
          do
            system=${pair%%:*}
            asset=${pair#*:}
            url="$DOWNLOAD_BASE/$asset"
            curl --fail --location --silent --show-error \
              --output "downloads/$asset" "$url"
            digest=$(sha256sum "downloads/$asset" | cut -d' ' -f1 |
              tr 'a-f' 'A-F' | basenc --base16 --decode | basenc --base64)
            systems=$(printf '%s' "$systems" | jq \
              --arg system "$system" --arg url "$url" \
              --arg hash "sha256-$digest" \
              '.[$system] = {url: $url, hash: $hash}')
          done
          # The tag without its leading `v`, which is how Cargo.toml and the
          # flake both spell a version.
          jq -n --arg version "${TAG#v}" --argjson systems "$systems" \
            '{version: $version, systems: $systems}' > nix/release.json
          cat nix/release.json

      # The same claim again, but read only through the file — every url and
      # every hash comes back out of the manifest rather than out of the loop
      # that wrote it. That is what makes this more than a repeat: a step that
      # paired a hash with the wrong system would have agreed with itself above,
      # and disagrees here, because the download is now driven by the url the
      # manifest actually recorded for that system.
      - name: The manifest matches what was published
        run: |
          if [ "$(jq -r .version nix/release.json)" != "${TAG#v}" ]; then
            echo "::error::The manifest does not name $TAG."
            exit 1
          fi
          if [ "$(jq -r '.systems | length' nix/release.json)" -ne 4 ]; then
            echo "::error::The manifest does not carry all four nix systems."
            exit 1
          fi
          mkdir -p verify
          drift=0
          # Fed by process substitution rather than a pipe, so the loop runs in
          # this shell and `drift` survives it.
          while read -r system url hash; do
            curl --fail --location --silent --show-error \
              --output verify/asset "$url"
            digest=$(sha256sum verify/asset | cut -d' ' -f1 |
              tr 'a-f' 'A-F' | basenc --base16 --decode | basenc --base64)
            if [ "sha256-$digest" != "$hash" ]; then
              echo "::error::$system: the manifest says $hash, but $url is sha256-$digest."
              drift=1
            else
              echo "$system $hash"
            fi
          done < <(jq -r '.systems | to_entries[] |
            "\(.key) \(.value.url) \(.value.hash)"' nix/release.json)
          exit "$drift"

      # Straight onto `main`, with no pull request — the exception this project
      # makes to its own review process, and `docs/agents/git-workflow.md`
      # records why: a manifest that needs a merge per release is a manifest
      # that goes stale the first time somebody is busy.
      #
      # The author is the bot, not whoever started the run. That address is
      # GitHub's own for `github-actions[bot]`, so the commit is attributed to
      # the app in the UI rather than to a person who never wrote it.
      #
      # Nothing re-triggers: a push made with the workflow's own `GITHUB_TOKEN`
      # does not start a workflow run, so this neither re-enters CI nor loops
      # back into this workflow — which nothing could do in any case, this
      # workflow being started by hand and by nothing else.
      #
      # A rejected push means `main` moved between the checkout and here, which
      # fails the run loudly; re-running the job checks out the new `main` and
      # writes the same manifest onto it.
      - name: Commit the manifest to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/release.json
          # A re-run of a release that already landed its manifest has nothing
          # to say, and an empty commit would say it anyway.
          if git diff --cached --quiet; then
            echo "The manifest already describes $TAG; nothing to commit."
            exit 0
          fi
          git commit -m "chore: release manifest for $TAG"
          git push origin HEAD:main
