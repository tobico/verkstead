# What a `v*` tag ships: one bare binary per platform the project ships, and
# beside them the Linux desktop app as an AppImage — each with the viewer inside
# it, published as a GitHub Release under the tag that triggered the run. Every
# leg builds its artifact and then runs it, so a target that will not build, or
# that builds something that will not run, fails the run rather than reaching a
# Release.
#
# A last job then records the bare binaries in `nix/release.json` and commits
# it to `main`, which is the whole interface to the binary flake.
#
# Pinned throughout, as `ci.yml` is: actions to released versions, runners to
# images rather than `-latest`, and Rust to the patch version the flake's
# nixpkgs carries.
name: Release

# A `v*` tag, which is a release; or a run started by hand, which is a rehearsal
# of one. Nothing else: every other commit is `ci.yml`'s, and a branch has
# nothing to ship.
#
# The rehearsal is here because the only other way to find out whether a leg
# works would be to publish. It builds every artifact and runs every assertion,
# while the two jobs that write — the Release and the manifest commit — run for
# a pushed tag and nothing else, so a run started by hand stops after the
# building. Asked of the event rather than of the ref, because
# `workflow_dispatch` takes a tag as readily as a branch: gated on the ref, a
# rehearsal somebody started against `v0.1.0` would publish it. See the `if` on
# each of them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read at the top, so that the jobs which compile the dependency tree and run
# other people's actions hold a token that can do nothing to the repository.
# The two jobs that write — the Release, and the manifest commit — widen this
# for themselves.
permissions:
  contents: read

jobs:
  # The viewer, built once. `rust-embed` reads `web/dist` at compile time, so
  # every build leg needs it on disk before cargo runs — but what vite writes
  # does not vary by platform, so building it in each leg would cost four times
  # over and let the four legs disagree about what they embedded.
  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1

      # pnpm, Node and the `--frozen-lockfile` install, shared with `ci.yml` —
      # see the action for what each pin is and why. So the viewer that ships is
      # built by the toolchain that CI checked it with.
      - name: Set up the viewer
        uses: ./.github/actions/setup-viewer

      - name: Build
        run: pnpm build

      # `path` is the job's one path that is not the viewer's: the job-wide
      # `working-directory` above governs `run` steps alone, and an action's
      # inputs are read from the repository root regardless.
      - name: Upload the viewer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: viewer
          path: web/dist
          if-no-files-found: error

  # One leg per asset, each on a runner of its own architecture: nothing is
  # cross-compiled, and so every leg can run the binary it just built.
  build:
    name: ${{ matrix.asset }}
    needs: viewer
    runs-on: ${{ matrix.runner }}
    strategy:
      # A broken leg does not cancel its siblings. Which targets are broken is
      # the thing this run is for, and cancelling would report them one per run.
      fail-fast: false
      matrix:
        include:
          - asset: verkstead-linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - asset: verkstead-linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - asset: verkstead-macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - asset: verkstead-macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    env:
      # Where cargo leaves it, said once: every step below either runs this file
      # or asks something of it.
      BINARY: target/${{ matrix.target }}/release/verkstead
    steps:
      - uses: actions/checkout@v7.0.1

      # Straight to where `#[folder]` points — see `crates/server/src/viewer.rs`.
      # `web/dist` is gitignored, so the checkout above left the directory empty
      # and this is the whole of what the embed will read.
      - name: Fetch the viewer
        uses: actions/download-artifact@v8.0.1
        with:
          name: viewer
          path: web/dist

      # musl-tools for the C in the dependency tree: `libsqlite3-sys` bundles
      # SQLite's own source and `ring` compiles C of its own, and both are built
      # by cc-rs rather than by rustc. The `CC_<target>` line is what points
      # cc-rs at the musl compiler: it looks for an `aarch64-linux-musl-gcc`
      # that Ubuntu's package does not install — what it installs is a native
      # `musl-gcc`, on both architectures — and falling back to the host gcc
      # would compile those C sources against glibc's headers.
      - name: Install musl
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      # The version branch _is_ the pin, as in `ci.yml`: 1.91.1 is what the
      # flake's nixpkgs carries, so a release binary is compiled by the rustc
      # the dev shell and CI both use.
      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      # The same cache `ci.yml` uses, keyed by target on top of what the action
      # already keys on: the four legs compile four different dependency trees,
      # and a key they shared would have each of them evicting the last.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      # The package by name rather than the whole workspace, for the reason
      # `nix/verkstead-source.nix` gives: `verkstead-render`'s default features
      # turn on the TypeScript emitter, which is a test's business, and a
      # workspace-wide build would unify it into the release binary.
      - name: Build
        run: >
          cargo build --release --locked
          --package verkstead-cli --target ${{ matrix.target }}

      # The claim the paragraph above makes, checked rather than trusted: the
      # emitter is a normal dependency of `verkstead-render` whenever its
      # `typescript` feature is on, so it is in this tree or it is in nothing
      # that was linked. `--edges normal` is what makes that the binary's
      # question — dev-dependencies enable the feature and are no part of it.
      - name: The build does not carry the TypeScript emitter
        run: |
          tree=$(cargo tree --package verkstead-cli --edges normal \
            --target ${{ matrix.target }})
          echo "$tree"
          if printf '%s\n' "$tree" | grep -q 'ts-rs'; then
            echo "::error::ts-rs was linked into the release binary."
            exit 1
          fi

      - name: The binary runs
        run: ./"$BINARY" --help

      # And answers as the binary an adopter downloads: with the viewer, rather
      # than the 503 that `serve` gives when nothing was embedded.
      #
      # `--retry-connrefused` rather than a sleep — the server is up when it
      # answers, which is a moment after the fork and not a fixed one.
      - name: The viewer is inside the binary
        run: |
          ./"$BINARY" serve --listen 127.0.0.1:8422 \
            --data-dir "$RUNNER_TEMP" &
          server=$!
          document=$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8422/)
          kill "$server"
          # An absent viewer is a 503, which `--fail` has already caught. This
          # is the rest of it: the document vite wrote names the hashed bundle
          # vite wrote beside it, and the fallback names nothing.
          case "$document" in
            */assets/*) ;;
            *)
              echo "::error::The binary served a document with no bundle in it."
              printf '%s\n' "$document"
              exit 1
              ;;
          esac

      # Static, so that one Linux binary runs on any distro — the whole point of
      # offering one — and so that stage 04's flake can fetch it without
      # patchelf. `ldd` exits non-zero on a binary it finds nothing to say about,
      # which is the answer we want, so its verdict is read rather than its
      # status.
      #
      # Both of its verdicts: rust's musl targets link x86_64 as a static PIE
      # and aarch64 as a plain static executable, and `ldd` calls the first
      # "statically linked" and the second "not a dynamic executable". Neither
      # names a library, which is the property being checked; a dynamic binary
      # is a list of them.
      - name: The Linux binaries are static
        if: runner.os == 'Linux'
        run: |
          report=$(ldd ./"$BINARY" 2>&1 || true)
          printf '%s\n' "$report"
          case "$report" in
            *"not a dynamic executable"* | *"statically linked"*) ;;
            *)
              echo "::error::$BINARY is dynamically linked."
              exit 1
              ;;
          esac

      # Under the name it will carry as a Release asset — `verkstead-linux-x64`
      # rather than a target triple, because that name is what the README's
      # install command will spell out. An artifact is a zip, so the executable
      # bit does not survive the trip; the binary was run above, where it still
      # had it, and whoever downloads one chmods it either way.
      #
      # `upload/` rather than the `assets/` next to it, which is vite's
      # `publicDir` and the repository's own.
      - name: Name the binary for the asset it will be
        run: |
          mkdir -p upload
          cp ./"$BINARY" "upload/${{ matrix.asset }}"

      - name: Upload the binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: upload/${{ matrix.asset }}
          if-no-files-found: error

  # The Linux desktop artifact: the tray app of ADR-0012 and everything it is
  # drawn over, in one file. A leg of its own rather than a fifth row in the
  # matrix above, because nothing about it is that matrix's shape — it is
  # dynamic where those are static, it wants the toolkit's development packages
  # where those want musl, and what it uploads is a bundle rather than a bare
  # binary. Stages 04 and 05 of the desktop roadmap add a leg each beside it.
  #
  # x86_64 only, per ADR-0012: an arm64 Linux user has the bare CLI.
  desktop-linux:
    name: Verkstead-x86_64.AppImage
    needs: viewer
    runs-on: ubuntu-24.04
    # **The floor this artifact runs on is decided here, and nowhere else.** A
    # bundle carries every library it links but not the C runtime — a process
    # holding two of those has two of everything the C library keeps — so what
    # the loader on a downloader's machine has to satisfy is the glibc of the
    # machine that compiled it. Built on the runner itself that would be 2.39,
    # which is above Ubuntu 22.04 and Debian 12 and so above much of what is
    # still in support; built here it is 22.04's own 2.35, and the step that
    # reads the symbols back is what holds it there.
    #
    # The assertions below then run on the floor rather than above it, which is
    # the better half of the bargain: an AppImage that comes up on the oldest
    # machine this leg claims comes up on the newer ones.
    #
    # The options are what lets it: an AppImage mounts itself through FUSE, and
    # a container is not allowed to mount anything unless it is handed the
    # device, the capability and a way past the host's own profile for
    # containers. Without them every assertion here would be about a file
    # nothing had run.
    container:
      image: ubuntu:22.04
      options: >-
        --device /dev/fuse
        --cap-add SYS_ADMIN
        --security-opt apparmor:unconfined
    env:
      # Where `tools/build-appimage.sh` leaves it, said once: every step below
      # either runs this file or asks something of it.
      APPIMAGE: target/appimage/Verkstead-x86_64.AppImage
    steps:
      # First, because a distribution image carries nothing and the steps below
      # are what a runner image would have made unnecessary: `curl` is how the
      # Rust action fetches rustup when a machine has none, `git` is how the
      # checkout checks out, and a C compiler is what cc-rs builds the C in the
      # dependency tree with — SQLite's own sources and `ring`'s, as on the CLI
      # legs. No `sudo` anywhere in this job: a container step is already root,
      # and the image has no such command.
      #
      # Then three groups of the leg's own. `libgtk-3-dev` and the appindicator
      # are what `crates/desktop` links and what `ci.yml` installs to build the
      # workspace at all — the toolkit, and the tray protocol over it.
      # `squashfs-tools` and `fuse3` are the bundling's: `mksquashfs` makes the
      # filesystem an AppImage is, and `fusermount3` is what the runtime mounts
      # it back with, which is what lets the assertions run the artifact itself
      # rather than something unpacked out of it.
      #
      # And `xvfb` and `dbus-x11`, which nothing builds or bundles with: a
      # runner has no screen and no session bus, and without both the app takes
      # its no-screen path and the bundled toolkit is never loaded at all — see
      # the assertion for what that would leave unchecked. `dbus-x11` is asked
      # for rather than `dbus-run-session`'s own package, because it depends on
      # it under a name that has moved between releases and this one has not.
      - name: Install what a distribution image has not got
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential \
            pkg-config libgtk-3-dev libayatana-appindicator3-dev \
            squashfs-tools fuse3 xvfb dbus-x11

      - uses: actions/checkout@v7.0.1

      # As the CLI legs do and for the same reason: the viewer is embedded at
      # compile time out of `web/dist`, which the checkout leaves empty. The
      # desktop app is the server in-process, so it carries the viewer too.
      - name: Fetch the viewer
        uses: actions/download-artifact@v8.0.1
        with:
          name: viewer
          path: web/dist

      # The same pin as everywhere else, and no `targets`: this leg builds for
      # the runner it is on. The toolkit is linked rather than compiled in, so
      # there is nothing here to cross-compile towards — which is why this is a
      # Linux runner and the artifact is the Linux one.
      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1

      # A cache key of its own, for the reason the matrix legs have theirs: this
      # is a fifth dependency tree — the host target, with the GUI crates in it
      # — and a key it shared with a musl leg would have the two evicting each
      # other.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: appimage

      # The script the dev shell runs, unchanged and unexplained here: how the
      # bundle is made, what is left to the machine it lands on and what rides
      # inside is all `tools/build-appimage.sh`'s to say. Including the check it
      # makes on itself — that every library the app or its bundle names is one
      # of the files it copied in — which is what keeps this leg from shipping
      # something that only runs on a machine with the development packages the
      # first step of this job installed.
      - name: Build the AppImage
        run: tools/build-appimage.sh

      # The claim the container above makes, checked rather than trusted. Every
      # versioned reference to glibc in the app and in each library the bundle
      # carries, and the highest of them is what a downloader's loader has to
      # satisfy; anything over the floor is a file that builds, runs here, and
      # refuses to start on the machines this leg was moved onto an older image
      # to reach — with `GLIBC_2.xx not found` and nothing friendlier, long
      # after a release.
      #
      # Said as a number here rather than read off the image, because it is the
      # promise the documentation makes to a downloader and not a fact about a
      # runner — see `docs/adoption.md`. Moving the image means moving both.
      - name: The AppImage asks for no glibc newer than 2.35
        env:
          FLOOR: "2.35"
        run: |
          asked=$(objdump -T target/appimage/AppDir/usr/bin/verkstead-desktop \
            target/appimage/AppDir/usr/lib/* 2> /dev/null |
            grep -o 'GLIBC_[0-9][0-9.]*' | sort -u -V | tail -1)
          asked=${asked#GLIBC_}
          echo "The highest glibc asked for is ${asked:-none}."
          # Nothing found is a check that did not run rather than a bundle that
          # asks for nothing: everything here is dynamically linked against the
          # C library, so some version is always named.
          if [ -z "$asked" ]; then
            echo "::error::Nothing in the bundle names a glibc version at all."
            exit 1
          fi
          # `sort -V` and read the last: over the floor is the only failure, and
          # a version scheme is not a number to compare with `-gt`.
          if [ "$(printf '%s\n%s\n' "$FLOOR" "$asked" | sort -V | tail -1)" != "$FLOOR" ]; then
            echo "::error::The AppImage asks for glibc $asked, above the $FLOOR this leg builds to."
            exit 1
          fi

      - name: The AppImage runs
        run: ./"$APPIMAGE" --help

      # The two halves of what a human downloads this file for, asserted on one
      # run of it: a tray icon, and the viewer behind it.
      #
      # **A screen, deliberately.** A runner has none, and a Verkstead started
      # without one reads that as a session with nowhere to put an icon, serves
      # anyway, and never starts the toolkit — see `crates/desktop/src/screen.rs`.
      # Which would leave every library the bundle carries for the tray's sake
      # unopened by this leg, the appindicator included: that one is loaded by
      # name at runtime, so it is absent from `ldd` and is copied in by hand by
      # `tools/build-appimage.sh`, and nothing but a run with a screen would ever
      # find out whether the copy was the right file. So Xvfb is started and
      # `$DISPLAY` points at it, and the app is run under a session bus of its
      # own, which is where an appindicator registers itself.
      #
      # `--no-open` stays: a screen is not a browser, and there is still nothing
      # here to hand a URL to.
      #
      # **The log is where the answer is.** Nothing about the tray is visible
      # from outside the process, so the app says so itself — one line on the way
      # up, and a warning on each of the ways it can end without an icon — and
      # `$XDG_STATE_HOME` is set so the file it says it in is somewhere this step
      # knows. See `crates/desktop/src/lib.rs`.
      #
      # `--retry-connrefused` rather than a sleep, as in the CLI legs: the app is
      # up when it answers.
      #
      # **Bounded**, which the headless run had no need to be: the failures this
      # app draws it has a screen for are drawn as dialogs, and a dialog waits
      # for somebody to dismiss it. Nobody is here, so a run that got that far
      # would hold the job until the runner's own six hours were up rather than
      # failing in front of whoever tagged.
      - name: The tray comes up, and the viewer is inside the AppImage
        timeout-minutes: 5
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/state
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          screen=$!
          export DISPLAY=:99
          # The socket is what says the display is up, and a toolkit started
          # before it is there is a toolkit that will not start. Spelled as an
          # `if` rather than a `&&`, which under `set -e` would end the step on
          # the first turn round the loop that found nothing.
          for _ in $(seq 50); do
            if [ -e /tmp/.X11-unix/X99 ]; then
              break
            fi
            sleep 0.2
          done

          log="$XDG_STATE_HOME/verkstead/verkstead.log"
          dbus-run-session -- ./"$APPIMAGE" --no-open --listen 127.0.0.1:8422 \
            --data-dir "$RUNNER_TEMP/desktop" &
          app=$!
          document=$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8422/)

          # The icon is raised on the main thread while the server comes up on
          # another, so the viewer answering is no promise that the tray has
          # finished either way yet. Waited for here rather than read after the
          # kill, where whichever won the race would be the answer.
          for _ in $(seq 50); do
            if grep -q "Verkstead is in the tray" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done

          kill "$app" "$screen"

          # As in the CLI legs: an absent viewer is a 503 that `--fail` has
          # already caught, and this is the rest of it — the document vite wrote
          # names the hashed bundle beside it, and the fallback names nothing.
          case "$document" in
            */assets/*) ;;
            *)
              echo "::error::The AppImage served a document with no bundle in it."
              printf '%s\n' "$document"
              exit 1
              ;;
          esac

          # And the tray, out of the app's own log. Read for the line rather than
          # against the warnings, so that a log which was never written — no log
          # directory, and the events on a standard error nobody kept — fails
          # here rather than passing for want of anything to find in it.
          if ! grep -q "Verkstead is in the tray" "$log" 2> /dev/null; then
            echo "::error::The AppImage did not raise a tray icon."
            cat "$log" 2> /dev/null || echo "There is no log at $log."
            exit 1
          fi
          cat "$log"

      # Under an artifact name that says which desktop this is rather than what
      # the file is called. `publish` fetches the CLI binaries by a
      # `verkstead-*` pattern and counts what arrives, so a desktop asset named
      # in that scheme — a Windows `.exe` would be — would be counted as a fifth
      # binary; keeping every desktop leg's artifact under `desktop-*` is what
      # holds the two sets apart whatever the files inside them are called.
      # `publish` is where the file's own name is written down.
      #
      # An artifact is a zip, so the executable bit does not survive the trip,
      # and a Release asset has no mode to carry it either. The file was run
      # above, where it still had one, and whoever downloads it chmods it — as
      # they do a bare binary.
      - name: Upload the AppImage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-linux
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error

  # The Release, once every leg has succeeded — the desktop ones as much as the
  # matrix. `needs` is the whole of that rule: a matrix job has failed if any of
  # its legs did, and a job whose `needs` failed does not run — so a tag that
  # could not be built for one architecture publishes nothing, rather than a set
  # that looks complete until somebody reaches for what is not in it.
  publish:
    name: Publish
    needs: [build, desktop-linux]
    # A pushed tag, or nothing at all. A run started by hand has built every
    # artifact and run every assertion by the time it reaches here, and stops:
    # there is nothing left to rehearse, and publishing is the one thing a
    # rehearsal must not do.
    #
    # The event rather than the ref, because the two are not the same question:
    # this workflow is pushed to by tags alone, so a `push` *is* a tag, while a
    # `workflow_dispatch` can be started against a tag as easily as a branch —
    # GitHub offers both in the same list — and a ref test would let that one
    # through as a release.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # The only job that writes. Creating a Release is a write to the
    # repository's contents, and it is granted here rather than at the top of
    # the file so that the build legs never hold a token that can publish.
    permissions:
      contents: write
    steps:
      # The four bare binaries, and neither the viewer artifact this run is
      # also holding nor the desktop ones: `pattern` is what leaves both
      # behind, and every desktop leg names its artifact `desktop-…` precisely
      # so that it cannot land here and be counted as a fifth binary.
      # `merge-multiple` unwraps the per-artifact directories, so what lands in
      # `binaries/` is four files under the names the legs gave them — which
      # are the names the assets carry, and the names the README's install
      # command will spell.
      - name: Fetch the CLI binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: verkstead-*
          merge-multiple: true
          path: binaries

      # What the pattern matched, counted before anything is published, and
      # counted through the same glob the upload below hands to `gh`. `needs`
      # says all four legs passed; this says all four arrived, which a
      # mistyped pattern would not.
      #
      # Four is this set's own number and stays four however many desktop
      # artifacts a release carries: those are the step below's, checked by
      # name, because a count is the wrong question to ask of them.
      - name: All four CLI binaries are here
        run: |
          ls -l binaries
          # So that a glob matching nothing counts as none, rather than as the
          # one unexpanded pattern bash would otherwise leave behind.
          shopt -s nullglob
          binaries=(binaries/verkstead-*)
          if [ "${#binaries[@]}" -ne 4 ]; then
            echo "::error::Expected four binaries, found ${#binaries[@]}."
            exit 1
          fi

      # Everything every desktop leg built, under the artifact-name prefix that
      # keeps it out of the count above. `merge-multiple` again, so `desktop/`
      # holds the files themselves under the names they will carry as assets.
      - name: Fetch the desktop artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop

      # Named rather than counted, which is the other half of the split above.
      # What can go wrong with a desktop artifact is its name — the name is
      # what an install line and the documentation spell out — and any count
      # would be satisfied by a leg that uploaded `verkstead-desktop.AppImage`.
      # So this is the one place the desktop asset names are written down, and
      # stages 04 and 05 add a line each to it and nothing else in this job.
      #
      # Read both ways round: every name here arrived, and nothing arrived that
      # is not named here. Without the second, a leg this job has never been
      # told about would be built, uploaded, and quietly left off the Release.
      - name: The desktop artifacts are the ones named here
        env:
          DESKTOP_ASSETS: |
            Verkstead-x86_64.AppImage
        run: |
          expected=$(printf '%s\n' "$DESKTOP_ASSETS" | sed '/^[[:space:]]*$/d' | sort)
          found=$(ls -1 desktop 2> /dev/null | sort)
          if [ "$expected" != "$found" ]; then
            echo "::error::The desktop assets are not what this job expects."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Found:"
            printf '%s\n' "$found"
            exit 1
          fi
          printf '%s\n' "$found"

      # `gh` rather than a release action: it is on the runner already and it
      # takes the workflow's own token, so there is no third-party version to
      # pin for what is one API call. It is given the repository by name
      # because this job has no checkout to infer one from — it wants the
      # artifacts, and none of the sources.
      #
      # A pre-release is semver's own rule, a hyphen after the version, as in
      # `v0.1.0-rc.1`. A throwaway tag rehearsing this workflow is one of
      # those: marking it keeps `releases/latest` on the newest real version,
      # and keeps a rehearsal from reading as the project's first release.
      #
      # Notes are generated rather than written. There is nobody to write them
      # at the moment a tag is pushed, and a release with an empty body is
      # worse than one listing what landed since the last tag.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) prerelease=(--prerelease) ;;
            *) prerelease=() ;;
          esac
          gh release create "$TAG" --generate-notes "${prerelease[@]}" \
            binaries/verkstead-* desktop/*

      # What GitHub says it now has, in the log of the run that put it there —
      # the asset names an adopter's url has to match, and whether the tag was
      # read as a pre-release. The `manifest` job below reads this same Release
      # back to hash it; this is the same answer, for a human.
      - name: What was published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" --json isPrerelease,assets

  # What the Release now holds of the bare binaries, written down where the
  # binary flake can read it. The flake fetches by url and verifies by hash, and
  # nothing about it is hand-edited, so this job is the only thing standing
  # between a release and a flake that still points at the version before it.
  #
  # The desktop artifacts are no part of it, and four stays the right number
  # here as more of them arrive: what the flake and the NixOS module run is the
  # headless daemon, and nothing fetches a desktop bundle through nix.
  #
  # It runs after `publish` rather than beside it because the assets it hashes
  # are the published ones — see the hashing step for why that distinction is
  # the point of the job.
  manifest:
    name: Manifest
    needs: publish
    # A pushed tag, said here as well as on `publish` rather than left to be
    # inferred. `needs` already skips this job in a run that published nothing;
    # this is the job that commits to `main`, and what stops it doing that is
    # worth reading here rather than a job away. See `publish` for why the
    # question is about the event.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # The second and last job that writes: the manifest is a commit on `main`.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      # Where the four assets now live. Built once here because both the step
      # that hashes them and the manifest it writes need the same urls, and a
      # url the manifest only resembles is a url nobody checked.
      DOWNLOAD_BASE: >-
        ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      # `main`, not the tag: the commit goes on top of whatever `main` has
      # reached by now. What the tag's own tree held is beside the point — the
      # manifest describes the Release, and the Release is already built.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      # Keyed by nix system name rather than by asset name, because a nix system
      # name is what the consumer already has in hand — the flake asks for
      # `x86_64-linux`, not for `verkstead-linux-x64`.
      #
      # Hashes are SRI, which is what `fetchurl` takes verbatim, so there is no
      # conversion step at the point of use. `sha256sum` speaks hex and SRI is
      # base64 of the same digest, which is the whole of what the `basenc` pair
      # is doing: decode the hex, re-encode as base64.
      #
      # Downloaded rather than read off the `publish` job's artifacts, so what
      # the manifest promises is what an adopter actually receives. A hash taken
      # from the build output would still be a true hash of a file we built; it
      # would just have never been compared against the one GitHub serves.
      - name: Build the manifest
        run: |
          mkdir -p downloads
          systems='{}'
          for pair in \
            x86_64-linux:verkstead-linux-x64 \
            aarch64-linux:verkstead-linux-arm64 \
            x86_64-darwin:verkstead-macos-x64 \
            aarch64-darwin:verkstead-macos-arm64
          do
            system=${pair%%:*}
            asset=${pair#*:}
            url="$DOWNLOAD_BASE/$asset"
            curl --fail --location --silent --show-error \
              --output "downloads/$asset" "$url"
            digest=$(sha256sum "downloads/$asset" | cut -d' ' -f1 |
              tr 'a-f' 'A-F' | basenc --base16 --decode | basenc --base64)
            systems=$(printf '%s' "$systems" | jq \
              --arg system "$system" --arg url "$url" \
              --arg hash "sha256-$digest" \
              '.[$system] = {url: $url, hash: $hash}')
          done
          # The tag without its leading `v`, which is how Cargo.toml and the
          # flake both spell a version.
          jq -n --arg version "${TAG#v}" --argjson systems "$systems" \
            '{version: $version, systems: $systems}' > nix/release.json
          cat nix/release.json

      # The same claim again, but read only through the file — every url and
      # every hash comes back out of the manifest rather than out of the loop
      # that wrote it. That is what makes this more than a repeat: a step that
      # paired a hash with the wrong system would have agreed with itself above,
      # and disagrees here, because the download is now driven by the url the
      # manifest actually recorded for that system.
      - name: The manifest matches what was published
        run: |
          if [ "$(jq -r .version nix/release.json)" != "${TAG#v}" ]; then
            echo "::error::The manifest does not name $TAG."
            exit 1
          fi
          if [ "$(jq -r '.systems | length' nix/release.json)" -ne 4 ]; then
            echo "::error::The manifest does not carry all four nix systems."
            exit 1
          fi
          mkdir -p verify
          drift=0
          # Fed by process substitution rather than a pipe, so the loop runs in
          # this shell and `drift` survives it.
          while read -r system url hash; do
            curl --fail --location --silent --show-error \
              --output verify/asset "$url"
            digest=$(sha256sum verify/asset | cut -d' ' -f1 |
              tr 'a-f' 'A-F' | basenc --base16 --decode | basenc --base64)
            if [ "sha256-$digest" != "$hash" ]; then
              echo "::error::$system: the manifest says $hash, but $url is sha256-$digest."
              drift=1
            else
              echo "$system $hash"
            fi
          done < <(jq -r '.systems | to_entries[] |
            "\(.key) \(.value.url) \(.value.hash)"' nix/release.json)
          exit "$drift"

      # Straight onto `main`, with no pull request — the exception this project
      # makes to its own review process, and `docs/agents/git-workflow.md`
      # records why: a manifest that needs a merge per release is a manifest
      # that goes stale the first time somebody is busy.
      #
      # The author is the bot, not whoever pushed the tag. That address is
      # GitHub's own for `github-actions[bot]`, so the commit is attributed to
      # the app in the UI rather than to a person who never wrote it.
      #
      # Nothing re-triggers: a push made with the workflow's own `GITHUB_TOKEN`
      # does not start a workflow run, so this neither re-enters CI nor loops
      # back into this workflow. Nothing here pushes a tag besides, which is the
      # only push `release.yml` listens for.
      #
      # A rejected push means `main` moved between the checkout and here, which
      # fails the run loudly; re-running the job checks out the new `main` and
      # writes the same manifest onto it.
      - name: Commit the manifest to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/release.json
          # A re-run of a release that already landed its manifest has nothing
          # to say, and an empty commit would say it anyway.
          if git diff --cached --quiet; then
            echo "The manifest already describes $TAG; nothing to commit."
            exit 0
          fi
          git commit -m "chore: release manifest for $TAG"
          git push origin HEAD:main
