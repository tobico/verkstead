# The project's checks, run on GitHub so that what lands on `main` has passed
# them. Everything here is pinned — the actions to a released version, the
# runner to an image rather than `ubuntu-latest`, and Rust to a patch version —
# because a check that quietly moves under us is a check nobody is reading.
name: CI

# Pull requests and pushes to `main`, which between them cover every commit
# once. A branch with an open PR would run twice if pushes to it triggered as
# well, and a branch without one has nothing to guard yet.
#
# And `release.yml`, which calls this workflow as its first job rather than
# asking GitHub whether these checks happened to have passed already. A release
# is started by hand at a moment nobody chose for its CI history, so the run
# that ships is the run that tests: red here and the release stops having
# written nothing. Calling it keeps one statement of what the checks are — a
# second copy in `release.yml` would be a copy that drifts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Nothing here writes anything back; the default token would otherwise carry
# write access to the repository's contents.
permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The version branch _is_ the pin: `@1.95.0` installs exactly that
      # toolchain, where `@stable` would move whenever Rust released. 1.95.0 is
      # what the flake's nixpkgs (nixos-26.05) carries, so CI and the dev shell
      # compile with the same rustc.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2

      # The sandbox suite runs a real `bwrap` rather than a stand-in — what it
      # checks is which paths come in writable, read-only and absent, and there
      # is no way to ask that of anything but the tool itself. The runner image
      # does not carry it.
      #
      # Present is not enough: Ubuntu 24.04 denies unprivileged user namespaces
      # through AppArmor, which is exactly what the sandbox's `--unshare-all`
      # asks for, and an installed bwrap fails at `setting up uid map` without
      # the restriction lifted. The runner is a throwaway VM whose only job is
      # this suite, so the sysctl goes off rather than a profile being written
      # for one binary.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # For the dev-shell autodetection alone: it decides whether to wrap a
      # session's command in `nix develop` by evaluating a flake attribute, so
      # the test covering it needs a `nix` that answers. Pinned to the version
      # `nix.yml` already uses. Nothing is fetched — the flake that test writes
      # declares no inputs.
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0

      # The same surface `Sandbox::command` builds, running the same `/bin/sh`
      # the probe runs. A runner image that stops satisfying the sandbox fails
      # here, in a line naming what is missing, rather than as nine test
      # failures whose message is about the tool rather than the code.
      - name: The sandbox surface works on this runner
        run: |
          bwrap --unshare-all --share-net \
            --ro-bind /nix /nix --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 --ro-bind /etc /etc \
            --proc /proc --dev /dev --tmpfs /tmp \
            /bin/sh -c 'echo "the sandbox surface holds"'

      # Formatting and lints first: both are cheap and both fail on the kind of
      # thing that is quicker to read than a test failure.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The viewer is not built first. `web/dist` is gitignored and the embed
      # that reads it is `allow_missing`, so the crates compile without it —
      # what the viewer's own suite covers is the viewer job's business.
      - name: Test
        run: cargo test --workspace
        env:
          # Twice the suite's own clock for `crates/server/tests/sessions.rs`,
          # which stands real servers up and runs real sessions in real
          # sandboxes and judges them on wall clock. This runner has two cores
          # and is building the workspace alongside the run, so a session gets
          # descheduled past a budget it would have met on a developer's
          # machine — and what comes out is a different test failing every time,
          # none of them about the code. See `VERKSTEAD_TEST_PACE` there for why
          # one factor over the whole file rather than a longer budget here and
          # there.
          VERKSTEAD_TEST_PACE: "2"

      # `cargo test` writes `web/src/api/types.ts` through ts-rs — see
      # `.cargo/config.toml`. So a working tree that is no longer clean after
      # the run above means the committed wire types have drifted from the Rust
      # ones they are generated from, and the viewer is compiling against a
      # shape the server no longer sends.
      - name: Generated TypeScript is up to date
        run: |
          drift=$(git status --porcelain)
          if [ -n "$drift" ]; then
            echo "::error::Generated files drifted from the Rust types. Run 'cargo test' locally and commit the result."
            echo "Changed by the test run:"
            echo "$drift"
            git diff
            exit 1
          fi

  # The package stores, proved by really installing something inside a Sandbox
  # — `crates/server/tests/package_stores.rs`, which is where the reasoning is.
  #
  # A job of its own rather than more steps in `Rust`, for two reasons. The
  # tools are this suite's alone and installing them would slow every other
  # check down; and this is the one job whose business is *having* them, which
  # is what `VERKSTEAD_TEST_STORES` below says — with it set, a proof skipped
  # for want of its tool fails rather than printing a line nobody reads. The
  # `Rust` job runs the same suite as part of the workspace and skips whatever
  # this runner image has not got, which is the developer's experience and the
  # right one there.
  #
  # It runs beside the other jobs rather than after them, so what it costs the
  # workflow is its own wall clock and not a minute of anybody else's.
  #
  # **And what that comes to.** Measured over the four green runs on `main`
  # before this job existed, 2026-09-24 to 2026-09-29: the workflow took 16m31s,
  # 16m49s, 18m57s and 21m50s end to end, and what set every one of those was a
  # Windows leg — 869 s to 1307 s, against `Rust`'s steady 855–896 s. So the
  # figure to watch is not this job's own minutes but whether they pass the
  # Windows legs, and a job that builds one crate's test target and runs a
  # handful of small installs does not come close. The measurement after it
  # landed is in this branch's pull request.
  #
  # Node's six tools add one tarball, two archives and two `npm install -g`
  # runs to the setup below, and six installs of one package to the suite.
  # Python's four add one archive and one `pip install` — the runner's own
  # interpreter carries pip already — and a proof apiece. Only C/C++'s proof
  # builds a project, and that one is two source files, so what each ecosystem
  # costs this job is its toolchain's download rather than its proofs.
  #
  # **And .NET costs this job no download at all**: the
  # runner image carries a .NET SDK under `/usr/lib/dotnet`, which is inside
  # `/usr` and so inside every bind a session gets. So there is no install step
  # for it below — only the same line in the tool check every other tool has,
  # which is what would catch the image moving or dropping it.
  #
  # The JVM adds a tarball and an archive — Maven and Gradle, the JDK being
  # the image's own — and its proofs are real builds, which is the first place
  # in this job where a proof costs more than its download: a JVM starts
  # slowly, and a Gradle build in a session starts one per invocation.
  package-stores:
    name: Package stores
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The same pin as every other job, for the same reason.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      # A key of its own: this job builds one test target of one crate, and a
      # cache shared with the `Rust` job would have the two evicting each
      # other.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: package-stores

      # The same bubblewrap the `Rust` job installs, and for the same reason —
      # see the comment there for why the sysctl goes off as well. Every proof
      # here runs its install *inside* a sandbox, so without this there is
      # nothing to install into.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # **Go, unpacked where a session can reach it.** Not
      # `actions/setup-go`, and not the runner image's tool cache it installs
      # from: a session's sandbox is opened onto `/nix`, `/usr`, `/bin`,
      # `/lib`, `/lib64`, `/etc` and `/run/current-system` and nothing else —
      # `LINUX_SYSTEM` in `crates/server/src/sandbox.rs` — so a `go` under
      # `/opt/hostedtoolcache` is a `go` no proof here can run. Every one of
      # them would skip, on the one job where a skip is a failure.
      #
      # The whole tree under `/usr/local` rather than a link to one: `go`
      # resolves its own `GOROOT` from where its binary really is, so a
      # symlink from inside a bind into the tool cache lands back outside it.
      #
      # Pinned to a release, like every other tool this file installs.
      - name: Install Go 1.26.8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/go.tar.gz" https://go.dev/dl/go1.26.8.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf "$RUNNER_TEMP/go.tar.gz"
          echo /usr/local/go/bin >> "$GITHUB_PATH"

      # **And the JavaScript ecosystem's six, every one of them reachable by a
      # name on `/usr/local/bin`.** Not the runner image's own Node, which is
      # whatever the image pins, and not `actions/setup-node`, for the reason
      # Go is not `actions/setup-go`: the tool cache is outside every bind a
      # session gets.
      #
      # `/usr/local/bin` rather than a directory of this job's own, because
      # npm, pnpm and Yarn Classic are all `#!/usr/bin/env node` scripts —
      # `node` being findable on the *session's* `PATH` is what makes them
      # runnable inside a sandbox at all, and that `PATH`'s floor holds
      # `/usr/local/bin` and nothing this job could invent. See `LINUX_PATH` in
      # `crates/server/src/sandbox.rs`.
      #
      # The same releases the dev shell's nixpkgs carries, so that a proof that
      # passes here is a proof of the versions a developer ran it against.
      - name: Install Node 24.21.0, pnpm and both yarns
        run: |
          curl -sSfL -o "$RUNNER_TEMP/node.tar.xz" \
            https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
          sudo mkdir -p /usr/local/node
          sudo tar -C /usr/local/node --strip-components=1 -xJf "$RUNNER_TEMP/node.tar.xz"

          for tool in node npm npx; do
            sudo ln -sf "/usr/local/node/bin/$tool" "/usr/local/bin/$tool"
          done

          sudo /usr/local/node/bin/npm install -g --prefix /usr/local/node \
            pnpm@11.27.0 yarn@1.22.22
          sudo ln -sf /usr/local/node/bin/pnpm /usr/local/bin/pnpm
          sudo ln -sf /usr/local/node/bin/yarn /usr/local/bin/yarn

          # **Berry in a prefix of its own**, because the two yarns are two
          # different tools and both packages install a program called `yarn`.
          # Classic reads `YARN_CACHE_FOLDER` and Berry reads
          # `YARN_GLOBAL_FOLDER`, so a runner carrying one of them is a runner
          # where half of that is never proved — the name here is the one
          # `tests/package_stores.rs` looks for and the one the dev shell links
          # it in under.
          sudo /usr/local/node/bin/npm install -g --prefix /usr/local/yarn-berry \
            @yarnpkg/cli-dist@4.14.1
          sudo ln -sf /usr/local/yarn-berry/bin/yarn /usr/local/bin/yarn-berry

      # **deno and bun, which are the other two of Node's six.** Neither is on
      # the runner image, and neither needs the Node above: each ships one
      # binary that is its own runtime, so a copy into `/usr/local/bin` is the
      # whole of an installation.
      #
      # From each project's own release rather than a package manager, for the
      # reason Go is: what a session may reach is `/nix`, `/usr`, `/bin`,
      # `/lib`, `/lib64`, `/etc` and `/run/current-system`, and `snap` or the
      # tool cache is outside all of it.
      #
      # The same releases the dev shell's nixpkgs carries, so that a proof that
      # passes here is a proof of the versions a developer ran it against.
      - name: Install deno 2.8.3 and bun 1.3.13
        run: |
          curl -sSfL -o "$RUNNER_TEMP/deno.zip" \
            https://github.com/denoland/deno/releases/download/v2.8.3/deno-x86_64-unknown-linux-gnu.zip
          sudo unzip -q -o "$RUNNER_TEMP/deno.zip" -d /usr/local/bin
          sudo chmod 0755 /usr/local/bin/deno

          curl -sSfL -o "$RUNNER_TEMP/bun.zip" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.3.13/bun-linux-x64.zip
          unzip -q -o "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          sudo install -m 0755 "$RUNNER_TEMP/bun/bun-linux-x64/bun" /usr/local/bin/bun

      # **uv, the first of the three Python tools this runner has not got.** The
      # image carries a `python3` under `/usr/bin` with pip in it, which is what
      # the pip proof runs (`python3 -m pip`, pip being a module of its
      # interpreter rather than a program of its own) — so nothing here installs
      # a Python, and poetry and pipenv below are installed *with* that one.
      # uv is one binary from its project's own release, into `/usr/local/bin`
      # for the reason deno and bun are: the tool cache is outside every bind a
      # session gets.
      #
      # The same release the dev shell's nixpkgs carries, so that a proof that
      # passes here is a proof of the version a developer ran it against.
      - name: Install uv 0.11.21
        run: |
          curl -sSfL -o "$RUNNER_TEMP/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.11.21/uv-x86_64-unknown-linux-gnu.tar.gz
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/uv.tar.gz"
          sudo install -m 0755 "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu/uv" /usr/local/bin/uv

      # **poetry and pipenv, which are the Python ecosystem's other two.**
      # Neither is on the runner image, and neither is a single binary: both are
      # Python programs, so what installs them is the interpreter that is going
      # to run them — `python3 -m pip` into the system, which writes their
      # console scripts to `/usr/local/bin` and their modules beside the
      # runner's own. Inside every bind a session gets, for the reason Go and
      # the JavaScript six are: the tool cache is outside all of it.
      #
      # `--break-system-packages` because the runner's Python is externally
      # managed (PEP 668) and this is a throwaway machine whose whole job is to
      # have these installed — the same check pip's own proof turns off with
      # `--target`.
      #
      # **And `--ignore-installed`, which is a second thing entirely.** That
      # flag lets pip *write* into the system interpreter; it does not let pip
      # take anything out of it, and a dpkg-installed distribution has no
      # `RECORD` for pip to uninstall by. poetry's `dulwich` wants
      # `urllib3>=2.2.2` and this image carries Debian's 2.0.7, so without this
      # the step dies on `Cannot uninstall urllib3 2.0.7, RECORD file not
      # found` and every proof below it is skipped. Nothing is upgraded in
      # place: what pip installs lands beside what the distribution owns, which
      # on a runner is the right way round and on anything else would not be.
      #
      # The same releases the dev shell's nixpkgs carries, so that a proof that
      # passes here is a proof of the versions a developer ran it against.
      - name: Install poetry 2.4.1 and pipenv 2026.5.1
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed \
            poetry==2.4.1 pipenv==2026.5.1

      # **And C/C++, whose proof is a build rather than an install**: a CMake
      # project configured with Ninja and built twice in a session's Sandbox,
      # every compile going through the Compile Server — so that one needs the
      # sccache the server runs as well as the two build tools. The C and C++
      # compilers are the runner image's own, under `/usr/bin`.
      #
      # CMake and Ninja from the distribution, into `/usr/bin`, which is inside
      # every bind a session gets. sccache from its project's own release into
      # `/usr/local/bin`, for the reason deno and bun are: the distribution's is
      # several releases behind the one the dev shell's nixpkgs carries, and
      # this is the release a developer ran the proof against.
      - name: Install CMake, Ninja and sccache 0.15.0
        run: |
          sudo apt-get install -y cmake ninja-build

          curl -sSfL -o "$RUNNER_TEMP/sccache.tar.gz" \
            https://github.com/mozilla/sccache/releases/download/v0.15.0/sccache-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/sccache.tar.gz"
          sudo install -m 0755 "$RUNNER_TEMP/sccache-v0.15.0-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache

      # **And the JVM's: a JDK, Maven and Gradle.** The runner image carries all
      # three, and all three are the wrong ones to prove with as they stand.
      #
      # Its JDKs are Temurin's, under `/usr/lib/jvm` — inside a bind — but the
      # `java` on its `PATH` is 17 by way of `/etc/alternatives`, and the
      # `JAVA_HOME` it exports is one no Sandbox is handed. So 21, the major the
      # dev shell's nixpkgs carries, is linked onto `/usr/local/bin`, which a
      # session's `PATH` puts ahead of `/usr/bin`: that `java` is the one Maven
      # and Gradle below start on when nothing names another. Its `javac`
      # beside it, which the Maven proofs compile their plugin with.
      #
      # Its Maven and Gradle are whatever releases it pins. These are the ones
      # the dev shell's nixpkgs carries, from each project's own distribution,
      # unpacked whole under `/usr/local` and linked onto `/usr/local/bin` —
      # both launchers follow their own link back to find their home, so the
      # link is enough and the home stays inside the bind. Maven's comes off
      # Maven Central, which carries the same distribution as the Apache
      # archive: the archive is throttled, and took two minutes for it here.
      - name: Install JDK 21, Maven 3.9.12 and Gradle 8.14.4
        run: |
          sudo ln -sf /usr/lib/jvm/temurin-21-jdk-amd64/bin/java /usr/local/bin/java
          sudo ln -sf /usr/lib/jvm/temurin-21-jdk-amd64/bin/javac /usr/local/bin/javac

          curl -sSfL -o "$RUNNER_TEMP/maven.tar.gz" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.12/apache-maven-3.9.12-bin.tar.gz
          sudo mkdir -p /usr/local/maven
          sudo tar -C /usr/local/maven --strip-components=1 -xzf "$RUNNER_TEMP/maven.tar.gz"
          sudo ln -sf /usr/local/maven/bin/mvn /usr/local/bin/mvn

          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.14.4-bin.zip
          sudo unzip -q -o "$RUNNER_TEMP/gradle.zip" -d /usr/local
          sudo ln -sf /usr/local/gradle-8.14.4/bin/gradle /usr/local/bin/gradle

          java -version

      # **And Rust's own, which is the one toolchain this runner already has and
      # cannot use.** The proofs of Rust's cargo half and of its Compile Server
      # run `cargo` and `rustc` inside a session's Sandbox, and what the step at
      # the top of this job installed is rustup's, under `~/.cargo` and
      # `~/.rustup` — outside every bind a session gets, and a proxy besides. So
      # the toolchain it installed is copied whole under `/usr/local`: the same
      # 1.95.0 every other job pins, its binaries finding their libraries
      # relative to where they really are, which stays inside the bind.
      #
      # Linked onto `/usr/local/bin`, which a session's `PATH` holds, so the
      # `cargo` inside one finds this `rustc` beside it. And its directory put
      # ahead of `~/.cargo/bin` on this job's own `PATH`, because the proofs ask
      # the `PATH` they are run with which `cargo` there is — and it is the same
      # release, so the build that runs them is no different for it.
      - name: Install Rust 1.95.0 where a session can reach it
        run: |
          sudo cp -a "$(rustc --print sysroot)" /usr/local/rust

          for tool in cargo rustc; do
            sudo ln -sf "/usr/local/rust/bin/$tool" "/usr/local/bin/$tool"
          done

          echo /usr/local/rust/bin >> "$GITHUB_PATH"

          /usr/local/rust/bin/cargo --version

      # And the same question asked of every tool on the list, in a line naming
      # the one that fails it rather than as a test failure about a shell that
      # could not find a program — the reason the sandbox-surface step in the
      # `Rust` job is written the way it is.
      #
      # Both halves: installed at all, and installed somewhere a session is
      # opened onto. The second is the one that catches a runner image moving a
      # tool, which is how this job would go quietly green while proving
      # nothing.
      - name: Every tool a proof installs with is inside the sandbox's binds
        run: |
          status=0

          for tool in go zip node npm pnpm yarn yarn-berry deno bun python3 uv poetry pipenv dotnet tar sha1sum sccache cmake ninja cc c++ java javac mvn gradle cargo rustc; do
            found=$(command -v "$tool" || true)

            if [ -z "$found" ]; then
              echo "::error::this runner has no $tool, which a package-store proof installs with"
              status=1
              continue
            fi

            real=$(readlink -f "$found")

            case "$real" in
              /nix/*|/usr/*|/bin/*|/lib/*|/lib64/*|/etc/*|/run/current-system/*)
                echo "$tool: $real"
                ;;
              *)
                echo "::error::$tool is at $real, which no session's sandbox binds — see LINUX_SYSTEM in crates/server/src/sandbox.rs"
                status=1
                ;;
            esac
          done

          # And pip, which is the one tool on the list that is not a program:
          # the pip proof runs `python3 -m pip`, so what has to be there is the
          # module inside the interpreter above rather than a name on the PATH.
          if ! python3 -m pip --version; then
            echo "::error::this runner's python3 has no pip module, which the pip package-store proof installs with"
            status=1
          fi

          exit $status

      # `--nocapture` so that a proof's own account of itself is in the log:
      # what an install printed is the whole of what explains a failure, and a
      # captured one is a line about an exit status.
      - name: The proofs
        run: cargo test -p verkstead-server --test package_stores -- --nocapture
        env:
          # What makes a skipped proof a failure here. Any value does; this one
          # says what it is for.
          VERKSTEAD_TEST_STORES: required

  # What the same sandbox comes to on a Mac, asked of a Mac. What a session may
  # reach is one description said once, and `sandbox-exec` is the second
  # rendering of it — so what settles whether that rendering holds is a probe
  # inside a real sandbox on a real Apple machine, exactly as the Linux suite
  # settles bubblewrap's. Nothing but a Mac can answer it, which is what this
  # job is for.
  #
  # Two targets rather than the workspace: everything else in it stands on
  # bubblewrap and a Linux kernel, and a Mac has neither. The rest of what this
  # stage's code says — the policy a description renders to, read as text — is
  # unit-tested in the Rust job above, which is where a mistake in it shows up
  # in seconds rather than on a runner that has to be waited for.
  macos-sandbox:
    name: macOS sandbox
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      # The same pin as every other job, for the same reason.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      # A key of its own: this is an Apple dependency tree, and one shared with
      # the Linux job would have the two evicting each other.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: macos-sandbox

      # No `web/dist` is fetched and none is needed: the embed is
      # `allow_missing`, so the server compiles without the viewer — and what
      # this suite probes is a filesystem boundary rather than anything served.
      - name: The boundary suite
        run: cargo test -p verkstead-server --test sandbox_macos

      # And the onboarding module's own unit tests, which is where the wizard's
      # two questions for a real Mac are: whether `hw.optional.arm64` is a
      # thing `sysctl` answers, and whether `-p` is an argument `xcode-select`
      # takes. Both are `#[cfg_attr(not(target_os = "macos"), ignore)]`, so the
      # Rust job above skips them and this is the only runner that can say
      # anything about either.
      #
      # They are unit tests rather than a suite of their own, which is why this
      # is a second step and not another `--test`: `--lib` with the module's
      # own prefix runs them and the stated-machine tests around them, and no
      # other part of a library whose Linux half wants a kernel this runner has
      # not got. A stub that agreed with a wrong argument vector would pass
      # every one of those stated tests and then hold the wizard on a Mac whose
      # command line tools are installed, which is the whole of what these two
      # are for.
      #
      # Quoted because the filter ends in a colon, and YAML reads a trailing
      # one as the start of a mapping: unquoted, the file stops parsing and
      # every job in it — not just this step — never runs at all.
      - name: What the wizard asks a real Mac
        run: 'cargo test -p verkstead-server --lib onboarding::'

      # And what a terminal is listening on, read the Mac's way: `ps` for the
      # leader's tree and group, `lsof` for their listeners. The test starts a
      # real listener below a real shell and reads it, then ends it and reads
      # it gone — which only a real `ps` and `lsof` can answer, so this is the
      # one runner that proves the Mac's reader. Quoted for the same colon.
      - name: A terminal's ports, read on a real Mac
        run: 'cargo test -p verkstead-server --lib terminals::ports::'

  # And what the same workspace comes to on Windows, asked of Windows. The
  # session machinery is compiled there like everything else — what a Windows
  # build has not got is the pseudo-terminal under it, and four leaf call sites
  # around that — so what settles whether the port holds is the compiler and the
  # suite on a real Windows machine.
  #
  # `cargo check --target` from Linux is not that: MSVC needs a Windows host to
  # link against, and a check that never links proves less than it looks like it
  # does. This job is the Windows machine this project has, and it is what will
  # say the port goes on holding.
  #
  # **Two legs, each running half the suite**, because one was not enough to
  # come near the `Rust` job's ten minutes or so. Measured on the pull request
  # that brought nextest in: the job was 39–43 minutes before it, and with
  # nextest it had passed 17 minutes (a 4½-minute build, then 11½ minutes of
  # tests) with a quarter of the suite still to run. Those tests were using all
  # four of the runner's cores the whole time, so there was nothing left to gain
  # on one machine. A second leg costs a second cached build, and the repository
  # is public, so the runner itself is free.
  #
  # `slice` partitioning deals the tests out one at a time across every binary,
  # so each leg gets half of each suite rather than whole binaries, and
  # `crates/server/tests/conversations.rs`, a third of the test time on its
  # own, is split between them. What `.config/nextest.toml` holds serial is
  # serial per leg, which is all it needs to be: each leg is a machine of its
  # own, with a session account of its own.
  windows:
    name: Windows (${{ matrix.partition }}/2)
    runs-on: windows-2025
    strategy:
      # A red leg does not cancel its sibling: what the other half of the suite
      # says is worth having from the same run.
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      # Before the checkout, because it is the checkout this is about. Git for
      # Windows converts line endings on the way out of the repository by
      # default, and half of what this suite asserts is text: a fixture, a
      # rendered document, a skill written out byte for byte. A file that
      # arrived with carriage returns nobody committed is a test failing about
      # the runner rather than about the code.
      - name: Check the repository out as it was committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7.0.1

      # The same pin as every other job, for the same reason. MSVC and the
      # Windows SDK are the runner image's own — SQLite and ring are C, and this
      # is the host that can compile them for this target.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      # A key of its own, as the macOS job has: this is a third dependency tree,
      # and one shared with either of the others would have them evicting each
      # other. The two legs share it, because they build the same tree.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows

      # The one thing the sessions suite needs that the runner image has not
      # got, and it is here to prove a *negative*: no session on this platform
      # compiles through an sccache yet — see the server's
      # `build_cache::compiles_through_an_sccache`, which is where that switch is
      # and where what is left to do about it is said. A runner with no sccache
      # would start no Compile Server for want of a binary and would prove
      # nothing — so the two tests about it in
      # `crates/server/tests/sessions_windows.rs` insist on one being installed
      # and say so by failing rather than by quietly passing.

      #
      # Pinned to a release like everything else here, unpacked, and put on the
      # `PATH`: that variable is what *installed* means on this platform, both
      # for this and for the `pwsh` a Conversation Terminal opens on. Nothing
      # here compiles through it — `RUSTC_WRAPPER` is unset, so the build and
      # the test run below are as cold as they were.
      - name: Install sccache
        shell: pwsh
        run: |
          $version = 'v0.12.0'
          $release = "sccache-$version-x86_64-pc-windows-msvc"
          $archive = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          $into = Join-Path $env:RUNNER_TEMP 'sccache'

          Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/$version/$release.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $into

          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $into $release)

      # No `web/dist` here either — the embed is `allow_missing`, so the crates
      # compile without the viewer.
      - name: Build
        run: cargo build --workspace --all-targets

      # **The session account, which no suite here can make for itself.** A
      # Windows session runs as a local account of Verkstead's own (ADR-0014,
      # amended), and creating one is an administrator's call — so every suite
      # that starts a session asks for the account this machine's Data Directory
      # already has, and fails with the line that names this verb where there is
      # none. That is `sessions_windows.rs`, the two boundary suites,
      # `account_windows.rs`, `launcher_windows.rs` and the granting tests
      # inside the server crate. A runner is elevated, so this is the one place
      # the verb can be run for them.

      #
      # The binary the step above built rather than a `cargo run`, so that
      # nothing is compiled twice — and against no `--data-dir`, because the
      # default is the one the suites resolve.
      - name: Create the session account
        run: target/debug/verkstead.exe session-account create

      # **The suite runs through nextest rather than `cargo test`.** `cargo test`
      # runs the workspace's test binaries one after another, so the step took
      # as long as every suite added together. nextest runs tests out of all of
      # them at once. What must not run at once — the suites that start
      # processes as the session account, and the registry tests — is held
      # serial by `.config/nextest.toml`, which says why.
      #
      # Pinned to a release, unpacked and put on the `PATH`, the way sccache is
      # above.
      - name: Install cargo-nextest
        shell: pwsh
        run: |
          $version = '0.9.144'
          $release = "cargo-nextest-$version"
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-nextest.zip'
          $into = Join-Path $env:RUNNER_TEMP 'cargo-nextest'

          Invoke-WebRequest -Uri "https://github.com/nextest-rs/nextest/releases/download/$release/$release-x86_64-pc-windows-msvc.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $into

          Add-Content -Path $env:GITHUB_PATH -Value $into

      # What is left out of the run is left out of the build above: a suite that
      # stands on a mount namespace or on Apple's sandbox is `cfg`-gated at its
      # own file, so this is the whole of what a Windows Verkstead has to say
      # for itself.
      #
      # **And a session end to end is in it**, which is this machine's alone to
      # answer: `crates/server/tests/sessions_windows.rs` runs a real grilling
      # on a real pseudoconsole with a PowerShell stand-in where the agent goes,
      # and `tests/sessions.rs` stays the Unix arm of the same questions.
      #
      # **And the boundary suite is in it**, which is what this job is to
      # Windows that the `macOS sandbox` job above is to a Mac:
      # `crates/server/tests/sandbox_windows.rs` has the description's entries
      # written on real directories for the session account, and runs a probe as
      # that account which attempts each access and says what the machine said.
      # It runs here rather than in a step of its own because this job already
      # runs the whole workspace — a Windows build has no suite that has to be
      # left out the way a Mac's does.

      # **To the end, whatever fails on the way.** nextest stops at its first
      # failure by default and leaves the rest of the leg unrun, which is a red
      # check saying nothing about the tests it cancelled — the same reason the
      # matrix above lets a red leg's sibling finish.
      - name: Test
        run: >
          cargo nextest run --workspace
          --partition slice:${{ matrix.partition }}/2 --no-fail-fast

      # **And the doc-tests, which nextest does not run.** The workspace has
      # none today, so this step costs little. It is here so that the first one
      # somebody writes runs on this machine too, rather than being skipped
      # without a word — the Linux job's `cargo test` runs them already. On the
      # first leg alone: they are not partitioned, so both would run all of them.
      - name: Doc-tests
        if: matrix.partition == 1
        run: cargo test --doc --workspace

  # The viewer's own checks, on the viewer's own sources. Nothing here waits on
  # the Rust job and nothing there waits on this one: neither produces anything
  # the other reads, so they run side by side.
  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    # Every step below is the viewer's, and `web/` is where its `package.json`
    # lives. Said once here rather than on each step.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1

      # pnpm, Node and the `--frozen-lockfile` install, shared with the release
      # workflow — see the action for what each pin is and why. A local `uses:`
      # path resolves against the checkout above, so it has to follow it.
      - name: Set up the viewer
        uses: ./.github/actions/setup-pnpm-project

      # One rule, and it is the wall around the query hook: every query in the
      # viewer goes through `useReading`, which makes it name a reconcile key
      # or declare its payload static (ADR-0009). First because it is the
      # cheapest of the three and fails in a line naming the import.
      - name: Lint
        run: pnpm lint

      # Typecheck as well as test, for the reason `nix/web.nix` gives: a
      # component that only compiles because vite erases the types would pass
      # vitest and fail nobody, and the generated `web/src/api/types.ts` is only
      # worth generating if something checks the viewer against it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # And the Electron app's own checks, on its own sources. Beside the viewer
  # rather than inside it (ADR-0020): the two share the pnpm and the Node the
  # action above pins and nothing else, this project consuming a built binary
  # where the viewer shares a toolchain. Nothing here waits on the Rust job
  # either — what these run over is the main process's pure parts, and the
  # sidecar they are about is a stand-in rather than a compiled `verkstead`.
  desktop:
    name: Desktop
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7.0.1

      # The same pins as the viewer's, said once — see the action. No Electron
      # is downloaded by it: the package's install script is denied in
      # `desktop/pnpm-workspace.yaml`, and nothing in this job runs a window.
      - name: Set up the desktop app
        uses: ./.github/actions/setup-pnpm-project
        with:
          project: desktop

      # One rule, and it is the wall around Electron: the main process's parts
      # are functions of what the entry file hands them, so that vitest can run
      # them at all. First because it is the cheapest of the three and fails in
      # a line naming the import.
      - name: Lint
        run: pnpm lint

      # Over the tests and the sources both. `pnpm build` emits the sources
      # alone, so a test that had stopped compiling would be a test vitest ran
      # through esbuild — which strips the types rather than reading them —
      # and nobody would hear about it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
