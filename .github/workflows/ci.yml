# The project's checks, run on GitHub so that what lands on `main` has passed
# them. Everything here is pinned — the actions to a released version, the
# runner to an image rather than `ubuntu-latest`, and Rust to a patch version —
# because a check that quietly moves under us is a check nobody is reading.
name: CI

# Pull requests and pushes to `main`, which between them cover every commit
# once. A branch with an open PR would run twice if pushes to it triggered as
# well, and a branch without one has nothing to guard yet.
#
# And `release.yml`, which calls this workflow as its first job rather than
# asking GitHub whether these checks happened to have passed already. A release
# is started by hand at a moment nobody chose for its CI history, so the run
# that ships is the run that tests: red here and the release stops having
# written nothing. Calling it keeps one statement of what the checks are — a
# second copy in `release.yml` would be a copy that drifts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Nothing here writes anything back; the default token would otherwise carry
# write access to the repository's contents.
permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The version branch _is_ the pin: `@1.95.0` installs exactly that
      # toolchain, where `@stable` would move whenever Rust released. 1.95.0 is
      # what the flake's nixpkgs (nixos-26.05) carries, so CI and the dev shell
      # compile with the same rustc.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2

      # The sandbox suite runs a real `bwrap` rather than a stand-in — what it
      # checks is which paths come in writable, read-only and absent, and there
      # is no way to ask that of anything but the tool itself. The runner image
      # does not carry it.
      #
      # Present is not enough: Ubuntu 24.04 denies unprivileged user namespaces
      # through AppArmor, which is exactly what the sandbox's `--unshare-all`
      # asks for, and an installed bwrap fails at `setting up uid map` without
      # the restriction lifted. The runner is a throwaway VM whose only job is
      # this suite, so the sysctl goes off rather than a profile being written
      # for one binary.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # What `crates/desktop` links: the toolkit the app's dialogs are drawn
      # with (ADR-0012). This job builds the whole workspace, so the first push
      # of that crate is the first build that needs it — installed by a step of
      # its own rather than left to whatever the runner image happens to carry,
      # which is a thing that can be taken away without anybody deciding to. It
      # is what the AppImage carries and what the dev shell grew with the crate,
      # and it is now the only one: the tray was drawn over an appindicator
      # beside it and is spoken onto the session bus in Rust instead — see
      # `crates/desktop/Cargo.toml`. The package index is the one the step above
      # just updated.
      #
      # And `dbus-x11` for `dbus-run-session`, which nothing builds or links
      # against: the tray's suite wants a session bus with no panel on it, and a
      # runner has no session at all. Asked for under that name rather than
      # `dbus-run-session`'s own package, because it depends on it under a name
      # that has moved between releases and this one has not. See the tray step
      # at the end of this job.
      - name: Install the desktop app's toolkit
        run: |
          sudo apt-get install -y pkg-config libgtk-3-dev dbus-x11

      # For the dev-shell autodetection alone: it decides whether to wrap a
      # session's command in `nix develop` by evaluating a flake attribute, so
      # the test covering it needs a `nix` that answers. Pinned to the version
      # `nix.yml` already uses. Nothing is fetched — the flake that test writes
      # declares no inputs.
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0

      # The same surface `Sandbox::command` builds, running the same `/bin/sh`
      # the probe runs. A runner image that stops satisfying the sandbox fails
      # here, in a line naming what is missing, rather than as nine test
      # failures whose message is about the tool rather than the code.
      - name: The sandbox surface works on this runner
        run: |
          bwrap --unshare-all --share-net \
            --ro-bind /nix /nix --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 --ro-bind /etc /etc \
            --proc /proc --dev /dev --tmpfs /tmp \
            /bin/sh -c 'echo "the sandbox surface holds"'

      # Formatting and lints first: both are cheap and both fail on the kind of
      # thing that is quicker to read than a test failure.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The viewer is not built first. `web/dist` is gitignored and the embed
      # that reads it is `allow_missing`, so the crates compile without it —
      # what the viewer's own suite covers is the viewer job's business.
      - name: Test
        run: cargo test --workspace
        env:
          # Twice the suite's own clock for `crates/server/tests/sessions.rs`,
          # which stands real servers up and runs real sessions in real
          # sandboxes and judges them on wall clock. This runner has two cores
          # and is building the workspace alongside the run, so a session gets
          # descheduled past a budget it would have met on a developer's
          # machine — and what comes out is a different test failing every time,
          # none of them about the code. See `VERKSTEAD_TEST_PACE` there for why
          # one factor over the whole file rather than a longer budget here and
          # there.
          VERKSTEAD_TEST_PACE: "2"

      # `cargo test` writes `web/src/api/types.ts` through ts-rs — see
      # `.cargo/config.toml`. So a working tree that is no longer clean after
      # the run above means the committed wire types have drifted from the Rust
      # ones they are generated from, and the viewer is compiling against a
      # shape the server no longer sends.
      - name: Generated TypeScript is up to date
        run: |
          drift=$(git status --porcelain)
          if [ -n "$drift" ]; then
            echo "::error::Generated files drifted from the Rust types. Run 'cargo test' locally and commit the result."
            echo "Changed by the test run:"
            echo "$drift"
            git diff
            exit 1
          fi

      # The Linux tray, which the run above skipped and which nothing else in
      # this project asks about. The icon is published onto the session bus and
      # drawn by a panel, so the suite stands a watcher of its own on a bus of
      # its own and waits for the app's icon to arrive at it — and then does it
      # again with the watcher arriving second, which is what a desktop that
      # launches Verkstead at login looks like. See
      # `crates/desktop/tests/tray.rs`, which says why that is a test here and
      # not a line in the release workflow.
      #
      # **A bus of its own**, which is what `dbus-run-session` is for: the name
      # the suite takes is the one a panel holds, so a bus with a desktop on it
      # is a bus where this cannot run. A runner has no session bus at all, and
      # a suite that quietly passed for want of one would be no check.
      #
      # **`--ignored`**, because the tests are marked so for the reason above:
      # they are skipped by the workspace run and asked for here by name.
      # **`--test-threads=1`**, because they take turns at the one name a
      # watcher has — see the file.
      - name: The tray reaches a panel
        run: |
          dbus-run-session -- cargo test -p verkstead-desktop --test tray -- \
            --ignored --test-threads=1

  # What the same sandbox comes to on a Mac, asked of a Mac. What a session may
  # reach is one description said once, and `sandbox-exec` is the second
  # rendering of it — so what settles whether that rendering holds is a probe
  # inside a real sandbox on a real Apple machine, exactly as the Linux suite
  # settles bubblewrap's. Nothing but a Mac can answer it, which is what this
  # job is for.
  #
  # Two targets rather than the workspace: everything else in it stands on
  # bubblewrap and a Linux kernel, and a Mac has neither. The rest of what this
  # stage's code says — the policy a description renders to, read as text — is
  # unit-tested in the Rust job above, which is where a mistake in it shows up
  # in seconds rather than on a runner that has to be waited for.
  macos-sandbox:
    name: macOS sandbox
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      # The same pin as every other job, for the same reason.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      # A key of its own: this is an Apple dependency tree, and one shared with
      # the Linux job would have the two evicting each other.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: macos-sandbox

      # No `web/dist` is fetched and none is needed: the embed is
      # `allow_missing`, so the server compiles without the viewer — and what
      # this suite probes is a filesystem boundary rather than anything served.
      - name: The boundary suite
        run: cargo test -p verkstead-server --test sandbox_macos

      # And the onboarding module's own unit tests, which is where the wizard's
      # two questions for a real Mac are: whether `hw.optional.arm64` is a
      # thing `sysctl` answers, and whether `-p` is an argument `xcode-select`
      # takes. Both are `#[cfg_attr(not(target_os = "macos"), ignore)]`, so the
      # Rust job above skips them and this is the only runner that can say
      # anything about either.
      #
      # They are unit tests rather than a suite of their own, which is why this
      # is a second step and not another `--test`: `--lib` with the module's
      # own prefix runs them and the stated-machine tests around them, and no
      # other part of a library whose Linux half wants a kernel this runner has
      # not got. A stub that agreed with a wrong argument vector would pass
      # every one of those stated tests and then hold the wizard on a Mac whose
      # command line tools are installed, which is the whole of what these two
      # are for.
      #
      # Quoted because the filter ends in a colon, and YAML reads a trailing
      # one as the start of a mapping: unquoted, the file stops parsing and
      # every job in it — not just this step — never runs at all.
      - name: What the wizard asks a real Mac
        run: 'cargo test -p verkstead-server --lib onboarding::'

  # And what the same workspace comes to on Windows, asked of Windows. The
  # session machinery is compiled there like everything else — what a Windows
  # build has not got is the pseudo-terminal under it, and four leaf call sites
  # around that — so what settles whether the port holds is the compiler and the
  # suite on a real Windows machine.
  #
  # `cargo check --target` from Linux is not that: MSVC needs a Windows host to
  # link against, and a check that never links proves less than it looks like it
  # does. This job is the Windows machine this project has, and it is what will
  # say the port goes on holding.
  #
  # The desktop crate is in it, which is where the shim comes from: its tray,
  # its dialogs and its Run key are Win32, and this is the machine that compiles
  # them. The registry tests in `crates/desktop/src/startup/run_key.rs` run
  # nowhere else, and neither does `crates/desktop/tests/shim.rs` — the app
  # itself is `crates/cli/tests/desktop.rs`, which runs on every platform.
  #
  # **Two legs, each running half the suite**, because one was not enough to
  # come near the `Rust` job's ten minutes or so. Measured on the pull request
  # that brought nextest in: the job was 39–43 minutes before it, and with
  # nextest it had passed 17 minutes (a 4½-minute build, then 11½ minutes of
  # tests) with a quarter of the suite still to run. Those tests were using all
  # four of the runner's cores the whole time, so there was nothing left to gain
  # on one machine. A second leg costs a second cached build, and the repository
  # is public, so the runner itself is free.
  #
  # `slice` partitioning deals the tests out one at a time across every binary,
  # so each leg gets half of each suite rather than whole binaries, and
  # `crates/server/tests/conversations.rs`, a third of the test time on its
  # own, is split between them. What `.config/nextest.toml` holds serial is
  # serial per leg, which is all it needs to be: each leg is a machine of its
  # own, with a session account of its own.
  windows:
    name: Windows (${{ matrix.partition }}/2)
    runs-on: windows-2025
    strategy:
      # A red leg does not cancel its sibling: what the other half of the suite
      # says is worth having from the same run.
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      # Before the checkout, because it is the checkout this is about. Git for
      # Windows converts line endings on the way out of the repository by
      # default, and half of what this suite asserts is text: a fixture, a
      # rendered document, a skill written out byte for byte. A file that
      # arrived with carriage returns nobody committed is a test failing about
      # the runner rather than about the code.
      - name: Check the repository out as it was committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7.0.1

      # The same pin as every other job, for the same reason. MSVC and the
      # Windows SDK are the runner image's own — SQLite and ring are C, and this
      # is the host that can compile them for this target.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      # A key of its own, as the macOS job has: this is a third dependency tree,
      # and one shared with either of the others would have them evicting each
      # other. The two legs share it, because they build the same tree.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows

      # The one thing the sessions suite needs that the runner image has not
      # got, and it is here to prove a *negative*: no session on this platform
      # compiles through an sccache yet — see the server's
      # `build_cache::compiles_through_an_sccache`, which is where that switch is
      # and where what is left to do about it is said. A runner with no sccache
      # would start no Compile Server for want of a binary and would prove
      # nothing — so the two tests about it in
      # `crates/server/tests/sessions_windows.rs` insist on one being installed
      # and say so by failing rather than by quietly passing.

      #
      # Pinned to a release like everything else here, unpacked, and put on the
      # `PATH`: that variable is what *installed* means on this platform, both
      # for this and for the `pwsh` a Conversation Terminal opens on. Nothing
      # here compiles through it — `RUSTC_WRAPPER` is unset, so the build and
      # the test run below are as cold as they were.
      - name: Install sccache
        shell: pwsh
        run: |
          $version = 'v0.12.0'
          $release = "sccache-$version-x86_64-pc-windows-msvc"
          $archive = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          $into = Join-Path $env:RUNNER_TEMP 'sccache'

          Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/$version/$release.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $into

          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $into $release)

      # No `web/dist` here either — the embed is `allow_missing`, so the crates
      # compile without the viewer.
      #
      # The desktop crate's build script compiles the icon and the version
      # information into the shim with the SDK's `rc.exe`, which is the runner
      # image's own — see `crates/desktop/build.rs`.
      #
      # **The `shim` feature is what builds that exe at all**, and this is the
      # only job that passes it: Cargo has no way to say a `[[bin]]` is one
      # platform's, so the feature says it instead and a workspace build
      # anywhere else produces no `verkstead-desktop` — see
      # `crates/desktop/Cargo.toml`.
      - name: Build
        run: cargo build --workspace --all-targets --features verkstead-desktop/shim

      # **The session account, which no suite here can make for itself.** A
      # Windows session runs as a local account of Verkstead's own (ADR-0014,
      # amended), and creating one is an administrator's call — so every suite
      # that starts a session asks for the account this machine's Data Directory
      # already has, and fails with the line that names this verb where there is
      # none. That is `sessions_windows.rs`, the two boundary suites,
      # `account_windows.rs`, `launcher_windows.rs` and the granting tests
      # inside the server crate. A runner is elevated, so this is the one place
      # the verb can be run for them.

      #
      # The binary the step above built rather than a `cargo run`, so that
      # nothing is compiled twice — and against no `--data-dir`, because the
      # default is the one the suites resolve.
      - name: Create the session account
        run: target/debug/verkstead.exe session-account create

      # **The suite runs through nextest rather than `cargo test`.** `cargo test`
      # runs the workspace's test binaries one after another, so the step took
      # as long as every suite added together. nextest runs tests out of all of
      # them at once. What must not run at once — the suites that start
      # processes as the session account, and the registry tests — is held
      # serial by `.config/nextest.toml`, which says why.
      #
      # Pinned to a release, unpacked and put on the `PATH`, the way sccache is
      # above.
      - name: Install cargo-nextest
        shell: pwsh
        run: |
          $version = '0.9.144'
          $release = "cargo-nextest-$version"
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-nextest.zip'
          $into = Join-Path $env:RUNNER_TEMP 'cargo-nextest'

          Invoke-WebRequest -Uri "https://github.com/nextest-rs/nextest/releases/download/$release/$release-x86_64-pc-windows-msvc.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $into

          Add-Content -Path $env:GITHUB_PATH -Value $into

      # What is left out of the run is left out of the build above: a suite that
      # stands on a mount namespace or on Apple's sandbox is `cfg`-gated at its
      # own file, so this is the whole of what a Windows Verkstead has to say
      # for itself. The shim's own suite is in it under the same feature, which
      # is what runs the exe the build above made.
      #
      # **And a session end to end is in it**, which is this machine's alone to
      # answer: `crates/server/tests/sessions_windows.rs` runs a real grilling
      # on a real pseudoconsole with a PowerShell stand-in where the agent goes,
      # and `tests/sessions.rs` stays the Unix arm of the same questions.
      #
      # **And the boundary suite is in it**, which is what this job is to
      # Windows that the `macOS sandbox` job above is to a Mac:
      # `crates/server/tests/sandbox_windows.rs` has the description's entries
      # written on real directories for the session account, and runs a probe as
      # that account which attempts each access and says what the machine said.
      # It runs here rather than in a step of its own because this job already
      # runs the whole workspace — a Windows build has no suite that has to be
      # left out the way a Mac's does.

      # **To the end, whatever fails on the way.** nextest stops at its first
      # failure by default and leaves the rest of the leg unrun, which is a red
      # check saying nothing about the tests it cancelled — the same reason the
      # matrix above lets a red leg's sibling finish.
      - name: Test
        run: >
          cargo nextest run --workspace --features verkstead-desktop/shim
          --partition slice:${{ matrix.partition }}/2 --no-fail-fast

      # **And the doc-tests, which nextest does not run.** The workspace has
      # none today, so this step costs little. It is here so that the first one
      # somebody writes runs on this machine too, rather than being skipped
      # without a word — the Linux job's `cargo test` runs them already. On the
      # first leg alone: they are not partitioned, so both would run all of them.
      - name: Doc-tests
        if: matrix.partition == 1
        run: cargo test --doc --workspace --features verkstead-desktop/shim

  # The viewer's own checks, on the viewer's own sources. Nothing here waits on
  # the Rust job and nothing there waits on this one: neither produces anything
  # the other reads, so they run side by side.
  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    # Every step below is the viewer's, and `web/` is where its `package.json`
    # lives. Said once here rather than on each step.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1

      # pnpm, Node and the `--frozen-lockfile` install, shared with the release
      # workflow — see the action for what each pin is and why. A local `uses:`
      # path resolves against the checkout above, so it has to follow it.
      - name: Set up the viewer
        uses: ./.github/actions/setup-pnpm-project

      # One rule, and it is the wall around the query hook: every query in the
      # viewer goes through `useReading`, which makes it name a reconcile key
      # or declare its payload static (ADR-0009). First because it is the
      # cheapest of the three and fails in a line naming the import.
      - name: Lint
        run: pnpm lint

      # Typecheck as well as test, for the reason `nix/web.nix` gives: a
      # component that only compiles because vite erases the types would pass
      # vitest and fail nobody, and the generated `web/src/api/types.ts` is only
      # worth generating if something checks the viewer against it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # And the Electron app's own checks, on its own sources. Beside the viewer
  # rather than inside it (ADR-0020): the two share the pnpm and the Node the
  # action above pins and nothing else, this project consuming a built binary
  # where the viewer shares a toolchain. Nothing here waits on the Rust job
  # either — what these run over is the main process's pure parts, and the
  # sidecar they are about is a stand-in rather than a compiled `verkstead`.
  desktop:
    name: Desktop
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7.0.1

      # The same pins as the viewer's, said once — see the action. No Electron
      # is downloaded by it: the package's install script is denied in
      # `desktop/pnpm-workspace.yaml`, and nothing in this job runs a window.
      - name: Set up the desktop app
        uses: ./.github/actions/setup-pnpm-project
        with:
          project: desktop

      # One rule, and it is the wall around Electron: the main process's parts
      # are functions of what the entry file hands them, so that vitest can run
      # them at all. First because it is the cheapest of the three and fails in
      # a line naming the import.
      - name: Lint
        run: pnpm lint

      # Over the tests and the sources both. `pnpm build` emits the sources
      # alone, so a test that had stopped compiling would be a test vitest ran
      # through esbuild — which strips the types rather than reading them —
      # and nobody would hear about it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # **Temporary, and for this branch alone: `release.yml`'s `desktop-windows`
  # leg, run end to end on Windows.** Drop this job before the branch merges.
  #
  # That workflow cannot be rehearsed from a branch. It is dispatch-only, and its
  # `prepare` job checks out `main` whatever ref started the run and pushes a
  # version commit to it, so a dispatch from here would build main's tree and run
  # main's leg. What is left is to run the leg's own steps somewhere Windows will
  # have them, which is here — and the one thing that cannot come along is the
  # `build` matrix the leg downloads its sidecar from, so the CLI is compiled on
  # this runner instead. Every step after the pack is the leg's, word for word:
  # what is being asked is whether the assertions hold against an msi this
  # configuration packed and Windows really installed.
  #
  # `windows-2025` as the leg is. Stage 06's temporary dmg job was the same shape
  # and went the same way once it had done its job.
  the-windows-msi-leg:
    name: The msi leg (temporary)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      MSI: target/electron/out/Verkstead-x86_64.msi
    steps:
      # No `core.autocrlf` line in front of it, unlike the `Windows` job above:
      # that one is about a suite whose fixtures are text, and this is the leg's
      # own checkout, which the leg takes as it comes.
      - uses: actions/checkout@v7.0.1

      # The viewer, which the release's own leg never fetches: it is embedded
      # into the CLI at compile time, and in a Release that binary arrives
      # already carrying it. Here it is compiled, so it has to be built first.
      - name: Set up the viewer
        uses: ./.github/actions/setup-pnpm-project

      - name: Build the viewer
        working-directory: web
        run: pnpm build

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      # A key of its own, as every job that compiles has: this is the release
      # profile of one package, and a cache shared with the `Windows` job's
      # `--all-targets` debug workspace would have the two evicting each other.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-msi-leg

      # What the `build` matrix hands the leg, built here instead — the same
      # `--no-default-features` headless binary its `verkstead-windows-x64.exe`
      # row ships.
      - name: Build the CLI this app carries
        run: |
          cargo build --release --locked --no-default-features \
            --package verkstead-cli
          ls -l target/release/verkstead.exe

      - name: Set up the desktop app
        uses: ./.github/actions/setup-pnpm-project
        with:
          project: desktop

      # The leg's own pack, against the binary cargo just wrote rather than one
      # out of an artifact.
      - name: Pack the app
        working-directory: desktop
        env:
          VERKSTEAD_CLI: ${{ github.workspace }}/target/release/verkstead.exe
        run: |
          pnpm run pack
          ls -l ../target/electron/out

      - name: The msi installs
        run: |
          msi=$(cygpath -w "$MSI")
          log=$(cygpath -w msiexec.log)
          code=0
          powershell -NoProfile -Command \
            "exit (Start-Process msiexec -ArgumentList '/i',\"$msi\",'/qn','/norestart','/l*v',\"$log\" -Wait -PassThru).ExitCode" ||
            code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Windows Installer refused the msi (exit $code)."
            if [ -f msiexec.log ]; then
              tr -d '\000' < msiexec.log | tail -n 200
            else
              echo "It wrote no log either."
            fi
            exit 1
          fi

      - name: It installed into this user's profile, and nowhere else
        run: |
          install="$(cygpath -u "$LOCALAPPDATA")/Programs/Verkstead"
          for file in "$install/Verkstead.exe" "$install/resources/cli/verkstead.exe"; do
            if [ -z "$(find "$(dirname "$file")" -maxdepth 1 \
              -name "$(basename "$file")" 2> /dev/null)" ]; then
              echo "::error::$file is not there, under that spelling or at all."
              find "$install" -maxdepth 2 2> /dev/null ||
                echo "There is no $install at all."
              exit 1
            fi
          done
          ls -l "$install" "$install/resources/cli"

          registration=$(powershell -NoProfile -Command "
            \$user = @(Get-ChildItem 'HKCU:\Software\Microsoft\Installer\Products' -EA SilentlyContinue |
              Where-Object { (Get-ItemProperty \$_.PSPath -EA SilentlyContinue).ProductName -eq 'Verkstead' })
            \$machine = @(Get-ChildItem 'HKLM:\SOFTWARE\Classes\Installer\Products' -EA SilentlyContinue |
              Where-Object { (Get-ItemProperty \$_.PSPath -EA SilentlyContinue).ProductName -eq 'Verkstead' })
            \$arp = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              Where-Object DisplayName -eq 'Verkstead')
            'user=' + \$user.Count
            'machine=' + \$machine.Count
            'arp=' + ((\$arp | ForEach-Object { \$_.DisplayVersion + ' at ' + (\$_.PSPath -replace '^.*::','') }) -join '; ')
          " | tr -d '\r')
          echo "$registration"

          user=$(printf '%s\n' "$registration" | sed -n 's/^user=//p')
          machine=$(printf '%s\n' "$registration" | sed -n 's/^machine=//p')
          entry=$(printf '%s\n' "$registration" | sed -n 's/^arp=//p')

          if [ "$user" != 1 ] || [ "$machine" != 0 ]; then
            echo "::error::Verkstead is registered $user time(s) to this user and $machine to the machine, and a per-user install is 1 and 0."
            echo "What the install said about its scope:"
            if [ -f msiexec.log ]; then
              scope=$(tr -d '\000' < msiexec.log |
                grep -aiE "ALLUSERS|MSIINSTALLPERUSER|Assignment=" |
                head -n 40 || true)
              if [ -n "$scope" ]; then
                printf '%s\n' "$scope"
              else
                echo "The log says nothing about any of them."
              fi
            else
              echo "There is no msiexec.log to read."
            fi
            exit 1
          fi

          if [ -z "$entry" ]; then
            echo "::error::Verkstead registered per-user, and nothing in Installed apps can see it."
            exit 1
          fi
          echo "Installed apps says: Verkstead $entry"

          echo "INSTALL=$install" >> "$GITHUB_ENV"

      - name: The Start-menu entry opens the app, and opens no console with it
        run: |
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          lnk="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Verkstead.lnk"
          if [ ! -f "$lnk" ]; then
            echo "::error::The install left no Start-menu entry at $lnk."
            exit 1
          fi

          launcher="$INSTALL/Verkstead.exe"
          target=$(powershell -NoProfile -Command \
            "(New-Object -ComObject WScript.Shell).CreateShortcut('$(cygpath -w "$lnk")').TargetPath" |
            tr -d '\r')
          echo "The entry opens $target."
          if [ "$(lower "$(cygpath -u "$target")")" != "$(lower "$launcher")" ]; then
            echo "::error::The Start-menu entry does not open $launcher."
            exit 1
          fi

          subsystem=$(powershell -NoProfile -Command \
            "\$bytes = [IO.File]::ReadAllBytes('$(cygpath -w "$launcher")'); [BitConverter]::ToUInt16(\$bytes, [BitConverter]::ToInt32(\$bytes, 0x3c) + 92)" |
            tr -d '\r')
          echo "Its subsystem is $subsystem."
          if [ "$subsystem" != "2" ]; then
            echo "::error::$launcher is a console program, so the entry would open a window in front of the app."
            exit 1
          fi

      - name: verkstead guide answers in a fresh terminal, and the install root does not
        run: |
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          windows=$(powershell -NoProfile -Command \
            "[Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')" |
            tr -d '\r')
          fresh=$(cygpath -up "$windows")

          root=$(lower "$INSTALL")
          IFS=: read -r -a entries <<< "$fresh"
          for entry in "${entries[@]}"; do
            if [ "$(lower "${entry%/}")" = "$root" ]; then
              echo "::error::$INSTALL is on this user's PATH, and the verkstead there is the app rather than the CLI."
              printf '%s\n' "$fresh"
              exit 1
            fi
          done
          echo "The install root is not on this user's PATH."

          cli=$(lower "$INSTALL/resources/cli")
          found=$( PATH="$fresh"; command -v verkstead || true )
          found=$(printf '%s' "$found" | tr -s '/')
          echo "A fresh terminal finds ${found:-nothing}."
          case "$(lower "$found")" in
            "$cli"/verkstead | "$cli"/verkstead.exe) ;;
            *)
              echo "::error::A terminal opened after the install does not find $INSTALL/resources/cli/verkstead.exe."
              exit 1
              ;;
          esac

          guide=$( PATH="$fresh"; verkstead guide )
          printf '%s\n' "$guide" | head -n 5
          case "$guide" in
            *"Asking the human"*) ;;
            *)
              echo "::error::The installed binary printed no Guide."
              exit 1
              ;;
          esac

      - name: The window comes up, the icon goes into the tray, and the viewer is inside
        timeout-minutes: 5
        env:
          LOCALAPPDATA: ${{ runner.temp }}\state
          VERKSTEAD_DATA_DIR: ${{ runner.temp }}\data
        run: |
          log="$(cygpath -u "$LOCALAPPDATA")/Verkstead/verkstead.log"

          key=the-key-this-leg-states
          data="$(cygpath -u "$VERKSTEAD_DATA_DIR")"
          mkdir -p "$data"
          printf '%s\n' "$key" > "$data/workbench.key"

          "$INSTALL/Verkstead.exe" > app.log 2>&1 &
          app=$!
          document=$(curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused \
            --cookie "workbench_key=$key" \
            http://127.0.0.1:8422/)

          for _ in $(seq 100); do
            if grep -q "the window is opening on" "$log" 2> /dev/null &&
              grep -q "the icon is in the tray" "$log" 2> /dev/null; then
              break
            fi
            sleep 0.2
          done

          taskkill //F //IM verkstead.exe > /dev/null 2>&1 || true
          kill -9 "$app" 2> /dev/null || true
          cat app.log

          case "$document" in
            */assets/*) ;;
            *)
              echo "::error::The installed app served a document with no bundle in it."
              printf '%s\n' "$document"
              exit 1
              ;;
          esac

          for said in "the window is opening on" "the icon is in the tray"; do
            if ! grep -q "$said" "$log" 2> /dev/null; then
              echo "::error::The app's log does not say \"$said\"."
              cat "$log" 2> /dev/null || echo "There is no log at $log."
              exit 1
            fi
          done
          cat "$log"

      # The one step of the leg that reaches outside this runner. `github.token`
      # here is what `release.yml` hands it, and this workflow's `permissions`
      # block above is the same `contents: read` that leg's token carries.
      - name: The msi upgrades over itself, and over the last Release's
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          installer() {
            slug=$1
            verb=$2
            package=$3
            said=$4
            log="$PWD/msiexec-$slug.log"
            code=0
            powershell -NoProfile -Command \
              "exit (Start-Process msiexec -ArgumentList '$verb',\"$(cygpath -w "$package")\",'/qn','/norestart','/l*v',\"$(cygpath -w "$log")\" -Wait -PassThru).ExitCode" ||
              code=$?
            if [ "$code" -ne 0 ]; then
              echo "::error::Windows Installer refused $said (exit $code)."
              if [ -f "$log" ]; then
                tr -d '\000' < "$log" | tail -n 200
              else
                echo "It wrote no log either."
              fi
              exit 1
            fi
            echo "Installer: $said — done."
          }

          counts() {
            powershell -NoProfile -Command "
              \$menus = @(
                (Join-Path \$env:APPDATA 'Microsoft\Windows\Start Menu\Programs'),
                (Join-Path \$env:ProgramData 'Microsoft\Windows\Start Menu\Programs')
              ) | Where-Object { Test-Path \$_ }
              \$arp = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
                Where-Object DisplayName -eq 'Verkstead')
              \$path = @([Environment]::GetEnvironmentVariable('Path','User') -split ';' |
                Where-Object { \$_ -like '*Verkstead*' })
              \$menu = @(\$menus | ForEach-Object { Get-ChildItem \$_ -Recurse -Filter 'Verkstead*.lnk' -EA SilentlyContinue })
              'arp=' + \$arp.Count
              'path=' + \$path.Count
              'menu=' + \$menu.Count
              'says=Installed apps: ' + ((\$arp | ForEach-Object { \$_.DisplayVersion + ' at ' + (\$_.PSPath -replace '^.*::','') }) -join '; ')
              'says=PATH: ' + (\$path -join '; ')
              'says=Start menu: ' + ((\$menu | ForEach-Object { \$_.FullName }) -join '; ')
            " | tr -d '\r'
          }

          one() {
            said=$1
            report=$(counts)
            echo "After $said, the machine holds:"
            printf '%s\n' "$report" | sed -n 's/^says=/  /p'
            for pair in "arp=rows in Installed apps" "path=PATH entries" \
              "menu=Start-menu entries"; do
              got=$(printf '%s\n' "$report" | sed -n "s/^${pair%%=*}=//p")
              if [ "$got" != 1 ]; then
                echo "::error::After $said there are $got ${pair#*=} for Verkstead, and an upgrade leaves one."
                printf '%s\n' "$report"
                exit 1
              fi
            done
            echo "One row in Installed apps, one PATH entry, one Start-menu entry."
          }

          installer over-itself /i "$PWD/$MSI" \
            "this msi over the copy already installed"
          one "installing it over itself"

          tag=$(gh release view --json tagName --jq .tagName 2> release.err) || tag=
          if [ -z "$tag" ]; then
            echo "::warning::There is no Release to fetch an msi from, so the upgrade over the package before this one went unchecked."
            cat release.err
            exit 0
          fi
          echo "The last Release is $tag."

          if [ -z "$(gh release view "$tag" --json assets \
            --jq '.assets[].name | select(. == "Verkstead-x86_64.msi")')" ]; then
            echo "::warning::The last Release, $tag, carries no Verkstead-x86_64.msi, so the upgrade over the package before this one went unchecked."
            exit 0
          fi

          gh release download "$tag" --pattern Verkstead-x86_64.msi --dir previous
          ls -l previous

          installer uninstall /x "$PWD/$MSI" \
            "the uninstall that makes room for $tag's package"
          installer previous /i "$PWD/previous/Verkstead-x86_64.msi" \
            "$tag's msi, the package a machine is upgrading from"
          installer over-previous /i "$PWD/$MSI" "this msi over $tag's"
          one "installing it over $tag's msi"
