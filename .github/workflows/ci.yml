# The project's checks, run on GitHub so that what lands on `main` has passed
# them. Everything here is pinned — the actions to a released version, the
# runner to an image rather than `ubuntu-latest`, and Rust to a patch version —
# because a check that quietly moves under us is a check nobody is reading.
name: CI

# Pull requests and pushes to `main`, which between them cover every commit
# once. A branch with an open PR would run twice if pushes to it triggered as
# well, and a branch without one has nothing to guard yet.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back; the default token would otherwise carry
# write access to the repository's contents.
permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The version branch _is_ the pin: `@1.91.1` installs exactly that
      # toolchain, where `@stable` would move whenever Rust released. 1.91.1 is
      # what the flake's nixpkgs (nixos-25.11) carries, so CI and the dev shell
      # compile with the same rustc.
      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2

      # The sandbox suite runs a real `bwrap` rather than a stand-in — what it
      # checks is which paths come in writable, read-only and absent, and there
      # is no way to ask that of anything but the tool itself. The runner image
      # does not carry it.
      #
      # Present is not enough: Ubuntu 24.04 denies unprivileged user namespaces
      # through AppArmor, which is exactly what the sandbox's `--unshare-all`
      # asks for, and an installed bwrap fails at `setting up uid map` without
      # the restriction lifted. The runner is a throwaway VM whose only job is
      # this suite, so the sysctl goes off rather than a profile being written
      # for one binary.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # What `crates/desktop` links: the toolkit the tray icon and the app's one
      # dialog are drawn with, and the tray protocol over it (ADR-0012). This
      # job builds the whole workspace, so the first push of that crate is the
      # first build that needs them — installed by a step of their own rather
      # than left to whatever the runner image happens to carry, which is a
      # thing that can be taken away without anybody deciding to. The same two
      # are what the AppImage carries and what the dev shell grew with the
      # crate. The package index is the one the step above just updated.
      - name: Install the desktop app's toolkit
        run: |
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev

      # For the dev-shell autodetection alone: it decides whether to wrap a
      # session's command in `nix develop` by evaluating a flake attribute, so
      # the test covering it needs a `nix` that answers. Pinned to the version
      # `nix.yml` already uses. Nothing is fetched — the flake that test writes
      # declares no inputs.
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0

      # The same surface `Sandbox::command` builds, running the same `/bin/sh`
      # the probe runs. A runner image that stops satisfying the sandbox fails
      # here, in a line naming what is missing, rather than as nine test
      # failures whose message is about the tool rather than the code.
      - name: The sandbox surface works on this runner
        run: |
          bwrap --unshare-all --share-net \
            --ro-bind /nix /nix --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 --ro-bind /etc /etc \
            --proc /proc --dev /dev --tmpfs /tmp \
            /bin/sh -c 'echo "the sandbox surface holds"'

      # Formatting and lints first: both are cheap and both fail on the kind of
      # thing that is quicker to read than a test failure.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The viewer is not built first. `web/dist` is gitignored and the embed
      # that reads it is `allow_missing`, so the crates compile without it —
      # what the viewer's own suite covers is the viewer job's business.
      - name: Test
        run: cargo test --workspace
        env:
          # Twice the suite's own clock for `crates/server/tests/sessions.rs`,
          # which stands real servers up and runs real sessions in real
          # sandboxes and judges them on wall clock. This runner has two cores
          # and is building the workspace alongside the run, so a session gets
          # descheduled past a budget it would have met on a developer's
          # machine — and what comes out is a different test failing every time,
          # none of them about the code. See `VERKSTEAD_TEST_PACE` there for why
          # one factor over the whole file rather than a longer budget here and
          # there.
          VERKSTEAD_TEST_PACE: "2"

      # `cargo test` writes `web/src/api/types.ts` through ts-rs — see
      # `.cargo/config.toml`. So a working tree that is no longer clean after
      # the run above means the committed wire types have drifted from the Rust
      # ones they are generated from, and the viewer is compiling against a
      # shape the server no longer sends.
      - name: Generated TypeScript is up to date
        run: |
          drift=$(git status --porcelain)
          if [ -n "$drift" ]; then
            echo "::error::Generated files drifted from the Rust types. Run 'cargo test' locally and commit the result."
            echo "Changed by the test run:"
            echo "$drift"
            git diff
            exit 1
          fi

  # What the same sandbox comes to on a Mac, asked of a Mac. What a session may
  # reach is one description said once, and `sandbox-exec` is the second
  # rendering of it — so what settles whether that rendering holds is a probe
  # inside a real sandbox on a real Apple machine, exactly as the Linux suite
  # settles bubblewrap's. Nothing but a Mac can answer it, which is what this
  # job is for.
  #
  # One suite rather than the workspace: everything else in it stands on
  # bubblewrap and a Linux kernel, and a Mac has neither. The rest of what this
  # stage's code says — the policy a description renders to, read as text — is
  # unit-tested in the Rust job above, which is where a mistake in it shows up
  # in seconds rather than on a runner that has to be waited for.
  macos-sandbox:
    name: macOS sandbox
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      # The same pin as every other job, for the same reason.
      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1

      # A key of its own: this is an Apple dependency tree, and one shared with
      # the Linux job would have the two evicting each other.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: macos-sandbox

      # No `web/dist` is fetched and none is needed: the embed is
      # `allow_missing`, so the server compiles without the viewer — and what
      # this suite probes is a filesystem boundary rather than anything served.
      - name: The boundary suite
        run: cargo test -p verkstead-server --test sandbox_macos

  # And what the same workspace comes to on Windows, asked of Windows. The
  # session machinery is compiled there like everything else — what a Windows
  # build has not got is the pseudo-terminal under it, and four leaf call sites
  # around that — so what settles whether the port holds is the compiler and the
  # suite on a real Windows machine.
  #
  # `cargo check --target` from Linux is not that: MSVC needs a Windows host to
  # link against, and a check that never links proves less than it looks like it
  # does. This job is the Windows machine this project has, and it is what will
  # say the port goes on holding.
  #
  # The desktop crate is in it, which is where the shim comes from: its tray,
  # its dialogs and its Run key are Win32, and this is the machine that compiles
  # them. The registry tests in `crates/desktop/src/startup/run_key.rs` run
  # nowhere else, and neither does `crates/desktop/tests/shim.rs` — the app
  # itself is `crates/cli/tests/desktop.rs`, which runs on every platform.
  windows:
    name: Windows
    runs-on: windows-2025
    steps:
      # Before the checkout, because it is the checkout this is about. Git for
      # Windows converts line endings on the way out of the repository by
      # default, and half of what this suite asserts is text: a fixture, a
      # rendered document, a skill written out byte for byte. A file that
      # arrived with carriage returns nobody committed is a test failing about
      # the runner rather than about the code.
      - name: Check the repository out as it was committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7.0.1

      # The same pin as every other job, for the same reason. MSVC and the
      # Windows SDK are the runner image's own — SQLite and ring are C, and this
      # is the host that can compile them for this target.
      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1

      # A key of its own, as the macOS job has: this is a third dependency tree,
      # and one shared with either of the others would have them evicting each
      # other.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows

      # No `web/dist` here either — the embed is `allow_missing`, so the crates
      # compile without the viewer.
      #
      # The desktop crate's build script compiles the icon and the version
      # information into the shim with the SDK's `rc.exe`, which is the runner
      # image's own — see `crates/desktop/build.rs`.
      #
      # **The `shim` feature is what builds that exe at all**, and this is the
      # only job that passes it: Cargo has no way to say a `[[bin]]` is one
      # platform's, so the feature says it instead and a workspace build
      # anywhere else produces no `verkstead-desktop` — see
      # `crates/desktop/Cargo.toml`.
      - name: Build
        run: cargo build --workspace --all-targets --features verkstead-desktop/shim

      # What is left out of the run is left out of the build above: a suite that
      # stands on a mount namespace, on Apple's sandbox or on a pseudo-terminal
      # is `cfg`-gated at its own file, so this is the whole of what a Windows
      # Verkstead has to say for itself. The shim's own suite is in it under the
      # same feature, which is what runs the exe the build above made.
      - name: Test
        run: cargo test --workspace --features verkstead-desktop/shim

  # The viewer's own checks, on the viewer's own sources. Nothing here waits on
  # the Rust job and nothing there waits on this one: neither produces anything
  # the other reads, so they run side by side.
  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    # Every step below is the viewer's, and `web/` is where its `package.json`
    # lives. Said once here rather than on each step.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1

      # pnpm, Node and the `--frozen-lockfile` install, shared with the release
      # workflow — see the action for what each pin is and why. A local `uses:`
      # path resolves against the checkout above, so it has to follow it.
      - name: Set up the viewer
        uses: ./.github/actions/setup-viewer

      # One rule, and it is the wall around the query hook: every query in the
      # viewer goes through `useReading`, which makes it name a reconcile key
      # or declare its payload static (ADR-0009). First because it is the
      # cheapest of the three and fails in a line naming the import.
      - name: Lint
        run: pnpm lint

      # Typecheck as well as test, for the reason `nix/web.nix` gives: a
      # component that only compiles because vite erases the types would pass
      # vitest and fail nobody, and the generated `web/src/api/types.ts` is only
      # worth generating if something checks the viewer against it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
