# Throwaway: install-on-desktop task 05 — the release's own Mac steps, run verbatim out of
# release.yml: mount, --install out of the mount, then the shown launch and the notification
# on the installed copy. Lives only on the `macos-pack-probe` branch and merges nowhere.
name: Mac install-offer probe

on:
  push:
    branches: [macos-pack-probe]

permissions:
  contents: read

jobs:
  the-offer:
    name: The release's Mac install steps
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DMG: target/electron/out/Verkstead-universal.dmg
      MOUNT: target/electron/mounted
      APP: target/electron/mounted/Verkstead.app
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up the viewer
        uses: ./.github/actions/setup-pnpm-project

      - name: Build the viewer
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: pnpm build

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: macos-dmg-leg

      - name: Build both halves of the sidecar
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --no-default-features \
              --package verkstead-cli --target "$target"
          done
          mkdir -p sidecar
          cp target/aarch64-apple-darwin/release/verkstead sidecar/verkstead-macos-arm64
          cp target/x86_64-apple-darwin/release/verkstead sidecar/verkstead-macos-x64

      - name: Set up the desktop app
        uses: ./.github/actions/setup-pnpm-project
        with:
          project: desktop

      # The release's own pack step, verbatim: signed and notarized, so the
      # dmg is what a downloader gets and Gatekeeper treats it as one.
      - name: Pack the app
        working-directory: desktop
        env:
          ARM64: ${{ github.workspace }}/sidecar/verkstead-macos-arm64
          X64: ${{ github.workspace }}/sidecar/verkstead-macos-x64
          CERTIFICATE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ruby -ryaml -e '
            steps = YAML.load_file("../.github/workflows/release.yml")["jobs"]["desktop-macos"]["steps"]
            print steps.find { |s| s["name"] == "Pack the app" }["run"]
          ' > "$RUNNER_TEMP/pack.sh"
          bash -e -o pipefail "$RUNNER_TEMP/pack.sh" > "$RUNNER_TEMP/pack.log" 2>&1
          status=$?
          grep -E "^(Signing|Not notarizing|Notarizing|The app )" "$RUNNER_TEMP/pack.log"
          exit $status


      - name: "release: The dmg mounts"
        if: always()
        timeout-minutes: 3
        run: |
          ruby -ryaml -e '
            steps = YAML.load_file(".github/workflows/release.yml")["jobs"]["desktop-macos"]["steps"]
            print steps.find { |s| s["name"] == ARGV[0] }["run"]
          ' "The dmg mounts" > "$RUNNER_TEMP/step.sh"
          bash -e "$RUNNER_TEMP/step.sh"

      - name: "release: The app installs itself out of the dmg into /Applications"
        if: always()
        timeout-minutes: 6
        run: |
          ruby -ryaml -e '
            steps = YAML.load_file(".github/workflows/release.yml")["jobs"]["desktop-macos"]["steps"]
            print steps.find { |s| s["name"] == ARGV[0] }["run"]
          ' "The app installs itself out of the dmg into /Applications" > "$RUNNER_TEMP/step.sh"
          bash -e "$RUNNER_TEMP/step.sh"

      - name: "release: The window comes up, the icon goes into the menu bar, and the viewer is inside"
        if: always()
        timeout-minutes: 6
        env:
          VERKSTEAD_DATA_DIR: ${{ runner.temp }}/data
        run: |
          ruby -ryaml -e '
            steps = YAML.load_file(".github/workflows/release.yml")["jobs"]["desktop-macos"]["steps"]
            print steps.find { |s| s["name"] == ARGV[0] }["run"]
          ' "The window comes up, the icon goes into the menu bar, and the viewer is inside" > "$RUNNER_TEMP/step.sh"
          bash -e "$RUNNER_TEMP/step.sh"

      - name: "release: A notice is shown as a notification"
        if: always()
        timeout-minutes: 6
        env:
          VERKSTEAD_DATA_DIR: ${{ runner.temp }}/data
        run: |
          ruby -ryaml -e '
            steps = YAML.load_file(".github/workflows/release.yml")["jobs"]["desktop-macos"]["steps"]
            print steps.find { |s| s["name"] == ARGV[0] }["run"]
          ' "A notice is shown as a notification" > "$RUNNER_TEMP/step.sh"
          bash -e "$RUNNER_TEMP/step.sh"

      - name: "release: Unmount the dmg"
        if: always()
        timeout-minutes: 3
        run: |
          ruby -ryaml -e '
            steps = YAML.load_file(".github/workflows/release.yml")["jobs"]["desktop-macos"]["steps"]
            print steps.find { |s| s["name"] == ARGV[0] }["run"]
          ' "Unmount the dmg" > "$RUNNER_TEMP/step.sh"
          bash -e "$RUNNER_TEMP/step.sh"
