# The share viewer, hosted. A published share is a secret gist, and a browser
# draws a gist as source rather than as a page; the viewer is the small static
# page that fetches one and draws it properly. The binary hands that file over
# for whoever wants to host their own copy — and this workflow keeps the copy
# nobody has to host, at
# <https://tobico.github.io/verkstead/share-viewer.html>, which is the address
# every share link Verkstead composes points at by default.
#
# Pinned throughout, as the other workflows are: the actions to released
# versions, and the runners to images rather than `-latest`.
name: Pages

# The viewer landing on `main`, and nothing else. The page is one file with no
# build and no dependency, so no other commit changes what is served. This
# workflow is in the list beside it because a change to how the page is
# published is a reason to publish it again.
#
# `workflow_dispatch` is the first run and the recovery: a site has to be
# deployed once before it exists, and a deployment that went wrong is re-run
# from the Actions tab rather than by pushing an empty commit at it.
on:
  push:
    branches: [main]
    paths:
      - crates/server/share-viewer.html
      - .github/workflows/pages.yml
  workflow_dispatch:

# Read at the top, so the job that checks the repository out holds a token that
# can do nothing else. The deploy job widens it for itself, and neither job is
# ever given `contents: write` — nothing here writes to the repository.
permissions:
  contents: read

# One deployment at a time. Two runs racing would leave whichever finished last
# live, which is not necessarily the newer file. Queued rather than cancelled:
# a cancelled run publishes nothing, and there is only ever one page.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site, which is the one file under the name it is served as.
  # `share-viewer.html` rather than the `verkstead-share-viewer.html` the
  # download hands over: that name is for a file landing in somebody's
  # Downloads folder beside everything else, and this one is alone in a
  # directory of its own. The URL it makes is what task 04 bakes in as the
  # default, so the name is not free to move.
  site:
    name: Site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp crates/server/share-viewer.html _site/share-viewer.html
          ls -l _site

      # The Pages flavour of `upload-artifact` rather than the plain one: the
      # deployment reads a tarball laid out its way, which is the whole of what
      # this action does before handing off to the upload the other workflows
      # use.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: site
    runs-on: ubuntu-24.04
    # The only job that is given anything: `pages: write` to turn the site on
    # and publish to it, and `id-token: write` for the token `deploy-pages`
    # mints to prove to the Pages service that this run is the one it claims to
    # be. A job's `permissions` replaces the file's rather than adding to it, so
    # this job cannot read the repository either — it wants the artifact, and
    # none of the sources.
    permissions:
      pages: write
      id-token: write
    # Where the deployment is recorded, and where the URL beside the run in the
    # Actions tab comes from.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages, turned on by the run rather than by somebody in Settings. The
      # repository had no site at all when this was written, and a workflow that
      # only works once a human has clicked something is a workflow that does
      # not work.
      #
      # `build_type: workflow` is the source: what a run deploys is what is
      # served, rather than the contents of a branch. Every run after the first
      # finds the site already there and says so.
      #
      # `gh` rather than `actions/configure-pages`, for the reason the release
      # workflow gives about `gh release`: it is on the runner already and takes
      # the run's own token, so there is no third-party version to pin for what
      # is one API call — and the refusal below is a sentence naming the switch
      # to flip rather than an action's stack trace. GitHub documents creating a
      # site as wanting administration rights, which no workflow token can be
      # given; if that is what it decides here, the manual trigger above is how
      # this is run again once somebody has turned Pages on by hand.
      - name: Pages is on
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Read only from a call that succeeded: `gh` prints the error
          # response to standard output as well as failing, so a plain
          # substitution would hand the 404's own JSON on as the answer.
          if ! source=$(gh api "repos/$GH_REPO/pages" --jq .build_type 2>/dev/null); then
            source=""
          fi
          case "$source" in
            workflow)
              echo "Pages is on, serving what this workflow deploys."
              ;;
            "")
              if gh api --method POST "repos/$GH_REPO/pages" \
                -f build_type=workflow; then
                echo "Pages is on now, serving what this workflow deploys."
              else
                echo "::error::GitHub would not turn Pages on with this run's token. Turn it on once under Settings → Pages, with the source set to GitHub Actions, and run this workflow again."
                exit 1
              fi
              ;;
            *)
              echo "::error::Pages is on, but it serves $source rather than what a workflow deploys. Set the source to GitHub Actions under Settings → Pages."
              exit 1
              ;;
          esac

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.0

      # What is live, read back over the public URL rather than taken on trust
      # from the deployment's own status — and read at the exact address the
      # viewer is promised at, because that string is written into Verkstead as
      # the default viewer. A run that published the page somewhere else has to
      # say so here, rather than leaving every share link pointing at a 404.
      #
      # `--retry-all-errors` for the moment between a deployment reporting
      # success and the CDN in front of it answering with the new file.
      - name: The viewer is up
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: https://tobico.github.io/verkstead/share-viewer.html
        run: |
          url="${PAGE_URL%/}/share-viewer.html"
          echo "$url"
          if [ "$url" != "$EXPECTED" ]; then
            echo "::error::The viewer is at $url, where Verkstead links to $EXPECTED."
            exit 1
          fi
          page=$(curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 3 --retry-all-errors "$url")
          # The page it drew, rather than the 404 Pages serves with a 404
          # status that `--fail` would already have caught. The title is the
          # viewer's own and nothing else on the site carries it.
          case "$page" in
            *"<title>Verkstead share</title>"*) ;;
            *)
              echo "::error::$url does not answer with the share viewer."
              printf '%s\n' "$page" | head -20
              exit 1
              ;;
          esac
