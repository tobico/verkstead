# How `cargo nextest run` runs this workspace, which is how the `Rust` and
# `Windows` jobs in `.github/workflows/ci.yml` run their suites, over legs of
# their own. The macOS job, the package-stores job and a plain `cargo test`
# anywhere go by libtest alone, and lose nothing by it: a lock in a `static`
# still does its work there.
#
# **nextest runs every test in a process of its own, and tests out of every
# binary at once** — which is the whole of what it is there for, and is also
# what a suite written for `cargo test` cannot take for granted. There, one
# binary ran after another and a binary's tests shared one process, so a lock
# in a `static` was enough to keep them in order. Here it keeps nothing in
# order: every test has a copy of its own. What those locks were guarding is
# the machine's rather than the process's, so it is held here instead.
#
# And what a `static` was rationing rather than guarding goes to nextest's own
# thread count, which is the machine's cores: `ROOM` in
# `crates/server/tests/suite/sessions.rs` caps how many fixtures one process
# stands up at once, and a process of one test never reaches it. Nothing
# needs saying here for it — four tests at once on a four-core leg is the load
# libtest put on the same runner.

[test-groups]
session-account = { max-threads = 1 }
compile-server = { max-threads = 1 }

# **The suites that start processes as the session account**, one test at a
# time across all of them. Three things they share are the machine's, and each
# was kept in order by a lock in the process:
#
# - An entry is written by reading a directory's list and writing the list back,
#   and these write entries on directories in common — the profile every
#   test's temporary directory is under, on the way to its own. Two writes at
#   once lose one of the grants: see `ONE_AT_A_TIME` in
#   `crates/server/src/sandbox/granting/writing.rs`.
# - The secondary logon service performs one logon at a time, machine-wide, and
#   what waits a collision out is a two-second retry: see `ONE_AT_A_TIME` in
#   `crates/server/src/sandbox/starting.rs`.
# - The two tests that count sccache servers do it by diffing the machine's
#   process list: see `COUNTING` in `crates/server/tests/suite/sessions_windows.rs`.
#
# Serial rather than a small number, because the first of those goes wrong
# rather than slow: a session behind a narrower boundary than its description
# is a test failing about the scheduler. The in-crate tests are the `writing`
# module's alone — the rest of the server's own tests on this platform name
# identities without logging on as one.
#
# **And first on their leg rather than last, bar the sessions.** The first
# boundary on a runner writes a step on the runner's own profile directory, and
# writing that list makes Windows walk everything under the profile: 55 seconds
# of one test, once a leg, whichever test it falls to (run 40785712519). Every
# boundary after it finds the step standing. That cost is the machine's and not
# a test's, so it cannot come out of the tests — but at the default priority
# this group sorts near the end of every leg, so one test was alone at the
# tail. Started first, the boundary and login tests' one-at-a-time turns run
# beside the rest of the leg on the other threads instead of after it. Nothing
# here waits on another test having run first: a test of this group on a leg
# of its own still passes.
#
# `sessions_windows` keeps the default and its place near the end. Its sessions
# compile Rust and drive live terminals, the heaviest work in the group, and
# the end of a leg is where they have the machine to themselves: about thirty
# seconds each there. The first override to set a priority is the one a test
# takes, so this one goes ahead of the group's.
[[profile.default.overrides]]
filter = 'binary_id(verkstead-server::suite) & test(/^sessions_windows::/)'
priority = 0

[[profile.default.overrides]]
filter = '''
    (binary_id(verkstead-server::suite) & test(/^(sessions_windows|logins_windows|sandbox_windows|account_windows)::/))
  | (binary_id(verkstead-cli::suite) & test(/^(sandbox_windows|launcher_windows)::/))
  | (binary_id(verkstead-server) & test(/^sandbox::granting::writing::tests::/))
'''
test-group = 'session-account'
priority = 100

# **The one test that waits on a PowerShell to say something**, with nothing
# else running beside it. A first `powershell.exe` on the runner is slow on its
# own — this test took 24 seconds there under `cargo test`, its binary the only
# thing running — and beside three other tests, one of them a session compiling
# Rust, it spent the whole of its sixty seconds of `PATIENCE` with nothing
# printed, every time. It shares nothing with another test, so it is not a
# group: what it needs is the machine rather than a turn.
[[profile.default.overrides]]
filter = 'binary_id(verkstead-server::suite) & test(=terminal_windows::a_child_that_is_dropped_takes_what_it_started_with_it)'
threads-required = 'num-test-threads'

# **The proofs that start a Compile Server**, on Linux, one at a time. A
# Compile Server listens on sccache's own port, 4226, and there is one of those
# to a machine, so two at once would be one proof's client reaching the other's
# server: see `ON_THE_PORT` in `crates/server/tests/suite/package_stores.rs`,
# the lock that kept them apart in one process.
#
# In the `Rust` job these proofs skip, for want of CMake, Ninja and sccache on
# the runner — the `Package stores` job is where they run, and it runs them
# under libtest. The group is here so that a leg stays right if the image ever
# grows the tools, and so that a developer's own `cargo nextest run` does.
[[profile.default.overrides]]
filter = '''
    binary_id(verkstead-server::suite)
  & ( test(=package_stores::cmake_compiles_through_the_compile_server_and_a_rebuild_or_a_second_conversation_is_all_hits)
    | test(=package_stores::rust_compiles_again_through_a_cleared_sccache) )
'''
test-group = 'compile-server'
